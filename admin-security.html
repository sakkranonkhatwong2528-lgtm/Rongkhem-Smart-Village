<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
จัดการความปลอดภัยชุมชน | บ้านร่องเข็ม Smart Village
</title>


<style>

body{

margin:0;
font-family:Tahoma,sans-serif;
background:#e3f2fd;

}


header{

background:#1565c0;
color:white;
padding:30px;
text-align:center;

}


.container{

padding:20px;

}


.card{

background:white;
padding:25px;
border-radius:25px;
box-shadow:0 4px 12px #ccc;

}



input,textarea{

width:100%;
padding:12px;
margin:10px 0;
border-radius:10px;
border:1px solid #ccc;
box-sizing:border-box;

}



button{

background:#1565c0;
color:white;
padding:12px 30px;
border:none;
border-radius:20px;

}



.result{

background:#e3f2fd;
padding:20px;
margin-top:20px;
border-radius:20px;

}



.back{

text-align:center;
margin:30px;

}



.back a{

background:#1565c0;
color:white;
padding:12px 25px;
border-radius:20px;
text-decoration:none;

}

</style>


</head>



<body>



<header>

<h1>
🛡 จัดการความปลอดภัยชุมชน
</h1>

<p>
Admin บ้านร่องเข็ม Smart Village
</p>

</header>






<div class="container">


<div class="card">



<h2>
📋 ข้อมูลความปลอดภัย
</h2>



<label>
🛡 จำนวน ชรบ.
</label>

<input 
id="shorbor"
type="number"
placeholder="เช่น 15">





<label>
🚒 จำนวน อปพร.
</label>

<input 
id="orporn"
type="number"
placeholder="จำนวน อปพร.">





<label>
🚨 จำนวนเหตุการณ์แจ้งเตือน
</label>

<input
id="incident"
type="number"
placeholder="จำนวนเหตุ">





<label>
👥 รายชื่อชุดปฏิบัติงาน
</label>

<textarea
id="team"
rows="5"
placeholder="รายชื่อ ชรบ. / อปพร.">
</textarea>





<label>
📅 ตารางเวรตรวจหมู่บ้าน
</label>

<textarea
id="schedule"
rows="5"
placeholder="เช่น เวรกลางคืน วันจันทร์-อาทิตย์">
</textarea>






<button onclick="saveSecurity()">

💾 บันทึกข้อมูล

</button>





<div class="result" id="show">

</div>



</div>


</div>







<div class="back">

<a href="admin-dashboard.html">

⚙️ กลับ Dashboard

</a>

</div>







<script>



loadSecurity();




function saveSecurity(){



let data={


shorbor:

document.getElementById("shorbor").value,


orporn:

document.getElementById("orporn").value,


incident:

document.getElementById("incident").value,


team:

document.getElementById("team").value,


schedule:

document.getElementById("schedule").value


};




localStorage.setItem(

"security",

JSON.stringify(data)

);




alert("บันทึกข้อมูลความปลอดภัยแล้ว");



showSecurity();



}





function loadSecurity(){


let data=

JSON.parse(

localStorage.getItem("security")

);



if(data){


document.getElementById("shorbor").value=data.shorbor;


document.getElementById("orporn").value=data.orporn;


document.getElementById("incident").value=data.incident;


document.getElementById("team").value=data.team;


document.getElementById("schedule").value=data.schedule;


}



showSecurity();


}







function showSecurity(){



let data=

JSON.parse(

localStorage.getItem("security")

);



if(!data)return;



document.getElementById("show").innerHTML=`

<h3>
ข้อมูลปัจจุบัน
</h3>


<p>
🛡 ชรบ. : ${data.shorbor} คน
</p>


<p>
🚒 อปพร. : ${data.orporn} คน
</p>


<p>
🚨 เหตุการณ์ : ${data.incident} ครั้ง
</p>


<p>
👥 ทีมปฏิบัติงาน :
<br>
${data.team}
</p>


<p>
📅 ตารางเวร :
<br>
${data.schedule}
</p>


`;



}



</script>



</body>

</html>
