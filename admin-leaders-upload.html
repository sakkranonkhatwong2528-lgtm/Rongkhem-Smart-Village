<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin จัดการผู้นำ | บ้านร่องเข็ม</title>

<style>

body{
font-family:"Sarabun",sans-serif;
background:#f1f5f9;
padding:20px;
}

.container{
max-width:1200px;
margin:auto;
}

.header{
background:#166534;
color:white;
padding:25px;
border-radius:20px;
text-align:center;
}

.card{
background:white;
border-radius:18px;
padding:20px;
margin-top:20px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}


input,button{

padding:12px;
border-radius:10px;
border:1px solid #ddd;
font-size:16px;

}


button{

background:#166534;
color:white;
cursor:pointer;

}


table{

width:100%;
border-collapse:collapse;
margin-top:20px;

}


th{

background:#dcfce7;

}


td,th{

padding:12px;
border-bottom:1px solid #ddd;
text-align:center;

}


img{

width:60px;
height:60px;
border-radius:50%;
object-fit:cover;

}


.search{

width:100%;
margin-top:15px;

}


</style>

</head>


<body>


<div class="container">


<div class="header">

<h1>👨‍💻 Admin Center</h1>

<h2>จัดการทำเนียบผู้นำและคณะทำงาน</h2>

<p>
บ้านร่องเข็ม หมู่ที่ 6
ตำบลจำป่าหวาย จังหวัดพะเยา
</p>

</div>



<div class="card">


<h2>👥 รายชื่อผู้นำ</h2>


<input 
class="search"
id="search"
placeholder="ค้นหาชื่อ / ตำแหน่ง"
onkeyup="searchLeader()">


<table>


<thead>

<tr>

<th>รูป</th>
<th>ชื่อ</th>
<th>ตำแหน่ง</th>
<th>ฝ่าย</th>
<th>สถานะ</th>
<th>จัดการ</th>

</tr>

</thead>


<tbody id="table">

</tbody>


</table>


</div>



</div>



<script>


let leaders=[];


// โหลดข้อมูล

fetch("data/leader.json")


.then(res=>res.json())


.then(data=>{


leaders=data.leaders || [];

showTable(leaders);


})

.catch(()=>{


document.getElementById("table").innerHTML=

`
<tr>
<td colspan="6">
โหลดข้อมูลไม่สำเร็จ
</td>
</tr>
`;

});





function showTable(data){


let html="";


data.forEach(item=>{


html+=`

<tr>

<td>

<img src="${item.image || 'images/leader.jpg'}">

</td>


<td>${item.name}</td>


<td>${item.position}</td>


<td>${item.department}</td>


<td>${item.status}</td>


<td>


<button onclick="editLeader(${item.id})">
✏️ แก้ไข
</button>


<button onclick="deleteLeader(${item.id})">
🗑 ลบ
</button>


</td>


</tr>


`;

});


document.getElementById("table").innerHTML=html;


}





function searchLeader(){


let key=document
.getElementById("search")
.value
.toLowerCase();



let result=leaders.filter(item=>{


return (

item.name.toLowerCase().includes(key)

||

item.position.toLowerCase().includes(key)

||

item.department.toLowerCase().includes(key)

);


});


showTable(result);


}





function editLeader(id){


let item=leaders.find(x=>x.id===id);


alert(
"แก้ไขข้อมูล\n\n"+
item.name+
"\n\nขั้นต่อไปเชื่อมฐานข้อมูล"
);


}





function deleteLeader(id){


let item=leaders.find(x=>x.id===id);


if(confirm(
"ต้องการลบ "+item.name+" หรือไม่?"
)){


alert(
"ตอนนี้ JSON ยังเป็นแบบอ่านอย่างเดียว\nต้องเชื่อมฐานข้อมูลก่อน"
);


}


}


</script>


</body>

</html>
