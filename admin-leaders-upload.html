<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>จัดการทำเนียบผู้นำ | บ้านร่องเข็ม Smart Village</title>

<style>

body{
font-family:Tahoma,sans-serif;
background:#e8f5e9;
margin:0;
}

header{
background:#2e7d32;
color:white;
padding:20px;
text-align:center;
}

.container{
padding:20px;
}

.box{
background:white;
border-radius:20px;
padding:20px;
margin-bottom:20px;
box-shadow:0 3px 10px #aaa;
}

input,button{

width:95%;
padding:12px;
margin:8px;
border-radius:15px;
border:1px solid #ccc;

}

button{

background:#2e7d32;
color:white;
border:none;
font-size:16px;

}


.preview{

width:130px;
height:130px;
border-radius:50%;
object-fit:cover;
border:3px solid #2e7d32;

}


.card{

background:#f9f9f9;
padding:15px;
border-radius:15px;
margin-top:15px;

}


</style>

</head>


<body>


<header>

<h1>👥 จัดการทำเนียบผู้นำ</h1>

<p>
บ้านร่องเข็ม Smart Village
</p>

</header>



<div class="container">


<div class="box">


<h2>➕ เพิ่มข้อมูลผู้นำ</h2>


<input id="name"
placeholder="ชื่อ - นามสกุล">


<input id="position"
placeholder="ตำแหน่ง">


<input id="duty"
placeholder="หน้าที่">


<input id="phone"
placeholder="เบอร์โทร">


<label>
📷 เลือกรูปภาพ
</label>


<input 
type="file"
accept="image/*"
onchange="preview(event)"
>


<img 
id="imagePreview"
class="preview"
src="images/leader.jpg"
>


<br>


<button onclick="save()">

💾 บันทึกข้อมูล

</button>


</div>




<div class="box">


<h2>📋 รายชื่อผู้นำ</h2>


<div id="leaders"></div>


</div>


</div>




<script>


let data =
JSON.parse(
localStorage.getItem("leaders")
) || [];



function preview(e){

let img =
document.getElementById("imagePreview");


img.src =
URL.createObjectURL(
e.target.files[0]
);

}




function save(){


let leader={


name:
document.getElementById("name").value,


position:
document.getElementById("position").value,


duty:
document.getElementById("duty").value,


phone:
document.getElementById("phone").value,


image:
document.getElementById("imagePreview").src


};



data.push(leader);



localStorage.setItem(
"leaders",
JSON.stringify(data)
);



show();


alert("บันทึกเรียบร้อย");


}





function show(){


let html="";


data.forEach((x)=>{


html += `

<div class="card">

<img 
src="${x.image}"
class="preview"
>


<h3>
${x.position}
</h3>


<p>
${x.name}
</p>


<p>
${x.duty}
</p>


<p>
☎️ ${x.phone}
</p>


</div>

`;


});



document.getElementById("leaders").innerHTML=html;


}



show();


</script>


</body>

</html>
