<script>

let leaders=[];


// โหลดข้อมูลจาก JSON

fetch("data/leader.json")

.then(response => response.json())

.then(data=>{

leaders=data;

showLeader(leaders);

})

.catch(error=>{

console.error("โหลดข้อมูลผู้นำผิดพลาด",error);

showLeader([]);

});





function showLeader(data){


let html="";


if(data.length==0){


html=`

<div class="card">

<h2>
ยังไม่มีข้อมูล
</h2>

<p>
ไม่พบข้อมูลผู้นำ
</p>

</div>

`;


}else{


data.forEach(function(item){



html += `


<div class="card">


<img src="${item.image || 'images/default.png'}">


<div class="position">

${item.position || ''}

</div>


<br><br>


<div class="name">

${item.name || ''}

</div>


<p>

${item.duty || ''}

</p>


<p>

☎️ ${item.phone || '-'}

</p>


</div>


`;



});


}



document.getElementById("leaders").innerHTML=html;


}





function searchLeader(){


let key=document
.getElementById("search")
.value
.toLowerCase();



let result=leaders.filter(function(item){


return (

(item.name||"")
.toLowerCase()
.includes(key)

||

(item.position||"")
.toLowerCase()
.includes(key)

);


});


showLeader(result);


}



</script>
