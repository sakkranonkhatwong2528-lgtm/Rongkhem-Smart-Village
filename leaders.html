<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
ทำเนียบผู้นำ | บ้านร่องเข็ม Smart Village
</title>


<style>

body{

margin:0;
font-family:Tahoma,sans-serif;
background:#e8eaf6;

}


header{

background:#283593;
color:white;
padding:30px;
text-align:center;

}


.container{

padding:20px;

}


.leaders{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;

}


.person{

background:white;
padding:20px;
border-radius:20px;
box-shadow:0 4px 12px #ccc;
text-align:center;

}


.person img{

width:130px;
height:130px;
border-radius:50%;
object-fit:cover;

}


.person h2{

color:#283593;

}


.default{

background:white;
padding:20px;
border-radius:20px;

}


.back{

text-align:center;
margin:30px;

}


.back a{

background:#283593;
color:white;
padding:12px 25px;
border-radius:20px;
text-decoration:none;

}

</style>


</head>



<body>




<header>

<h1>
👥 ทำเนียบผู้นำและคณะทำงาน
</h1>

<p>
บ้านร่องเข็ม หมู่ที่ 6
</p>

</header>





<div class="container">


<div class="leaders" id="leaderList">


</div>


</div>





<div class="back">

<a href="index.html">

🏠 กลับหน้าแรก

</a>

</div>






<script>


function loadLeader(){



let data=

JSON.parse(
localStorage.getItem("leader")
) || [];



let html="";




// กรณียังไม่มีข้อมูล

if(data.length==0){


html += `


<div class="default">


<h2>
👤 ผู้ใหญ่บ้าน
</h2>


<p>
บ้านร่องเข็ม หมู่ที่ 6
</p>


<p>
ข้อมูลกำลังปรับปรุง
</p>


</div>


`;



}



// แสดงข้อมูลจาก Admin


data.forEach(function(item){



let img = item.image;


if(img==""){

img="logo.svg";

}



html += `


<div class="person">


<img src="images/${img}">


<h2>
${item.name}
</h2>


<p>
<strong>
${item.position}
</strong>
</p>


<p>
☎️ ${item.phone}
</p>



</div>


`;



});



document.getElementById("leaderList")
.innerHTML=html;



}



loadLeader();



</script>




</body>

</html>
