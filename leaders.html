<!DOCTYPE html>
<html lang="th">

<head>
<meta charset="UTF-8">
<title>ทำเนียบผู้นำ | บ้านร่องเข็ม</title>

<style>
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:white;
padding:20px;
border-radius:20px;
text-align:center;
}

.card img{
width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
}

</style>

</head>


<body>


<h1>
👥 ทำเนียบผู้นำและคณะทำงาน
</h1>


<input 
id="search"
placeholder="ค้นหารายชื่อ"
onkeyup="searchLeader()"
>


<div 
class="grid" 
id="leaders">
</div>



<script>

let leaders=[];


fetch("data/leader.json")

.then(response=>response.json())

.then(data=>{

leaders=data;

showLeader(leaders);

});



function showLeader(data){

let html="";


data.forEach(item=>{


html+=`

<div class="card">

<img src="${item.image}">

<h3>${item.position}</h3>

<h2>${item.name}</h2>

<p>${item.duty || ""}</p>

</div>

`;

});


document.getElementById("leaders").innerHTML=html;

}



function searchLeader(){

let key=document
.getElementById("search")
.value
.toLowerCase();


let result=leaders.filter(item=>

item.name.toLowerCase().includes(key)

);


showLeader(result);

}


</script>


</body>
</html>
