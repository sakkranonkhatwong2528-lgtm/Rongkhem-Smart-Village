<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ทำเนียบผู้นำและคณะทำงาน | บ้านร่องเข็ม</title>

<style>

body{
    font-family: "Sarabun", sans-serif;
    background:#f1f5f9;
    margin:0;
    padding:20px;
}

.header{
    text-align:center;
    margin-bottom:25px;
}

.header h1{
    color:#166534;
}

.search-box{
    max-width:500px;
    margin:auto;
}

input{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid #ccc;
    font-size:16px;
}

.grid{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(260px,1fr));
    gap:20px;
    margin-top:30px;
}

.card{

    background:white;
    border-radius:20px;
    padding:20px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,.08);

}

.card img{

    width:120px;
    height:120px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid #22c55e;

}


.name{
    font-size:20px;
    font-weight:bold;
    margin-top:15px;
}

.position{

    color:#166534;
    font-weight:bold;

}

.department{

    color:#555;

}


.status{

    display:inline-block;
    margin-top:10px;
    background:#dcfce7;
    color:#166534;
    padding:5px 12px;
    border-radius:20px;

}


.back{

display:block;
text-align:center;
margin-top:30px;

}


</style>

</head>


<body>


<div class="header">

<h1>👥 ทำเนียบผู้นำและคณะทำงาน</h1>

<p>
บ้านร่องเข็ม หมู่ที่ 6<br>
ตำบลจำป่าหวาย อำเภอเมือง จังหวัดพะเยา
</p>


<div class="search-box">

<input id="search"
placeholder="🔎 ค้นหาชื่อ หรือตำแหน่ง..."
onkeyup="searchLeader()">

</div>


</div>


<div id="leaders" class="grid">

</div>


<a class="back" href="index.html">
🏠 กลับหน้าแรก
</a>



<script>


let leaders=[];


// โหลดข้อมูล

fetch("data/leader.json")


.then(res=>{

if(!res.ok){

throw new Error("ไม่พบ leader.json");

}

return res.json();

})


.then(data=>{


leaders=data.leaders || [];

showLeader(leaders);


})


.catch(error=>{


document.getElementById("leaders").innerHTML=

`
<div class="card">
<h3>โหลดข้อมูลไม่สำเร็จ</h3>
<p>${error.message}</p>
</div>
`;

});





function showLeader(data){


let html="";


data.forEach(item=>{


html+=`

<div class="card">


<img src="${item.image || 'images/leader.jpg'}">


<div class="position">
${item.position || ""}
</div>


<div class="name">
${item.name || ""}
</div>


<div class="department">
${item.department || ""}
</div>


<div class="status">
${item.status || ""}
</div>


</div>


`;


});


document.getElementById("leaders").innerHTML=html;


}





function searchLeader(){


let key=
document.getElementById("search")
.value
.toLowerCase();



let result=leaders.filter(item=>{


return (

(item.name || "").toLowerCase().includes(key)

||

(item.position || "").toLowerCase().includes(key)

||

(item.department || "").toLowerCase().includes(key)

);


});


showLeader(result);


}



</script>


</body>
</html>
