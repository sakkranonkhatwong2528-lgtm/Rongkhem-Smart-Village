<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
จัดการข้อมูลสิ่งแวดล้อม | บ้านร่องเข็ม Smart Village
</title>


<style>

body{

margin:0;
font-family:Tahoma,sans-serif;
background:#f1f8e9;

}


header{

background:#558b2f;
color:white;
padding:30px;
text-align:center;

}


.container{

padding:20px;

}


.card{

background:white;
padding:25px;
border-radius:25px;
box-shadow:0 4px 12px #ccc;

}



input,textarea,select{

width:100%;
padding:12px;
margin:10px 0;
border-radius:10px;
border:1px solid #ccc;
box-sizing:border-box;

}



button{

background:#558b2f;
color:white;
padding:12px 30px;
border:none;
border-radius:20px;

}



.result{

background:#f1f8e9;
padding:20px;
margin-top:20px;
border-radius:20px;

}



.back{

text-align:center;
margin:30px;

}



.back a{

background:#558b2f;
color:white;
padding:12px 25px;
border-radius:20px;
text-decoration:none;

}


</style>


</head>



<body>




<header>


<h1>
🌱 จัดการข้อมูลสิ่งแวดล้อม
</h1>


<p>
Admin บ้านร่องเข็ม Smart Village
</p>


</header>






<div class="container">



<div class="card">



<h2>
📋 บันทึกข้อมูลสิ่งแวดล้อม
</h2>





<label>
🌫 ระดับสถานการณ์ PM2.5
</label>


<select id="pm">


<option>
ปกติ
</option>


<option>
เฝ้าระวัง
</option>


<option>
มีผลกระทบ
</option>


</select>







<label>
🔥 จำนวนจุดเผา/เหตุการเผา
</label>


<input

id="burn"

type="number"

placeholder="จำนวนครั้ง">




<label>
🌳 พื้นที่สีเขียว
</label>


<input

id="green"

placeholder="เช่น 200 ไร่">




<label>
♻️ การจัดการขยะ
</label>


<select id="waste">


<option>
ดีมาก
</option>


<option>
ดี
</option>


<option>
ต้องปรับปรุง
</option>


</select>







<label>
📝 กิจกรรมสิ่งแวดล้อม
</label>


<textarea

id="activity"

rows="5"

placeholder="เช่น ทำแนวกันไฟ ปลูกต้นไม้ ลดการเผา">

</textarea>







<button onclick="saveEnvironment()">

💾 บันทึกข้อมูล

</button>




<div class="result" id="show">

</div>



</div>



</div>







<div class="back">


<a href="admin-dashboard.html">

⚙️ กลับ Dashboard

</a>


</div>







<script>



loadEnvironment();



function saveEnvironment(){



let data={


pm:

document.getElementById("pm").value,


burn:

document.getElementById("burn").value,


green:

document.getElementById("green").value,


waste:

document.getElementById("waste").value,


activity:

document.getElementById("activity").value


};





localStorage.setItem(

"environment",

JSON.stringify(data)

);




alert("บันทึกข้อมูลสิ่งแวดล้อมแล้ว");



showEnvironment();



}







function loadEnvironment(){



let data =

JSON.parse(

localStorage.getItem("environment")

);



if(data){


document.getElementById("pm").value=data.pm;


document.getElementById("burn").value=data.burn;


document.getElementById("green").value=data.green;


document.getElementById("waste").value=data.waste;


document.getElementById("activity").value=data.activity;


}



showEnvironment();


}







function showEnvironment(){


let data=

JSON.parse(

localStorage.getItem("environment")

);



if(!data)return;



document.getElementById("show").innerHTML=`

<h3>
ข้อมูลปัจจุบัน
</h3>


<p>
🌫 PM2.5 :
${data.pm}
</p>


<p>
🔥 การเผา :
${data.burn} ครั้ง
</p>


<p>
🌳 พื้นที่สีเขียว :
${data.green}
</p>


<p>
♻️ ขยะ :
${data.waste}
</p>


<p>
📝 กิจกรรม :
${data.activity}
</p>


`;



}



</script>



</body>

</html>
