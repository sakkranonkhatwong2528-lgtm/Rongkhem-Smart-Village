<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
ข้อมูลชุมชน | บ้านร่องเข็ม Smart Village
</title>


<style>

body{

margin:0;
font-family:Tahoma,sans-serif;
background:#e8eaf6;

}


header{

background:#283593;
color:white;
padding:35px;
text-align:center;

}


.container{

padding:20px;

}


.dashboard{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;

}



.card{

background:white;
padding:25px;
border-radius:25px;
box-shadow:0 4px 12px #ccc;
text-align:center;

}


.icon{

font-size:45px;

}


.number{

font-size:35px;
font-weight:bold;
color:#283593;

}



.section{

background:white;
padding:25px;
margin-top:25px;
border-radius:25px;

}



.back{

text-align:center;
margin:30px;

}



.back a{

background:#283593;
color:white;
padding:12px 25px;
border-radius:20px;
text-decoration:none;

}


</style>


</head>



<body>



<header>


<h1>
📊 ข้อมูลชุมชน
</h1>


<p>
บ้านร่องเข็ม หมู่ที่ 6
ตำบลจำป่าหวาย จังหวัดพะเยา
</p>


</header>







<div class="container">


<div class="dashboard">



<div class="card">

<div class="icon">
🏠
</div>

<div class="number" id="home">
-
</div>

<p>
ครัวเรือน
</p>

</div>





<div class="card">

<div class="icon">
👥
</div>

<div class="number" id="people">
-
</div>

<p>
ประชากร
</p>

</div>





<div class="card">

<div class="icon">
👴
</div>

<div class="number" id="elder">
-
</div>

<p>
ผู้สูงอายุ
</p>

</div>





<div class="card">

<div class="icon">
♿
</div>

<div class="number" id="disabled">
-
</div>

<p>
ผู้พิการ
</p>

</div>



</div>







<div class="section">


<h2>
🌱 ทรัพยากรชุมชน
</h2>


<p>

💧 แหล่งซับน้ำจำ  
<br>
🌳 พื้นที่ธรรมชาติ  
<br>
🌾 พื้นที่เกษตรกรรม  
<br>
🏡 วิถีชีวิตชุมชน

</p>


</div>





<div class="section">


<h2>
🏘 กลุ่มองค์กรชุมชน
</h2>


<p id="group">

-

</p>


</div>



</div>








<div class="back">


<a href="index.html">

🏠 กลับหน้าแรก

</a>


</div>








<script>



let data =

JSON.parse(

localStorage.getItem("community")

);



if(data){


document.getElementById("home").innerHTML =
data.home+" หลัง";


document.getElementById("people").innerHTML =
data.people+" คน";


document.getElementById("elder").innerHTML =
data.elder+" คน";


document.getElementById("disabled").innerHTML =
data.disabled+" คน";


document.getElementById("group").innerHTML =
data.group;


}



</script>



</body>

</html>
