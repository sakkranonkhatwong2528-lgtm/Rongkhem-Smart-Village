<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
ปฏิทินกิจกรรม | บ้านร่องเข็ม Smart Village
</title>


<style>

body{

margin:0;
font-family:Tahoma,sans-serif;
background:#fffde7;

}


header{

background:#f57f17;
color:white;
text-align:center;
padding:30px;

}


.container{

padding:20px;

}


.event{

background:white;
padding:20px;
margin-bottom:20px;
border-radius:20px;
box-shadow:0 4px 12px #ccc;

}


.event h2{

color:#f57f17;

}


.date{

background:#f57f17;
color:white;
padding:8px 15px;
border-radius:20px;
display:inline-block;

}


.default{

background:#fff3cd;
padding:15px;
border-radius:15px;

}


.back{

text-align:center;
margin:30px;

}


.back a{

background:#f57f17;
color:white;
padding:12px 25px;
border-radius:20px;
text-decoration:none;

}

</style>

</head>



<body>



<header>

<h1>
📅 ปฏิทินกิจกรรมหมู่บ้าน
</h1>

<p>
บ้านร่องเข็ม Smart Village
</p>

</header>





<div class="container">


<div id="eventList">


</div>


</div>





<div class="back">

<a href="index.html">

🏠 กลับหน้าแรก

</a>

</div>







<script>


function loadActivity(){


let activity =

JSON.parse(
localStorage.getItem("activity")
) || [];



let html="";



// กรณียังไม่มีกิจกรรม

if(activity.length==0){


html += `


<div class="event">


<span class="date">
ทุกเดือน
</span>


<h2>
🏡 ประชุมประจำเดือนหมู่บ้าน
</h2>


<p>
ประชุมชี้แจงข่าวสาร
รับฟังความคิดเห็นประชาชน
</p>


</div>



<div class="event">


<span class="date">
ตลอดปี
</span>


<h2>
🌱 ดูแลแหล่งซับน้ำจำ
</h2>


<p>
กิจกรรมอนุรักษ์ทรัพยากรธรรมชาติ
และระบบนิเวศชุมชน
</p>


</div>



`;



}




// แสดงกิจกรรมจาก Admin


activity.reverse();



activity.forEach(function(item){



html += `


<div class="event">


<span class="date">

${item.date}

</span>



<h2>

📌 ${item.title}

</h2>



<p>

📍 สถานที่ :
${item.place}

</p>



<p>

${item.detail}

</p>



</div>



`;



});



document.getElementById("eventList")
.innerHTML=html;



}



loadActivity();



</script>



</body>

</html>
