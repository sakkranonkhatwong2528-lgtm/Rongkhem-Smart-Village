<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">


<title>
Smart Map บ้านร่องเข็ม
</title>


<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css">


<style>

body{

margin:0;

font-family:sans-serif;

background:#eef7f5;

}


header{

background:#00695c;

color:white;

padding:20px;

text-align:center;

}


#map{

height:70vh;

}


.panel{

background:white;

padding:20px;

margin:15px;

border-radius:15px;

}


button{

padding:10px;

border:0;

border-radius:10px;

background:#00897b;

color:white;

margin:5px;

}

</style>


</head>


<body>


<header>

<h1>
🗺 Smart Map
</h1>

<p>
แผนที่อัจฉริยะบ้านร่องเข็ม หมู่ที่ 6
</p>

</header>



<div id="map"></div>



<div class="panel">

<h2>
📍 ชั้นข้อมูล
</h2>


<button>
💧 แหล่งน้ำ
</button>


<button>
👴 ผู้สูงอายุ
</button>


<button>
🌳 ทรัพยากร
</button>


<button>
🚨 จุดเหตุ
</button>


</div>



<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>



<script>


// ตั้งค่าพิกัดเริ่มต้น (ปรับภายหลังด้วย GPS จริง)

var map = L.map('map')
.setView(
[19.1667,99.9000],
15
);



L.tileLayer(

'https://tile.openstreetmap.org/{z}/{x}/{y}.png'

).addTo(map);



// จุดแหล่งซับน้ำจำ

var water =
L.marker(
[19.1667,99.9000]
)
.addTo(map);


water.bindPopup(

`
💧 แหล่งซับน้ำจำ<br>
🌱 พื้นที่อนุรักษ์<br>
🐟 ความหลากหลายชีวภาพ
`

);



// จุดสุขภาพ

var health =
L.marker(
[19.1680,99.9020]
)
.addTo(map);


health.bindPopup(

`
🩺 จุดสุขภาพชุมชน<br>
👴 ผู้สูงอายุ<br>
อสม.รับผิดชอบ
`

);



// จุดสิ่งแวดล้อม

var env =
L.marker(
[19.1700,99.9050]
)
.addTo(map);


env.bindPopup(

`
🌳 จุดเรียนรู้ธรรมชาติ<br>
บ้านร่องเข็ม
`

);



</script>



</body>

</html>
