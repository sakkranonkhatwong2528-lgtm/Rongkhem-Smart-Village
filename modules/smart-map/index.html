<!DOCTYPE html>
<html lang="th">


<head>


<meta charset="UTF-8">


<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
Smart Map บ้านร่องเข็ม
</title>


<link rel="stylesheet"
href="assets/css/dashboard.css">


<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css">


<style>


#map{


height:600px;

border-radius:20px;

box-shadow:

0 5px 15px rgba(0,0,0,.15);


}


</style>


</head>


<body>


<div class="dashboard-container">



<header class="dashboard-header">


<div>


<h1>
🗺 Smart Map
</h1>


<p>

แผนที่อัจฉริยะบ้านร่องเข็ม

</p>


</div>


</header>





<section class="section">


<div id="map"></div>


</section>



</div>





<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>



<script>


const map = L.map('map')

.setView(

[19.123456,99.123456],

16

);



L.tileLayer(

'https://tile.openstreetmap.org/{z}/{x}/{y}.png',

{

maxZoom:19

}

).addTo(map);






fetch("data/location.json")

.then(res=>res.json())

.then(data=>{


data.location.forEach(item=>{


let marker=L.marker([

item.latitude,

item.longitude

])

.addTo(map);



marker.bindPopup(`


<h3>

${item.name}

</h3>


<p>

ประเภท :

${item.type}

</p>


<p>

${item.detail}

</p>


`);




});


});


</script>



</body>


</html>
