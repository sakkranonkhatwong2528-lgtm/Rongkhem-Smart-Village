<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
เข้าสู่ระบบผู้ดูแล | บ้านร่องเข็ม Smart Village
</title>


<style>

body{

margin:0;
font-family:Tahoma,sans-serif;
background:#e3f2fd;
height:100vh;
display:flex;
justify-content:center;
align-items:center;

}


.login{

background:white;
width:350px;
padding:30px;
border-radius:25px;
box-shadow:0 5px 15px #aaa;
text-align:center;

}


.logo{

width:100px;

}


h1{

color:#1565c0;

}


input{

width:100%;
padding:12px;
margin:10px 0;
border-radius:10px;
border:1px solid #ccc;
box-sizing:border-box;

}


button{

background:#1565c0;
color:white;
padding:12px 30px;
border:none;
border-radius:20px;
font-size:16px;

}


.back{

margin-top:20px;

}


.back a{

color:#1565c0;
text-decoration:none;

}


</style>


</head>


<body>


<div class="login">


<img src="logo.svg" class="logo">


<h1>
🔐 ผู้ดูแลหมู่บ้าน
</h1>


<p>
บ้านร่องเข็ม Smart Village
</p>



<input type="text"
id="username"
placeholder="ชื่อผู้ใช้งาน">


<input type="password"
id="password"
placeholder="รหัสผ่าน">


<button onclick="login()">

เข้าสู่ระบบ

</button>



<div class="back">

<a href="index.html">
🏠 กลับหน้าแรก
</a>

</div>



</div>



<script>
function login(){

let username =
document.getElementById("username").value;


let password =
document.getElementById("password").value;



if(username=="admin" && password=="123456"){


localStorage.setItem(
"login",
"true"
);


window.location.href=
"admin-dashboard.html";


}

else{


alert(
"ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง"
);


}


}
