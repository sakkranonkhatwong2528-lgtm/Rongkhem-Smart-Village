<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Rongkhem Smart Village Admin
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<h1>
🔐 ระบบจัดการหมู่บ้าน
</h1>

<p>
Rongkhem Smart Village
</p>

</header>



<section>


<div class="card">


<h2>
📢 เพิ่มข่าวประชาสัมพันธ์
</h2>


<input 
id="title"
placeholder="หัวข้อข่าว">


<textarea
id="detail"
placeholder="รายละเอียดข่าว">
</textarea>


<button onclick="addNews()">
บันทึกข่าว
</button>


</div>




<div class="card">


<h2>
🌱 เพิ่มกิจกรรมหมู่บ้าน
</h2>


<input 
id="activityTitle"
placeholder="ชื่อกิจกรรม">


<textarea
id="activityDetail"
placeholder="รายละเอียดกิจกรรม">
</textarea>


<button onclick="addActivity()">
บันทึกกิจกรรม
</button>


</div>


</section>




<script src="admin.js"></script>


</body>

</html>
