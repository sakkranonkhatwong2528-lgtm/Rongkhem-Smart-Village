<script>


// ตรวจสอบ Login


let loginUser =

localStorage.getItem(
"loginUser"
);




if(!loginUser){


alert(
"กรุณาเข้าสู่ระบบก่อน"
);


window.location.href=
"login.html";


}




else{


let user=

JSON.parse(loginUser);



document
.getElementById("welcome")
.innerHTML=

`
👋 ยินดีต้อนรับ
<br>
${user.name}
<br>
สิทธิ์ : ${user.role}
`;



}







function logout(){



localStorage.removeItem(
"loginUser"
);



window.location.href=
"login.html";



}



</script>
