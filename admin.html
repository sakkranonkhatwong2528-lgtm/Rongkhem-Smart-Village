<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Rongkhem Smart Village</title>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:Tahoma,Arial,sans-serif;
background:linear-gradient(135deg,#2e7d32,#81c784);

}


.login-box{

width:380px;
background:white;
padding:35px;
border-radius:25px;
box-shadow:0 10px 30px rgba(0,0,0,0.3);
text-align:center;

}


.logo{

font-size:60px;

}


h1{

color:#2e7d32;
margin:10px 0;

}


h2{

font-size:20px;
color:#555;

}


input{

width:100%;
padding:15px;
margin:10px 0;
border-radius:12px;
border:1px solid #ccc;
font-size:16px;

}


button{

width:100%;
padding:15px;
margin-top:15px;

background:#2e7d32;
color:white;

border:none;
border-radius:12px;

font-size:18px;
cursor:pointer;

}


button:hover{

background:#1b5e20;

}


.message{

margin-top:15px;
font-weight:bold;

}


.footer{

margin-top:25px;
font-size:14px;
color:#777;

}


</style>

</head>


<body>


<div class="login-box">


<div class="logo">
🏡
</div>


<h1>Rongkhem</h1>

<h2>
🔐 ผู้ดูแลระบบ
</h2>


<input 
id="username"
placeholder="ชื่อผู้ใช้งาน"
>


<input 
id="password"
type="password"
placeholder="รหัสผ่าน"
>


<button onclick="login()">

เข้าสู่ระบบ

</button>


<div class="message" id="message"></div>


<div class="footer">

ระบบบริหารจัดการหมู่บ้านอัจฉริยะ<br>

บ้านร่องเข็ม หมู่ที่ 6<br>

จังหวัดพะเยา

</div>


</div>



<script>


function login(){


let user =
document.getElementById("username").value;


let pass =
document.getElementById("password").value;



if(user=="admin" && pass=="1234"){


localStorage.setItem(
"login",
"true"
);



window.location.href="admin.html";


}

else{


document.getElementById("message").innerHTML=
"❌ ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง";


document.getElementById("message").style.color="red";


}


}



</script>


</body>

</html>
