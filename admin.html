<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel | Rongkhem Smart Village</title>

<style>

body{
margin:0;
font-family:Tahoma,Arial;
background:#f1f8e9;
}

header{
background:#2e7d32;
color:white;
text-align:center;
padding:25px;
}

.container{
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:15px;
margin-bottom:20px;
box-shadow:0 3px 10px #ccc;
}


input,textarea{

width:100%;
padding:12px;
margin:8px 0;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;

}


button{

background:#2e7d32;
color:white;
border:none;
padding:15px;
border-radius:10px;
width:100%;
font-size:18px;
cursor:pointer;

}


.box{

background:#e8f5e9;
padding:15px;
border-radius:10px;
margin-bottom:10px;

}


a{

display:block;
text-align:center;
background:#388e3c;
color:white;
padding:12px;
border-radius:10px;
text-decoration:none;
margin-top:15px;

}


</style>

</head>


<body>


<header>

<h1>🔐 Admin Panel</h1>

<h2>Rongkhem Smart Village</h2>

<p>ระบบจัดการข้อมูลหมู่บ้าน</p>

</header>



<div class="container">


<div class="card">


<h2>📊 ข้อมูลพื้นฐาน</h2>


<div class="box">
👥 ประชากร
<input id="population">
</div>


<div class="box">
🏠 ครัวเรือน
<input id="households">
</div>


<div class="box">
👴 ผู้สูงอายุ
<input id="elderly">
</div>


<div class="box">
❤️ ผู้พิการ
<input id="disabled">
</div>


<div class="box">
🩺 อสม.
<input id="health">
</div>


<div class="box">
🛡️ ชรบ.
<input id="vrv">
</div>


</div>




<div class="card">

<h2>🌳 สิ่งแวดล้อม</h2>


<div class="box">

🔥 การเผาช่วงห้ามเผา (%)

<input id="burning">

</div>


<div class="box">

♻️ ยินดีเปลี่ยนแปลง (%)

<input id="change">

</div>


</div>




<div class="card">

<h2>📌 แผนพัฒนาหมู่บ้าน</h2>


<textarea id="development" rows="8"></textarea>


</div>




<button onclick="saveData()">

💾 บันทึกข้อมูล

</button>


<a href="dashboard.html">

⬅ กลับ Dashboard

</a>



</div>





<script>


let data={};



fetch("../data/village.json")

.then(res=>res.json())

.then(json=>{


data=json;


loadData();


});



function loadData(){


population.value=data.population || "";

households.value=data.households || "";

elderly.value=data.elderly || "";

disabled.value=data.disabled || "";

health.value=data.health || "";

vrv.value=data.vrv || "";


burning.value=
data.environment?.burning_period || "";


change.value=
data.environment?.willing_change || "";


development.value=
(data.development || []).join("\n");


}




function saveData(){


let newData={


village:data.village,

tambon:data.tambon,

district:data.district,

province:data.province,


population:Number(population.value),

households:Number(households.value),

elderly:Number(elderly.value),

disabled:Number(disabled.value),

health:Number(health.value),

vrv:Number(vrv.value),


environment:{


burning_period:Number(burning.value),

willing_change:Number(change.value)


},


development:
development.value.split("\n")



};



localStorage.setItem(
"villageData",
JSON.stringify(newData)
);



alert("✅ บันทึกข้อมูลเรียบร้อย");


}



</script>


</body>

</html>
