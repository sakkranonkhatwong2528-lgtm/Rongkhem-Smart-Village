<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
กิจกรรมหมู่บ้าน | บ้านร่องเข็ม Smart Village
</title>



<style>


body{

margin:0;
font-family:Tahoma,sans-serif;
background:#e0f7fa;

}



header{

background:#00838f;
color:white;
padding:35px;
text-align:center;

}



.container{

padding:20px;

}



.grid{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:20px;

}



.card{

background:white;
padding:25px;
border-radius:25px;
box-shadow:0 4px 12px #ccc;

}



.card img{

width:100%;
height:180px;
object-fit:cover;
border-radius:15px;

}



.date{

background:#00838f;
color:white;
padding:8px 15px;
border-radius:20px;
display:inline-block;

}



.back{

text-align:center;
margin:30px;

}



.back a{

background:#00838f;
color:white;
padding:12px 25px;
border-radius:20px;
text-decoration:none;

}


</style>


</head>



<body>



<header>


<h1>
📅 กิจกรรมหมู่บ้าน
</h1>


<p>
บ้านร่องเข็ม Smart Village
</p>


</header>






<div class="container">


<div class="grid" id="activityList">


</div>


</div>








<div class="back">

<a href="index.html">

🏠 กลับหน้าแรก

</a>

</div>







<script>


let activities =

JSON.parse(

localStorage.getItem("activities")

)||[];





function showActivity(){



let html="";




if(activities.length==0){



html=`

<div class="card">


<h2>
📅 ยังไม่มีกิจกรรม
</h2>


<p>
กำลังจัดเตรียมข้อมูลกิจกรรม

</p>


</div>


`;



}




activities.reverse();



activities.forEach(function(item){



html +=`


<div class="card">



<img src="images/${item.image}">



<span class="date">

📅 ${item.date}

</span>



<h2>

${item.title}

</h2>


<p>

⏰ เวลา :
${item.time}

</p>


<p>

📍 สถานที่ :
${item.place}

</p>


<p>

👥 ผู้รับผิดชอบ :
${item.owner}

</p>



<p>

${item.detail}

</p>



</div>



`;



});



document.getElementById("activityList")
.innerHTML=html;



}



showActivity();



</script>



</body>

</html>
