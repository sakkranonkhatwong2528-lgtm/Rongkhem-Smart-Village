<!DOCTYPE html>
<html lang="th">

<head>
<meta charset="UTF-8">
<title>Rongkhem Login</title>

<style>

body{
font-family:Tahoma;
background:#e8f5e9;
display:flex;
height:100vh;
align-items:center;
justify-content:center;
}

.box{
background:white;
padding:30px;
border-radius:20px;
text-align:center;
box-shadow:0 5px 15px #999;
width:320px;
}

input{
width:90%;
padding:12px;
margin:10px;
}

button{
width:95%;
padding:12px;
background:#2e7d32;
color:white;
border:0;
border-radius:10px;
font-size:18px;
}

#error{
color:red;
}

</style>

</head>


<body>


<div class="box">

<h1>🏡 Rongkhem</h1>

<h2>🔐 ผู้ดูแลระบบ</h2>


<input id="user" placeholder="ชื่อผู้ใช้">


<input id="pass" type="password" placeholder="รหัสผ่าน">


<button onclick="check()">
เข้าสู่ระบบ
</button>


<p id="error"></p>


</div>



<script>

function check(){

let u=document.getElementById("user").value;
let p=document.getElementById("pass").value;


if(u=="admin" && p=="1234"){

window.location="../admin.html";

}

else{

document.getElementById("error").innerHTML=
"❌ ข้อมูลเข้าสู่ระบบไม่ถูกต้อง";

}

}

</script>


</body>
</html>
