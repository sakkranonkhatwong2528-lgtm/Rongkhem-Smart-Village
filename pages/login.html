<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Rongkhem Smart Village</title>

<style>

body{
margin:0;
font-family:Tahoma,Arial,sans-serif;
background:#f1f8e9;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}


.login-box{

background:white;
width:350px;
padding:30px;
border-radius:20px;
box-shadow:0 5px 15px #ccc;
text-align:center;

}


.logo{

font-size:50px;

}


h1{

color:#2e7d32;

}


input{

width:90%;
padding:12px;
margin:10px;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;

}


button{

width:95%;
padding:15px;
background:#2e7d32;
color:white;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;

}


button:hover{

background:#1b5e20;

}


.error{

color:red;
margin-top:15px;

}


.footer{

margin-top:20px;
font-size:14px;
color:#666;

}

</style>

</head>


<body>


<div class="login-box">


<div class="logo">
🏡
</div>


<h1>
Rongkhem
</h1>


<h2>
🔐 ผู้ดูแลระบบ
</h2>



<input 
id="username"
placeholder="ชื่อผู้ใช้"
>


<input 
id="password"
type="password"
placeholder="รหัสผ่าน"
>



<button onclick="login()">

เข้าสู่ระบบ

</button>



<div class="error" id="error"></div>



<div class="footer">

บ้านร่องเข็ม หมู่ที่ 6<br>
Smart Village

</div>



</div>




<script>


function login(){


let username =
document.getElementById("username").value;


let password =
document.getElementById("password").value;



// ข้อมูลผู้ดูแลระบบ

if(
username==="sakkranon2528"
&&
password==="12345678"
){


localStorage.setItem(
"login",
"success"
);


// ไปหน้า Admin

window.location.href="../admin.html";


}

else{


document.getElementById("error").innerHTML=
"❌ ข้อมูลเข้าสู่ระบบไม่ถูกต้อง";


}



}


</script>



</body>

</html>
