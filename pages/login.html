<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Rongkhem Smart Village</title>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;
height:100vh;

display:flex;
justify-content:center;
align-items:center;

font-family:Tahoma,Arial,sans-serif;

background:
linear-gradient(
135deg,
#1b5e20,
#66bb6a
);

}



/* กล่องกลาง */

.login{

width:360px;

background:white;

padding:35px;

border-radius:25px;

text-align:center;

box-shadow:
0 15px 40px rgba(0,0,0,.3);

}



/* โลโก้ */

.logo{

width:90px;
height:90px;

margin:auto;

border-radius:50%;

background:#e8f5e9;

display:flex;

align-items:center;

justify-content:center;

font-size:55px;

}



/* หัวข้อ */

h1{

margin-top:20px;

color:#2e7d32;

font-size:30px;

}



h2{

font-size:20px;

color:#555;

font-weight:normal;

}



/* ช่องกรอก */


input{

width:100%;

padding:14px;

margin:10px 0;

border-radius:12px;

border:1px solid #ccc;

font-size:16px;

}



input:focus{

border-color:#2e7d32;

outline:none;

}



/* ปุ่ม */


button{

width:100%;

padding:15px;

margin-top:15px;

border:none;

border-radius:15px;

background:#2e7d32;

color:white;

font-size:18px;

cursor:pointer;

}



button:hover{

background:#1b5e20;

}



#error{

color:red;

margin-top:15px;

}



.footer{

margin-top:25px;

font-size:13px;

color:#777;

line-height:1.6;

}



</style>

</head>


<body>



<div class="login">


<div class="logo">
🏡
</div>


<h1>
Rongkhem
</h1>


<h2>
Smart Village
</h2>


<p>
🔐 ผู้ดูแลระบบ
</p>



<input 
id="user"
placeholder="ชื่อผู้ใช้">



<input 
id="pass"
type="password"
placeholder="รหัสผ่าน">



<button onclick="login()">

เข้าสู่ระบบ

</button>



<div id="error"></div>



<div class="footer">

ระบบบริหารจัดการหมู่บ้านอัจฉริยะ<br>

บ้านร่องเข็ม หมู่ที่ 6<br>

ตำบลจำป่าหวาย อำเภอเมือง จังหวัดพะเยา

</div>


</div>



<script>


function login(){


let u=document.getElementById("user").value;

let p=document.getElementById("pass").value;



if(u=="admin" && p=="1234"){


window.location.href="../admin.html";


}

else{


document.getElementById("error").innerHTML=
"❌ ข้อมูลเข้าสู่ระบบไม่ถูกต้อง";


}


}


</script>


</body>

</html>
