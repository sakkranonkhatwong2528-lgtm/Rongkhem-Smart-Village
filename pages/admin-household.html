<!DOCTYPE html>

<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
Admin Household | บ้านร่องเข็ม
</title>


<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="css/admin-household.css">


</head>


<body>


<header class="house-admin-header">


<h1>
🏠 จัดการทะเบียนครัวเรือน
</h1>


<p>
บ้านร่องเข็ม Smart Village
</p>


</header>






<section class="summary">



<div class="card">

<h3>
🏠 ครัวเรือนทั้งหมด
</h3>

<h1 id="totalHouse">
0
</h1>

</div>





<div class="card">

<h3>
👨‍👩‍👧 ประชาชนในครัวเรือน
</h3>

<h1 id="totalMember">
0
</h1>

</div>





<div class="card">

<h3>
👴 ครัวเรือนผู้สูงอายุ
</h3>

<h1 id="elderHouse">
0
</h1>

</div>





<div class="card">

<h3>
❤️ ครัวเรือนเปราะบาง
</h3>

<h1 id="vulnerableHouse">
0
</h1>

</div>



</section>







<section class="form-box">


<h2>
➕ เพิ่มครัวเรือน
</h2>


<input id="houseNo"
placeholder="บ้านเลขที่">


<input id="owner"
placeholder="ชื่อเจ้าบ้าน">


<input id="members"
type="number"
placeholder="จำนวนสมาชิก">


<button onclick="addHouse()">

บันทึก

</button>


</section>








<section class="table-box">


<h2>
📋 รายการครัวเรือน
</h2>


<table>


<thead>

<tr>

<th>
บ้านเลขที่
</th>

<th>
เจ้าบ้าน
</th>

<th>
สมาชิก
</th>

<th>
จัดการ
</th>

</tr>

</thead>


<tbody id="houseTable">

</tbody>


</table>


</section>







<script src="js/admin-household.js"></script>


</body>

</html>
