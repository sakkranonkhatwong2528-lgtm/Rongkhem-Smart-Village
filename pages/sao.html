<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<title>ส.อบต. บ้านร่องเข็ม</title>

<link rel="stylesheet" href="../assets/css/style.css">

<style>

.grid{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.member{
background:white;
padding:25px;
border-radius:20px;
text-align:center;
box-shadow:0 4px 15px #ccc;
}

.member img{
width:140px;
height:140px;
border-radius:50%;
object-fit:cover;
}

</style>

</head>


<body>


<div class="header">

<h1>
🏛️ ส.อบต.
</h1>

<h2>
สมาชิกสภาองค์การบริหารส่วนตำบล
</h2>

<p>
บ้านร่องเข็ม หมู่ที่ 6
</p>

</div>



<div class="container">


<div id="sao-list" class="grid">

</div>


<br>

<a href="../index.html">
⬅ กลับหน้าหลัก
</a>


</div>




<script>

fetch("../data/sao.json")

.then(response=>response.json())

.then(data=>{


let html="";


data.members.forEach(person=>{


html += `


<div class="member">


<img src="../assets/images/${person.image}">


<h2>
${person.name}
</h2>


<h3>
${person.position}
</h3>


<p>
📍 ${person.area}
</p>


<p>
☎️ ${person.phone}
</p>


<p>
${person.duty}
</p>


</div>


`;


});


document.getElementById(
"sao-list"
).innerHTML=html;


});


</script>



</body>

</html>
