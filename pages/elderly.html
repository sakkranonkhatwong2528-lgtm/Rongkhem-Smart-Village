<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<title>
ผู้สูงอายุ บ้านร่องเข็ม
</title>

<link rel="stylesheet" href="../assets/css/style.css">


<style>

table{

width:100%;

background:white;

border-collapse:collapse;

}


th{

background:#8e24aa;

color:white;

padding:12px;

}


td{

padding:12px;

border-bottom:1px solid #ddd;

}


</style>

</head>


<body>


<div class="header">

<h1>
👴 ผู้สูงอายุ
</h1>

<h2>
บ้านร่องเข็ม หมู่ที่ 6
</h2>

</div>


<div class="container">


<div class="card">

<h2>
จำนวนผู้สูงอายุ
</h2>

<div class="number">
91
</div>

คน

</div>



<table>


<thead>

<tr>

<th>ชื่อ</th>

<th>เพศ</th>

<th>อายุ</th>

<th>บ้าน</th>

</tr>

</thead>


<tbody id="elder-list">

</tbody>


</table>


<br>

<a href="../index.html">

⬅ กลับหน้าหลัก

</a>


</div>




<script>


fetch("../data/citizen.json")

.then(res=>res.json())

.then(data=>{


let html="";


let elderly=
data.citizens.filter(
c=>c.status=="ผู้สูงอายุ"
);



elderly.forEach(c=>{


html+=`

<tr>

<td>${c.name}</td>

<td>${c.gender}</td>

<td>${c.age}</td>

<td>${c.house}</td>

</tr>


`;


});



document.getElementById(
"elder-list"
).innerHTML=html;


});



</script>


</body>

</html>
