<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>แจ้งร้องเรียน | Rongkhem Smart Village</title>

<link rel="stylesheet" href="../css/style.css">


<style>

.container{
padding:20px;
}


.header{

background:#198754;
color:white;
padding:25px;
border-radius:15px;

}


.card{

background:white;
padding:20px;
margin-top:20px;
border-radius:15px;
box-shadow:0 3px 10px #ddd;

}


input,select,textarea{

width:100%;
padding:12px;
margin-top:10px;
border-radius:10px;
border:1px solid #ccc;

}


button{

background:#198754;
color:white;
border:none;
padding:12px 20px;
border-radius:10px;

}


.status{

padding:6px 12px;
border-radius:20px;
color:white;

}


.wait{

background:#ffc107;
color:#333;

}


.process{

background:#fd7e14;

}


.done{

background:#198754;

}


</style>

</head>


<body>


<div class="container">


<div class="header">

<h1>
📋 แจ้งร้องเรียนออนไลน์
</h1>

<p>
🏡 Rongkhem Smart Village
<br>
บ้านร่องเข็ม หมู่ที่ 6
</p>

</div>







<div class="card">


<h2>
📝 แจ้งปัญหาใหม่
</h2>


<label>
ประเภทปัญหา
</label>


<select>


<option>
ไฟฟ้าสาธารณะ
</option>


<option>
ถนนชำรุด
</option>


<option>
น้ำประปา
</option>


<option>
ขยะและสิ่งแวดล้อม
</option>


<option>
PM2.5 / การเผา
</option>


<option>
อื่น ๆ
</option>


</select>





<label>
หัวข้อปัญหา
</label>

<input placeholder="ระบุหัวข้อปัญหา">





<label>
รายละเอียด
</label>

<textarea rows="5"
placeholder="อธิบายปัญหา">

</textarea>






<label>
แนบรูปภาพ
</label>

<input type="file">






<label>
ตำแหน่งเกิดเหตุ
</label>

<input placeholder="เช่น บ้านเลขที่ / จุดเกิดเหตุ">





<button>

📤 ส่งเรื่องร้องเรียน

</button>


</div>







<div class="card">


<h2>
📍 ติดตามสถานะเรื่องร้องเรียน
</h2>


<table width="100%" border="1">


<tr>

<th>
วันที่
</th>

<th>
เรื่อง
</th>

<th>
สถานะ
</th>


</tr>



<tr>

<td>
18/07/2569
</td>


<td>
ไฟฟ้าสาธารณะเสีย
</td>


<td>

<span class="status process">

กำลังแก้ไข

</span>

</td>


</tr>




<tr>

<td>
10/07/2569
</td>


<td>
ถนนชำรุด
</td>


<td>

<span class="status done">

เสร็จแล้ว

</span>

</td>


</tr>


</table>


</div>








<div class="card">


<h2>
📞 ติดต่อผู้รับผิดชอบ
</h2>


<p>

👤 ผู้ใหญ่บ้าน หมู่ที่ 6 บ้านร่องเข็ม

<br><br>

📍 ที่ทำการผู้ใหญ่บ้าน

</p>


</div>






</div>


</body>

</html>
