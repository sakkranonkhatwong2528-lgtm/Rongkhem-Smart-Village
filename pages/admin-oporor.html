<!DOCTYPE html>

<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
Admin อปพร. | บ้านร่องเข็ม
</title>


<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="css/admin-oporor.css">


</head>


<body>


<header class="admin-oporor-header">


<h1>
🚨 จัดการข้อมูล อปพร.
</h1>


<p>
บ้านร่องเข็ม Smart Village
</p>


</header>





<section class="summary">


<div class="card">

<h3>
🚨 อปพร.ทั้งหมด
</h3>

<h1 id="total">
0
</h1>

</div>



<div class="card">

<h3>
✅ พร้อมปฏิบัติ
</h3>

<h1 id="ready">
0
</h1>

</div>



<div class="card">

<h3>
🛠️ ทักษะ
</h3>

<h1 id="skill">
0
</h1>

</div>


</section>







<section class="form-box">


<h2>
➕ เพิ่มสมาชิก อปพร.
</h2>


<input id="name"
placeholder="ชื่อ-นามสกุล">


<input id="position"
placeholder="ตำแหน่ง">


<input id="skillName"
placeholder="ความสามารถ">


<input id="area"
placeholder="พื้นที่รับผิดชอบ">


<select id="status">


<option>
พร้อมปฏิบัติ
</option>


<option>
สำรอง
</option>


</select>




<button onclick="addOporor()">

บันทึก

</button>


</section>








<section class="table-box">


<h2>
📋 รายชื่อ อปพร.
</h2>



<table>


<thead>

<tr>

<th>
ชื่อ
</th>

<th>
ตำแหน่ง
</th>

<th>
ทักษะ
</th>

<th>
สถานะ
</th>

<th>
จัดการ
</th>

</tr>

</thead>


<tbody id="opororTable">


</tbody>


</table>


</section>







<script src="js/admin-oporor.js"></script>


</body>

</html>
