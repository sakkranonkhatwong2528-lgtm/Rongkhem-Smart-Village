<!DOCTYPE html>

<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
Admin Vulnerable | บ้านร่องเข็ม
</title>


<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="css/admin-vulnerable.css">


</head>


<body>


<header class="v-header">


<h1>
❤️ จัดการกลุ่มเปราะบาง
</h1>


<p>
บ้านร่องเข็ม Smart Village
</p>


</header>






<section class="summary">


<div class="card">

<h3>
❤️ ทั้งหมด
</h3>

<h1 id="total">
0
</h1>

</div>




<div class="card">

<h3>
🔴 ดูแลพิเศษ
</h3>

<h1 id="special">
0
</h1>

</div>





<div class="card">

<h3>
🟡 ติดตาม
</h3>

<h1 id="follow">
0
</h1>

</div>


</section>







<section class="form-box">


<h2>
➕ เพิ่มกลุ่มเปราะบาง
</h2>


<input id="name"
placeholder="ชื่อ-นามสกุล">


<input id="age"
type="number"
placeholder="อายุ">


<input id="type"
placeholder="ประเภท">


<input id="house"
placeholder="บ้านเลขที่">


<select id="level">

<option>
ติดตาม
</option>

<option>
ดูแลพิเศษ
</option>


</select>


<button onclick="addVulnerable()">

บันทึก

</button>


</section>







<section class="table-box">


<h2>
📋 รายการกลุ่มเปราะบาง
</h2>


<table>


<thead>

<tr>

<th>
ชื่อ
</th>

<th>
ประเภท
</th>

<th>
ระดับ
</th>

<th>
จัดการ
</th>

</tr>

</thead>


<tbody id="vTable">

</tbody>


</table>


</section>






<script src="js/admin-vulnerable.js"></script>


</body>

</html>
