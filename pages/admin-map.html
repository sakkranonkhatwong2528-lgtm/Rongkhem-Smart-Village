<!DOCTYPE html>

<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Admin Smart Map | บ้านร่องเข็ม
</title>


<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="css/admin-map.css">


<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css">


</head>


<body>


<header class="admin-map-header">


<h1>
⚙️ ศูนย์จัดการแผนที่หมู่บ้าน
</h1>


<p>
Rongkhem Smart Village
</p>


</header>






<section class="map-dashboard">



<div class="map-card">

<h3>
📍 จุดข้อมูลทั้งหมด
</h3>

<h1 id="placeCount">
0
</h1>

</div>





<div class="map-card">

<h3>
🏞️ ทรัพยากร
</h3>

<h1 id="wetlandCount">
0
</h1>

</div>





<div class="map-card">

<h3>
👴 จุดกลุ่มผู้สูงอายุ
</h3>

<h1 id="elderlyCount">
0
</h1>

</div>



</section>







<section class="map-container">


<div id="adminMap"></div>


</section>







<section class="location-list">


<h2>
📋 รายการจุดในแผนที่
</h2>


<table>


<thead>

<tr>

<th>
ชื่อสถานที่
</th>

<th>
ประเภท
</th>


</tr>

</thead>


<tbody id="locationTable">


</tbody>


</table>


</section>








<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>


<script src="js/admin-map.js"></script>



</body>

</html>
