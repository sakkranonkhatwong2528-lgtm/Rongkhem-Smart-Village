<!DOCTYPE html>

<html lang="th">

<head>

<meta charset="UTF-8">

<title>
กลุ่มเปราะบาง
</title>


<link rel="stylesheet" href="../assets/css/style.css">


</head>


<body>


<div class="header">

<h1>
❤️ กลุ่มเปราะบาง
</h1>

<h2>
บ้านร่องเข็ม หมู่ที่ 6
</h2>

</div>



<div class="container">


<div class="menu">


<div class="card">

<div class="number">
3
</div>

ผู้พิการ

</div>


<div class="card">

<div class="number">
91
</div>

ผู้สูงอายุ

</div>


</div>



<br>



<table style="width:100%;background:white">


<thead>

<tr>

<th>ชื่อ</th>

<th>ประเภท</th>

<th>อายุ</th>

</tr>

</thead>


<tbody id="vulnerable-list">

</tbody>


</table>


</div>




<script>


fetch("../data/citizen.json")

.then(res=>res.json())

.then(data=>{


let html="";


data.citizens.forEach(c=>{


if(
c.status=="ผู้สูงอายุ"
||
c.status=="ผู้พิการ"
){


html+=`

<tr>

<td>${c.name}</td>

<td>${c.status}</td>

<td>${c.age}</td>

</tr>


`;

}


});


document.getElementById(
"vulnerable-list"
).innerHTML=html;


});


</script>



</body>

</html>
