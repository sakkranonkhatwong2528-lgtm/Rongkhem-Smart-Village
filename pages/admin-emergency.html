<!DOCTYPE html>

<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
แจ้งเหตุฉุกเฉิน | บ้านร่องเข็ม
</title>


<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="css/emergency.css">


</head>


<body>


<header class="emergency-header">


<h1>
🚨 แจ้งเหตุฉุกเฉิน
</h1>


<p>
ระบบแจ้งเหตุบ้านร่องเข็ม Smart Village
</p>


</header>





<section class="form-box">


<h2>
📢 แจ้งเหตุ
</h2>


<input id="name"
placeholder="ชื่อผู้แจ้ง">


<select id="type">

<option>
ไฟไหม้
</option>

<option>
อุบัติเหตุ
</option>

<option>
โจรกรรม
</option>

<option>
เหตุรบกวน
</option>

<option>
อื่นๆ
</option>

</select>



<input id="location"
placeholder="สถานที่เกิดเหตุ">


<select id="level">

<option>
ทั่วไป
</option>

<option>
เร่งด่วน
</option>

</select>



<button onclick="sendEmergency()">

ส่งแจ้งเหตุ

</button>


</section>







<section id="emergencyList"
class="emergency-grid">


</section>






<script src="js/emergency.js"></script>


</body>

</html>
