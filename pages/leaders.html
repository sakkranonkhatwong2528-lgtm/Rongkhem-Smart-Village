<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>ทำเนียบผู้นำ | บ้านร่องเข็ม Smart Village</title>


<style>

body{
font-family:Tahoma,sans-serif;
background:#f1f8e9;
margin:0;
}


header{
background:#2e7d32;
color:white;
padding:25px;
text-align:center;
}


.container{

max-width:1100px;
margin:auto;
padding:20px;

}


.search{

width:100%;
padding:15px;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;

}


.grid{

display:grid;
grid-template-columns:
repeat(auto-fit,minmax(260px,1fr));

gap:20px;

}


.card{

background:white;
padding:20px;
border-radius:15px;
text-align:center;
box-shadow:0 3px 10px #ccc;

}


.card img{

width:150px;
height:150px;
border-radius:50%;
object-fit:cover;

}


.position{

color:#2e7d32;
font-weight:bold;

}


button{

background:#1565c0;
color:white;
border:0;
padding:12px 20px;
border-radius:10px;

}

</style>


</head>


<body>



<header>

<h2>
👥 ทำเนียบผู้นำและคณะทำงาน
</h2>

<p>
บ้านร่องเข็ม หมู่ที่ 6
<br>
ตำบลจำป่าหวาย อำเภอเมือง จังหวัดพะเยา
</p>


</header>



<div class="container">


<input

class="search"

id="search"

placeholder="🔎 ค้นหาชื่อ หรือตำแหน่ง..."

onkeyup="searchData()"

>


<br><br>


<div id="list" class="grid">

กำลังโหลดข้อมูล...

</div>


<br>


<button onclick="location.href='../index.html'">

🏠 กลับหน้าแรก

</button>


</div>




<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


<script src="../js/firebase-config.js"></script>



<script>


let leaders=[];



async function loadData(){


let snap=

await db.collection("leaders")
.get();



leaders=[];


snap.forEach(doc=>{


leaders.push({

id:doc.id,

...doc.data()

});


});



showData(leaders);


}



function showData(data){


let html="";


data.forEach(l=>{


html+=`

<div class="card">


${

l.image

?

`<img src="${l.image}">`

:

"📷"

}


<h3>

${l.name}

</h3>


<div class="position">

🏛️ ${l.position}

</div>


<p>

📋 ${l.duty}

</p>


<p>

☎️ ${l.phone}

</p>


</div>


`;


});


document.getElementById("list")
.innerHTML=html;


}




function searchData(){


let key=

document.getElementById("search")
.value
.toLowerCase();



let result=

leaders.filter(l=>


l.name.toLowerCase()
.includes(key)

||

l.position.toLowerCase()
.includes(key)


);



showData(result);


}



loadData();


</script>


</body>

</html>
