<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ทะเบียนประชาชน | Rongkhem Smart Village</title>

<style>

body{
margin:0;
font-family:Tahoma,Arial,sans-serif;
background:#f1f8e9;
}

header{
background:#2e7d32;
color:white;
text-align:center;
padding:25px;
}

.container{
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 3px 10px #ccc;
}


table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}


th{
background:#388e3c;
color:white;
padding:12px;
}


td{
padding:10px;
text-align:center;
border-bottom:1px solid #ddd;
}


.back{
display:inline-block;
background:#388e3c;
color:white;
padding:12px 20px;
border-radius:10px;
text-decoration:none;
}


</style>

</head>


<body>


<header>

<h1>👥 ทะเบียนประชาชน</h1>

<p>
Rongkhem Smart Village<br>
บ้านร่องเข็ม หมู่ที่ 6 จังหวัดพะเยา
</p>

</header>



<div class="container">


<a class="back" href="dashboard.html">
⬅ กลับ Dashboard
</a>



<div class="card">


<h2>📋 รายชื่อประชาชน</h2>


<table>


<thead>

<tr>

<th>ลำดับ</th>
<th>ชื่อ-นามสกุล</th>
<th>เพศ</th>
<th>อายุ</th>
<th>อาชีพ</th>
<th>บ้านเลขที่</th>

</tr>

</thead>


<tbody id="citizen">

</tbody>


</table>


</div>


</div>




<script>


fetch("../data/citizen.json")


.then(response=>response.json())


.then(data=>{


let table=document.getElementById("citizen");


data.forEach((item,index)=>{


table.innerHTML += `

<tr>

<td>${index+1}</td>

<td>${item.name}</td>

<td>${item.gender}</td>

<td>${item.age}</td>

<td>${item.career}</td>

<td>${item.house_no}</td>

</tr>

`;


});


})


.catch(error=>console.log(error));


</script>



</body>

</html>
