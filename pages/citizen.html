<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
ฐานข้อมูลประชาชน | บ้านร่องเข็ม Smart Village
</title>


<style>

body{

margin:0;
font-family:Tahoma,sans-serif;
background:#e3f2fd;

}


header{

background:#1565c0;
color:white;
padding:35px;
text-align:center;

}


.container{

padding:20px;

}


.grid{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;

}


.card{

background:white;
padding:25px;
border-radius:25px;
box-shadow:0 4px 12px #ccc;

}


.icon{

font-size:45px;

}


.name{

font-size:22px;
color:#1565c0;
font-weight:bold;

}



.back{

text-align:center;
margin:30px;

}


.back a{

background:#1565c0;
color:white;
padding:12px 25px;
border-radius:20px;
text-decoration:none;

}

</style>


</head>


<body>


<header>


<h1>
👥 ฐานข้อมูลประชาชน
</h1>


<p>
บ้านร่องเข็ม Smart Village
</p>


</header>







<div class="container">


<div class="grid" id="citizenList">


</div>


</div>







<div class="back">


<a href="index.html">

🏠 กลับหน้าแรก

</a>


</div>







<script>


let citizen =

JSON.parse(

localStorage.getItem("citizen")

)||[];





function showCitizen(){


let html="";



if(citizen.length==0){


html=`

<div class="card">

<h2>
ยังไม่มีข้อมูลประชาชน
</h2>

<p>
รอการบันทึกข้อมูล

</p>

</div>

`;



}



citizen.forEach(function(item){


html+=`

<div class="card">


<div class="icon">
👤
</div>


<div class="name">

${item.name}

</div>



<p>

🏠 บ้านเลขที่ :
${item.house}

</p>



<p>

เพศ :
${item.gender}

</p>



<p>

อายุ :
${item.age}
ปี

</p>



<p>

กลุ่ม :
${item.group}

</p>



</div>

`;


});



document.getElementById("citizenList")
.innerHTML=html;



}



showCitizen();



</script>


</body>

</html>
