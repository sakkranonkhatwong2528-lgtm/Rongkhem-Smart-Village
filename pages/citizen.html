<!DOCTYPE html>

<html lang="th">

<head>

<meta charset="UTF-8">

<title>
ทะเบียนประชาชน
</title>


<link rel="stylesheet" href="../assets/css/style.css">


<style>


table{

width:100%;

background:white;

border-collapse:collapse;

border-radius:15px;

overflow:hidden;

}


th{

background:#00695c;

color:white;

padding:12px;

}


td{

padding:12px;

border-bottom:1px solid #ddd;

}


input{

width:100%;

padding:12px;

border-radius:10px;

border:1px solid #ccc;

margin-bottom:20px;

}



</style>


</head>



<body>


<div class="header">

<h1>
👥 ทะเบียนประชาชน
</h1>


<h2>
บ้านร่องเข็ม หมู่ที่ 6
</h2>

</div>



<div class="container">



<input id="search"
placeholder="🔍 ค้นหารายชื่อ..."
onkeyup="searchCitizen()">



<table>


<thead>

<tr>

<th>ชื่อ</th>

<th>เพศ</th>

<th>อายุ</th>

<th>สถานะ</th>

<th>บ้าน</th>

</tr>

</thead>


<tbody id="citizen-list">

</tbody>


</table>


<br>


<a href="../index.html">
⬅ กลับหน้าหลัก
</a>



</div>



<script>


let citizens=[];



fetch("../data/citizen.json")


.then(res=>res.json())


.then(data=>{


citizens=data.citizens;


showCitizen(citizens);


});





function showCitizen(data){


let html="";


data.forEach(c=>{


html += `


<tr>


<td>${c.name}</td>


<td>${c.gender}</td>


<td>${c.age}</td>


<td>${c.status}</td>


<td>${c.house}</td>


</tr>


`;


});


document.getElementById(
"citizen-list"
).innerHTML=html;


}





function searchCitizen(){


let text=
document.getElementById(
"search"
).value;



let result=
citizens.filter(c=>

c.name.includes(text)

);



showCitizen(result);


}


</script>



</body>

</html>
