<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ทะเบียนครัวเรือน | Rongkhem Smart Village</title>

<style>

body{
margin:0;
font-family:Tahoma,Arial,sans-serif;
background:#f1f8e9;
}

header{
background:#2e7d32;
color:white;
text-align:center;
padding:25px;
}

.container{
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 3px 10px #ccc;
}

.back{
display:inline-block;
background:#388e3c;
color:white;
padding:12px 20px;
border-radius:10px;
text-decoration:none;
margin-bottom:20px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th{
background:#388e3c;
color:white;
padding:12px;
}

td{
padding:10px;
border-bottom:1px solid #ddd;
text-align:center;
}

</style>

</head>


<body>


<header>

<h1>🏠 ทะเบียนครัวเรือน</h1>

<h2>Rongkhem Smart Village</h2>

<p>
บ้านร่องเข็ม หมู่ที่ 6<br>
ตำบลจำป่าหวาย อำเภอเมือง จังหวัดพะเยา
</p>

</header>



<div class="container">


<a class="back" href="dashboard.html">
⬅ กลับ Dashboard
</a>



<div class="card">


<h2>📋 ข้อมูลครัวเรือน</h2>


<table>

<thead>

<tr>
<th>ลำดับ</th>
<th>บ้านเลขที่</th>
<th>ชื่อเจ้าบ้าน</th>
<th>จำนวนสมาชิก</th>
<th>หมายเหตุ</th>
</tr>

</thead>


<tbody id="household">

</tbody>


</table>


</div>


</div>



<script>


fetch("../data/household.json")


.then(response=>response.json())


.then(data=>{


let table=document.getElementById("household");


data.forEach((item,index)=>{


table.innerHTML += `

<tr>

<td>${index+1}</td>

<td>${item.house_no}</td>

<td>${item.owner}</td>

<td>${item.members}</td>

<td>${item.note}</td>

</tr>

`;


});


})


.catch(error=>console.log(error));


</script>



</body>

</html>
