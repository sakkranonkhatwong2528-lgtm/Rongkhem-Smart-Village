<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ลงทะเบียนประชาชน | Rongkhem Smart Village</title>

<link rel="stylesheet" href="../css/style.css">


<style>

.container{
padding:20px;
}

.header{

background:#198754;
color:white;
padding:25px;
border-radius:15px;

}


.card{

background:white;
padding:20px;
margin-top:20px;
border-radius:15px;
box-shadow:0 3px 10px #ddd;

}


input,select{

width:100%;
padding:12px;
margin-top:8px;
margin-bottom:15px;
border-radius:10px;
border:1px solid #ccc;

}


button{

background:#198754;
color:white;
border:none;
padding:12px 25px;
border-radius:10px;

}


.row{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;

}

</style>


</head>


<body>


<div class="container">



<div class="header">

<h1>
👤 ลงทะเบียนประชาชน
</h1>

<p>
🏡 Rongkhem Smart Village
<br>
บ้านร่องเข็ม หมู่ที่ 6 จังหวัดพะเยา
</p>

</div>







<div class="card">


<h2>
📝 ข้อมูลส่วนตัว
</h2>



<div class="row">


<div>

<label>
คำนำหน้า
</label>

<select>

<option>
นาย
</option>

<option>
นาง
</option>

<option>
นางสาว
</option>

</select>

</div>



<div>

<label>
ชื่อ
</label>

<input placeholder="ชื่อ">

</div>



<div>

<label>
นามสกุล
</label>

<input placeholder="นามสกุล">

</div>


</div>





<label>
วันเดือนปีเกิด
</label>

<input type="date">



<label>
เลขบัตรประชาชน
</label>

<input placeholder="กรอกเลขบัตรประชาชน">


<label>
เบอร์โทรศัพท์
</label>

<input placeholder="เบอร์โทร">


</div>








<div class="card">


<h2>
🏠 ข้อมูลครัวเรือน
</h2>


<label>
บ้านเลขที่
</label>

<input placeholder="เช่น 12/1">


<label>
หมู่ที่
</label>

<input value="6">


<label>
สถานะในครัวเรือน
</label>


<select>

<option>
เจ้าบ้าน
</option>

<option>
สมาชิกในครัวเรือน
</option>

</select>


</div>








<div class="card">


<h2>
👥 ข้อมูลชุมชน
</h2>


<label>
กลุ่มประชาชน
</label>


<select>

<option>
ประชาชนทั่วไป
</option>

<option>
ผู้สูงอายุ
</option>

<option>
อสม.
</option>

<option>
ชรบ.
</option>

<option>
คณะกรรมการหมู่บ้าน
</option>

</select>


</div>








<div class="card">


<h2>
🔐 บัญชีเข้าใช้งาน
</h2>


<label>
ชื่อผู้ใช้งาน
</label>

<input placeholder="Username">


<label>
รหัสผ่าน
</label>

<input type="password">


</div>








<div class="card">


<h2>
✅ ยืนยันข้อมูล
</h2>


<label>

<input type="checkbox">

ข้าพเจ้ายืนยันว่าข้อมูลถูกต้อง

</label>


<br><br>


<button>

ลงทะเบียน

</button>


</div>






</div>


</body>

</html>
