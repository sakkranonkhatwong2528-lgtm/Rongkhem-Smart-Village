<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
ศูนย์เอกสารดาวน์โหลด | บ้านร่องเข็ม Smart Village
</title>


<style>

body{

margin:0;
font-family:Tahoma,sans-serif;
background:#eceff1;

}


header{

background:#37474f;
color:white;
text-align:center;
padding:30px;

}


.container{

padding:20px;

}


.document{

background:white;
padding:20px;
margin-bottom:20px;
border-radius:20px;
box-shadow:0 4px 12px #ccc;

}


.document h2{

color:#37474f;

}


.type{

background:#37474f;
color:white;
padding:6px 15px;
border-radius:20px;
display:inline-block;

}


.download{

display:inline-block;
background:#00897b;
color:white;
padding:10px 20px;
border-radius:20px;
text-decoration:none;

}


.default{

background:white;
padding:20px;
border-radius:20px;

}


.back{

text-align:center;
margin:30px;

}


.back a{

background:#37474f;
color:white;
padding:12px 25px;
border-radius:20px;
text-decoration:none;

}

</style>

</head>



<body>



<header>

<h1>
📂 ศูนย์เอกสารหมู่บ้าน
</h1>

<p>
บ้านร่องเข็ม Smart Village
</p>

</header>





<div class="container">


<div id="documentList">


</div>


</div>





<div class="back">

<a href="index.html">

🏠 กลับหน้าแรก

</a>

</div>






<script>


function loadDocument(){



let data =

JSON.parse(
localStorage.getItem("document")
) || [];



let html="";




// เอกสารตัวอย่าง

if(data.length==0){


html += `


<div class="document">


<h2>
📜 เอกสารหมู่บ้าน
</h2>


<p>
ระบบกำลังเตรียมข้อมูลเอกสาร
</p>


<p>
สามารถดาวน์โหลดคำสั่ง
ประกาศ และรายงานประชุมได้ที่นี่
</p>


</div>


`;



}





// แสดงเอกสารจาก Admin


data.reverse();



data.forEach(function(item){



html += `


<div class="document">


<span class="type">

${item.type}

</span>



<h2>

📄 ${item.name}

</h2>



<p>

ไฟล์ :
${item.file}

</p>



<a class="download"
href="documents/${item.file}"
download>

⬇ ดาวน์โหลด

</a>



</div>


`;



});



document.getElementById("documentList")
.innerHTML=html;



}



loadDocument();



</script>



</body>

</html>
