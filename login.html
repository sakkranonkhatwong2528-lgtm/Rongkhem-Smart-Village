<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>เข้าสู่ระบบ | บ้านร่องเข็ม Smart Village</title>

<style>

body{
margin:0;
font-family:Tahoma,sans-serif;
background:#e8f5e9;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.box{
background:white;
width:350px;
padding:30px;
border-radius:25px;
box-shadow:0 5px 20px #aaa;
text-align:center;
}

.logo{
width:100px;
}

input{
width:90%;
padding:12px;
margin:10px;
border-radius:15px;
border:1px solid #ccc;
}

button{
width:95%;
padding:12px;
border:0;
border-radius:20px;
background:#2e7d32;
color:white;
font-size:16px;
}

#error{
color:red;
}

</style>

</head>

<body>


<div class="box">

<img src="images/logo.svg" class="logo">

<h2>⚙️ ผู้ดูแลระบบ</h2>

<p>บ้านร่องเข็ม Smart Village</p>


<input id="username" placeholder="ชื่อผู้ใช้">


<input id="password" type="password" placeholder="รหัสผ่าน">


<button onclick="login()">
🔐 เข้าสู่ระบบ
</button>


<p id="error"></p>


</div>




<script>

let users=[];


// โหลด user.json

fetch("data/user.json")
.then(res=>res.json())
.then(data=>{

users=data;

console.log("USERS =",users);

})
.catch(err=>{

console.error(err);

});





function login(){


let username =
document.getElementById("username").value.trim();


let password =
document.getElementById("password").value.trim();





let user = users.find(function(u){


return u.username === username
&&
u.password === password;


});





if(user){


localStorage.setItem(
"loginUser",
JSON.stringify(user)
);



window.location.href="admin.html";


}

else{


document.getElementById("error").innerHTML =
"❌ ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง";


}


}


</script>


</body>
</html>
