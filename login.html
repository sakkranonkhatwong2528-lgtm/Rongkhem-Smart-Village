<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Rongkhem Smart Village</title>


<style>

*{
box-sizing:border-box;
font-family:"Tahoma",sans-serif;
}


body{

margin:0;

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:
linear-gradient(
135deg,
#1b5e20,
#81c784
);

}



.login-box{

background:white;

width:360px;

padding:35px;

border-radius:25px;

box-shadow:
0 10px 30px rgba(0,0,0,.3);

text-align:center;

}



.logo{

font-size:70px;

}



h1{

color:#1b5e20;

margin-bottom:5px;

}



input{

width:100%;

padding:15px;

margin:10px 0;

border-radius:12px;

border:1px solid #ccc;

font-size:16px;

}



button{

width:100%;

padding:15px;

background:#2e7d32;

color:white;

border:none;

border-radius:12px;

font-size:18px;

cursor:pointer;

}



button:hover{

background:#1b5e20;

}



#error{

color:red;

margin-top:15px;

}


.footer{

margin-top:20px;

font-size:13px;

color:#777;

}


</style>


</head>


<body>


<div class="login-box">


<div class="logo">
🏡
</div>


<h1>
Rongkhem Smart Village
</h1>


<p>
🔐 ระบบบริหารจัดการหมู่บ้านอัจฉริยะ
</p>

<p>
ผู้ดูแลระบบ : ผู้ใหญ่บ้าน
</p>


<input 
id="username"
placeholder="ชื่อผู้ใช้งาน">



<input 
id="password"
type="password"
placeholder="รหัสผ่าน">



<button onclick="login()">

เข้าสู่ระบบ

</button>



<div id="error"></div>


<div class="footer">

บ้านร่องเข็ม หมู่ที่ 6<br>
ตำบลจำป่าหวาย จังหวัดพะเยา

</div>


</div>




<script>


function login(){


let user =
document.getElementById("username").value;


let pass =
document.getElementById("password").value;



// บัญชีเริ่มต้น

if(
user==="admin"
&&
pass==="123456"

){


localStorage.setItem(
"login",
"true"
);


window.location.href=
"admin.html";


}


else{


document.getElementById("error").innerHTML=

"❌ ข้อมูลเข้าสู่ระบบไม่ถูกต้อง";


}


}



</script>


</body>

</html>
