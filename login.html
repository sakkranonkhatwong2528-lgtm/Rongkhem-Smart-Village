<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
เข้าสู่ระบบ | บ้านร่องเข็ม Smart Village
</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;
font-family:Tahoma,sans-serif;
background:
linear-gradient(
135deg,
#2e7d32,
#81c784
);

height:100vh;

display:flex;
justify-content:center;
align-items:center;

}



.login-box{

background:white;

width:350px;

padding:35px;

border-radius:25px;

box-shadow:
0 10px 30px rgba(0,0,0,.25);

text-align:center;

}



.logo{

width:100px;

margin-bottom:10px;

}



h1{

color:#2e7d32;

font-size:24px;

}



input{

width:100%;

padding:14px;

margin:10px 0;

border-radius:15px;

border:1px solid #ccc;

font-size:16px;

}



button{

width:100%;

padding:14px;

border:none;

border-radius:20px;

background:#2e7d32;

color:white;

font-size:17px;

cursor:pointer;

}



button:hover{

background:#1b5e20;

}



#error{

color:red;

margin-top:15px;

}



.back{

margin-top:20px;

}



.back a{

text-decoration:none;

color:#2e7d32;

}



</style>


</head>


<body>



<div class="login-box">


<img 
src="images/logo.svg"
class="logo">



<h1>
⚙️ ผู้ดูแลระบบ
</h1>



<p>
บ้านร่องเข็ม Smart Village
</p>




<input

id="username"

placeholder="ชื่อผู้ใช้"

>



<input

id="password"

type="password"

placeholder="รหัสผ่าน"

>



<button onclick="login()">

🔐 เข้าสู่ระบบ

</button>



<p id="error"></p>




<div class="back">

<a href="index.html">

🏠 กลับหน้าแรก

</a>

</div>



</div>








<script>


let users=[];



// โหลดผู้ใช้งาน

fetch("data/user.json")


.then(response=>{


if(!response.ok){

throw new Error(
"ไม่พบ user.json"
);

}


return response.json();


})


.then(data=>{


users=data;


console.log(
"โหลดผู้ใช้สำเร็จ",
users
);


})


.catch(error=>{


console.error(error);


document
.getElementById("error")
.innerHTML=
"ไม่สามารถโหลดข้อมูลผู้ใช้";


});







function login(){



let username=

document
.getElementById("username")
.value
.trim();



let password=

document
.getElementById("password")
.value
.trim();





if(
username===""
||
password===""
){

document
.getElementById("error")
.innerHTML=
"กรุณากรอกข้อมูลให้ครบ";

return;

}






let user=

users.find(item=>


item.username===username

&&

item.password===password


);





if(user){



localStorage.setItem(

"loginUser",

JSON.stringify({

name:user.name,

role:user.role

})

);



window.location.href=
"admin.html";



}else{



document
.getElementById("error")
.innerHTML=

"❌ ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง";


}



}



</script>



</body>

</html>
