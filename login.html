<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
เข้าสู่ระบบ | บ้านร่องเข็ม Smart Village
</title>


<style>

body{

font-family:Tahoma,sans-serif;
background:#e8f5e9;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;

}


.login-box{

background:white;
padding:30px;
border-radius:25px;
width:320px;
box-shadow:0 5px 20px #ccc;
text-align:center;

}


input{

width:90%;
padding:12px;
margin:10px;
border-radius:15px;
border:1px solid #ccc;

}


button{

background:#2e7d32;
color:white;
border:none;
padding:12px 30px;
border-radius:20px;
cursor:pointer;

}


.logo{

width:100px;

}


#error{

color:red;

}


</style>


</head>


<body>



<div class="login-box">


<img 
src="images/logo.svg"
class="logo">


<h2>
⚙️ ผู้ดูแลระบบ
</h2>


<p>
บ้านร่องเข็ม Smart Village
</p>



<input

id="username"

placeholder="ชื่อผู้ใช้"


>



<input

id="password"

type="password"

placeholder="รหัสผ่าน"


>




<button onclick="login()">

เข้าสู่ระบบ

</button>



<p id="error"></p>



</div>







<script>


let users=[];



// โหลด user.json

fetch("data/user.json")


.then(res=>res.json())


.then(data=>{


users=data;


})

.catch(err=>{


console.error(err);


});








function login(){



let username=

document
.getElementById("username")
.value;



let password=

document
.getElementById("password")
.value;





let user=

users.find(u=>

u.username===username

&&

u.password===password

);





if(user){



localStorage.setItem(
"loginUser",
JSON.stringify(user)
);



window.location.href="admin.html";



}else{


document
.getElementById("error")
.innerHTML=

"❌ ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง";


}



}



</script>



</body>

</html>
