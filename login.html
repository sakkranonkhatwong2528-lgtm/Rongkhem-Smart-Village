<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
เข้าสู่ระบบผู้ดูแล
</title>


<style>

body{

font-family:"Sarabun",sans-serif;
background:#e3f2fd;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;

}


.login-box{

background:white;
width:350px;
padding:30px;
border-radius:20px;
box-shadow:0 3px 10px #aaa;
text-align:center;

}


input{

width:90%;
padding:12px;
margin:10px;
border-radius:10px;
border:1px solid #ccc;

}


button{

width:95%;
padding:12px;
background:#1565c0;
color:white;
border:0;
border-radius:10px;
font-size:18px;

}


h2{

color:#1565c0;

}

</style>

</head>


<body>



<div class="login-box">


<h2>
🔐 Admin Login
</h2>


<p>
Rongkhem Smart Village
</p>



<input id="username"
placeholder="ชื่อผู้ใช้">


<input id="password"
type="password"
placeholder="รหัสผ่าน">



<button onclick="login()">

เข้าสู่ระบบ

</button>



<p id="message"></p>


</div>





<script>


function login(){


let user =

document.getElementById("username").value;



let pass =

document.getElementById("password").value;



// ตัวอย่างผู้ดูแลระบบ

if(
user=="admin"
&&
pass=="123456"
){


localStorage.setItem(

"login",

"true"

);



window.location.href=
"dashboard.html";



}

else{


document.getElementById("message").innerHTML=

"❌ ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง";


}



}



</script>


</body>

</html>
