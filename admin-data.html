<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
จัดการข้อมูลชุมชน | บ้านร่องเข็ม Smart Village
</title>


<style>


body{

margin:0;
font-family:Tahoma,sans-serif;
background:#e8eaf6;

}



header{

background:#283593;
color:white;
padding:30px;
text-align:center;

}



.container{

padding:20px;

}



.card{

background:white;
padding:25px;
border-radius:25px;
box-shadow:0 4px 12px #ccc;

}



input,textarea{

width:100%;
padding:12px;
margin:10px 0;
border-radius:10px;
border:1px solid #ccc;
box-sizing:border-box;

}



button{

background:#283593;
color:white;
padding:12px 30px;
border:none;
border-radius:20px;

}



.result{

background:#e8eaf6;
padding:20px;
margin-top:20px;
border-radius:20px;

}



.back{

text-align:center;
margin:30px;

}



.back a{

background:#283593;
color:white;
padding:12px 25px;
border-radius:20px;
text-decoration:none;

}


</style>


</head>



<body>



<header>


<h1>
📊 จัดการข้อมูลชุมชน
</h1>


<p>
Admin บ้านร่องเข็ม Smart Village
</p>


</header>







<div class="container">



<div class="card">


<h2>
📋 กรอกข้อมูลพื้นฐานหมู่บ้าน
</h2>




<label>
🏠 จำนวนครัวเรือน
</label>


<input
id="home"
type="number"
placeholder="จำนวนหลังคาเรือน">






<label>
👥 จำนวนประชากร
</label>


<input
id="people"
type="number"
placeholder="จำนวนประชากร">






<label>
👨 จำนวนเพศชาย
</label>


<input
id="male"
type="number">






<label>
👩 จำนวนเพศหญิง
</label>


<input
id="female"
type="number">






<label>
👴 ผู้สูงอายุ
</label>


<input
id="elder"
type="number">






<label>
♿ ผู้พิการ
</label>


<input
id="disabled"
type="number">






<label>
🏘 กลุ่มองค์กรชุมชน
</label>


<textarea
id="group"
rows="5"
placeholder="
เช่น อสม. กองทุนหมู่บ้าน วิสาหกิจชุมชน ชรบ.
">

</textarea>






<label>
🌱 ทรัพยากรสำคัญ
</label>


<textarea
id="resource"
rows="5"
placeholder="
เช่น แหล่งซับน้ำจำ ป่าชุมชน พื้นที่เกษตร
">

</textarea>






<button onclick="saveData()">

💾 บันทึกข้อมูล

</button>





<div class="result" id="show">

</div>



</div>


</div>







<div class="back">


<a href="admin-dashboard.html">

⚙️ กลับ Dashboard

</a>


</div>








<script>


loadData();





function saveData(){



let data={


home:

document.getElementById("home").value,


people:

document.getElementById("people").value,


male:

document.getElementById("male").value,


female:

document.getElementById("female").value,


elder:

document.getElementById("elder").value,


disabled:

document.getElementById("disabled").value,


group:

document.getElementById("group").value,


resource:

document.getElementById("resource").value


};




localStorage.setItem(

"community",

JSON.stringify(data)

);




alert("บันทึกข้อมูลชุมชนเรียบร้อย");


showData();


}







function loadData(){



let data=

JSON.parse(

localStorage.getItem("community")

);



if(data){


home.value=data.home;

people.value=data.people;

male.value=data.male;

female.value=data.female;

elder.value=data.elder;

disabled.value=data.disabled;

group.value=data.group;

resource.value=data.resource;


}


showData();


}








function showData(){


let data=

JSON.parse(

localStorage.getItem("community")

);



if(!data)return;



document.getElementById("show").innerHTML=`

<h3>
ข้อมูลปัจจุบัน
</h3>


<p>
🏠 ครัวเรือน :
${data.home}
</p>


<p>
👥 ประชากร :
${data.people}
</p>


<p>
👨 ชาย :
${data.male}
</p>


<p>
👩 หญิง :
${data.female}
</p>


<p>
👴 ผู้สูงอายุ :
${data.elder}
</p>


<p>
♿ ผู้พิการ :
${data.disabled}
</p>


`;



}



</script>






</body>

</html>
