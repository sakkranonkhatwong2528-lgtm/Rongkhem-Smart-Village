<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
จัดการแหล่งซับน้ำจำ | บ้านร่องเข็ม Smart Village
</title>


<style>

body{

margin:0;
font-family:Tahoma,sans-serif;
background:#e0f2f1;

}


header{

background:#00695c;
color:white;
padding:30px;
text-align:center;

}



.container{

padding:20px;

}



.card{

background:white;
padding:25px;
border-radius:25px;
box-shadow:0 4px 12px #ccc;
margin-bottom:20px;

}



input,textarea,select{

width:100%;
padding:12px;
margin:10px 0;
border-radius:10px;
border:1px solid #ccc;
box-sizing:border-box;

}



button{

background:#00695c;
color:white;
padding:12px 30px;
border:none;
border-radius:20px;

}



.item{

background:#e0f2f1;
padding:15px;
border-radius:15px;
margin-top:15px;

}



.delete{

background:#c62828;
color:white;
border:none;
padding:8px 15px;
border-radius:15px;

}



.back{

text-align:center;
margin:30px;

}



.back a{

background:#00695c;
color:white;
padding:12px 25px;
border-radius:20px;
text-decoration:none;

}

</style>


</head>


<body>



<header>

<h1>
💧 จัดการแหล่งซับน้ำจำ
</h1>


<p>
Admin Resource Management
</p>


</header>








<div class="container">



<div class="card">


<h2>
➕ เพิ่มข้อมูลทรัพยากร
</h2>



<label>
ประเภทข้อมูล
</label>


<select id="type">


<option>
ประวัติแหล่งซับน้ำจำ
</option>


<option>
พันธุ์ไม้
</option>


<option>
สัตว์น้ำและสิ่งมีชีวิต
</option>


<option>
กิจกรรมอนุรักษ์
</option>


<option>
ข่าวประชาสัมพันธ์
</option>


</select>





<label>
หัวข้อ
</label>


<input id="title"

placeholder="เช่น ปูนาเฉพาะถิ่น">




<label>
รายละเอียด
</label>


<textarea id="detail"

rows="5"

placeholder="รายละเอียดข้อมูล">

</textarea>





<label>
ชื่อรูปภาพ
</label>


<input id="image"

placeholder="เช่น crab.jpg">





<button onclick="saveData()">

💾 บันทึกข้อมูล

</button>


</div>







<div class="card">


<h2>
📋 ข้อมูลแหล่งซับน้ำจำ
</h2>


<div id="list">

</div>


</div>



</div>








<div class="back">


<a href="admin-dashboard.html">

⚙️ กลับ Dashboard

</a>


</div>







<script>


let subnamjam =

JSON.parse(

localStorage.getItem("subnamjam")

)||[];





showList();





function saveData(){



let data={


type:

document.getElementById("type").value,


title:

document.getElementById("title").value,


detail:

document.getElementById("detail").value,


image:

document.getElementById("image").value


};




subnamjam.push(data);



localStorage.setItem(

"subnamjam",

JSON.stringify(subnamjam)

);



alert("เพิ่มข้อมูลแหล่งซับน้ำจำเรียบร้อย");



showList();


}





function showList(){



let html="";



subnamjam.forEach(function(item,index){



html+=`

<div class="item">


<b>
${item.title}
</b>


<br>


ประเภท :
${item.type}


<br>


รายละเอียด :
${item.detail}


<br><br>


<button class="delete"

onclick="deleteData(${index})">

ลบ

</button>


</div>

`;



});



document.getElementById("list")
.innerHTML=html;


}







function deleteData(index){



subnamjam.splice(index,1);



localStorage.setItem(

"subnamjam",

JSON.stringify(subnamjam)

);



showList();



}


</script>






</body>

</html>
