<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ทำเนียบผู้นำชุมชน | บ้านร่องเข็ม Smart Village</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Sarabun) -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- 1. TOP HEADER -->
    <div id="header-container"></div>

    <!-- 2. MAIN CONTAINER -->
    <div class="flex flex-1 max-w-7xl w-full mx-auto">
        
        <!-- SIDEBAR -->
        <div id="sidebar-container" class="hidden md:block"></div>

        <!-- MAIN CONTENT AREA -->
        <main class="flex-1 p-4 sm:p-6 lg:p-8 space-y-6">
            
            <!-- Header ประจำหน้า -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between bg-slate-900/80 p-5 rounded-2xl border border-slate-800 shadow-xl gap-4 backdrop-blur-md">
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold text-amber-400 flex items-center gap-2">
                        <span>👥</span> ทำเนียบผู้นำและคณะทำงาน
                    </h1>
                    <p class="text-xs text-gray-400">บ้านร่องเข็ม หมู่ที่ 6 ตำบลจำป่าหวาย อำเภอเมือง จังหวัดพะเยา</p>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="toggleForm()" class="px-4 py-2 text-xs bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl shadow-lg transition flex items-center gap-1.5">
                        <span>➕</span> เพิ่ม/จัดการผู้นำ
                    </button>
                    <a href="index.html" class="px-4 py-2 text-xs bg-slate-800 hover:bg-slate-700 text-gray-300 font-medium rounded-xl border border-slate-700 transition flex items-center gap-1.5">
                        <span>🏠</span> กลับหน้าแรก
                    </a>
                </div>
            </div>

            <!-- ฟอร์มเพิ่ม/แก้ไขผู้นำชุมชน (ซ่อนอยู่ สามารถกดปุ่มเปิดได้) -->
            <div id="leaderFormCard" class="hidden bg-slate-900/90 p-6 rounded-2xl border border-amber-500/40 shadow-2xl space-y-4">
                <h2 class="text-base font-bold text-amber-400 border-b border-slate-800 pb-3 flex items-center justify-between">
                    <span>📝 บันทึกข้อมูลและอัปโหลดรูปภาพผู้นำ</span>
                    <button onclick="toggleForm()" class="text-gray-400 hover:text-white text-xs">❌ ปิด</button>
                </h2>

                <form onsubmit="saveLeader(event)" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 text-xs">
                    <input type="hidden" id="leaderEditIndex" value="">
                    <div>
                        <label class="block text-gray-300 mb-1 font-semibold">ชื่อ - นามสกุล <span class="text-rose-400">*</span></label>
                        <input type="text" id="leaderNameInput" required placeholder="นายศักรนนท์ ขัติย์วงศ์" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-white focus:outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label class="block text-gray-300 mb-1 font-semibold">ตำแหน่ง <span class="text-rose-400">*</span></label>
                        <input type="text" id="leaderRoleInput" required placeholder="ผู้ใหญ่บ้าน / ผู้ช่วยผู้ใหญ่บ้าน" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-white focus:outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label class="block text-gray-300 mb-1 font-semibold">เบอร์โทรศัพท์ติดต่อ</label>
                        <input type="tel" id="leaderPhoneInput" placeholder="08X-XXX-XXXX" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-white focus:outline-none focus:border-amber-500">
                    </div>
                    <div class="sm:col-span-2 lg:col-span-3">
                        <label class="block text-gray-300 mb-1 font-semibold">อัปโหลดรูปภาพประจำตัว (อัปจากไฟล์ภาพในเครื่อง)</label>
                        <input type="file" id="leaderImageInput" accept="image/*" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-gray-400 file:mr-4 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-amber-500/20 file:text-amber-400 hover:file:bg-amber-500/30">
                        <span class="text-[10px] text-gray-500 mt-1 block">* รองรับไฟล์ภาพ .JPG, .PNG รูปจะถูกประมวลผลจัดเก็บลงในระบบทันที</span>
                    </div>

                    <div class="sm:col-span-2 lg:col-span-3 flex justify-end gap-2 pt-2 border-t border-slate-800">
                        <button type="button" onclick="resetForm()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-gray-300 font-medium rounded-xl">ยกเลิก</button>
                        <button type="submit" class="px-5 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl shadow-lg shadow-amber-500/20">💾 บันทึกข้อมูลผู้นำ</button>
                    </div>
                </form>
            </div>

            <!-- GRID ทำเนียบผู้นำ -->
            <div id="leadersGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- รายชื่อจะถูก Render ผ่าน JavaScript -->
            </div>

        </main>
    </div>

    <!-- 3. FOOTER -->
    <div id="footer-container"></div>

    <script src="js/main.js"></script>
    <script>
        // ข้อมูลผู้นำตั้งต้น (หากไม่มีข้อมูลใน LocalStorage)
        const defaultLeaders = [
            {
                name: "นายศักรนนท์ ขัติย์วงศ์",
                role: "ผู้ใหญ่บ้านร่องเข็ม หมู่ 6",
                phone: "081-XXX-XXXX",
                image: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=600&q=80"
            },
            {
                name: "ผู้ช่วยผู้ใหญ่บ้าน (ฝ่ายปกครอง)",
                role: "ผู้ช่วยผู้ใหญ่บ้าน หมู่ 6",
                phone: "082-XXX-XXXX",
                image: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=600&q=80"
            },
            {
                name: "ประธาน อสม. หมู่ 6",
                role: "ประธานอาสาสมัครสาธารณสุขประจำหมู่บ้าน",
                phone: "083-XXX-XXXX",
                image: "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=600&q=80"
            }
        ];

        // ดึงข้อมูลจาก LocalStorage
        function getLeaders() {
            const data = localStorage.getItem('rongkhem_leaders_list');
            return data ? JSON.parse(data) : defaultLeaders;
        }

        // แสดงผลทำเนียบผู้นำ
        function renderLeaders() {
            const leaders = getLeaders();
            const grid = document.getElementById('leadersGrid');

            grid.innerHTML = leaders.map((leader, index) => `
                <div class="bg-slate-900/80 rounded-2xl border border-slate-800 overflow-hidden shadow-xl hover:border-slate-700 transition flex flex-col justify-between">
                    <div class="p-5 space-y-4">
                        <div class="w-28 h-28 mx-auto rounded-full overflow-hidden border-2 border-amber-500/40 shadow-lg">
                            <img src="${leader.image}" alt="${leader.name}" class="w-full h-full object-cover">
                        </div>
                        <div class="text-center space-y-1">
                            <h3 class="font-bold text-white text-base">${leader.name}</h3>
                            <p class="text-xs text-amber-400 font-semibold">${leader.role}</p>
                            <p class="text-xs text-gray-400 font-mono">📞 ${leader.phone || 'ไม่ระบุเบอร์'}</p>
                        </div>
                    </div>
                    <div class="p-3 bg-slate-950/60 border-t border-slate-800/80 flex items-center justify-between text-xs">
                        <button onclick="editLeader(${index})" class="px-3 py-1 bg-amber-500/10 text-amber-400 hover:bg-amber-500/20 rounded-lg font-medium transition">
                            ✏️ แก้ไข
                        </button>
                        <button onclick="deleteLeader(${index})" class="px-3 py-1 bg-rose-500/10 text-rose-400 hover:bg-rose-500/20 rounded-lg font-medium transition">
                            🗑️ ลบ
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // ซ่อน / แสดงฟอร์ม
        function toggleForm() {
            const form = document.getElementById('leaderFormCard');
            form.classList.toggle('hidden');
        }

        // บันทึก / เพิ่มข้อมูลผู้นำ
        function saveLeader(e) {
            e.preventDefault();
            const index = document.getElementById('leaderEditIndex').value;
            const name = document.getElementById('leaderNameInput').value;
            const role = document.getElementById('leaderRoleInput').value;
            const phone = document.getElementById('leaderPhoneInput').value;
            const imageInput = document.getElementById('leaderImageInput');

            let leaders = getLeaders();

            const handleSave = (imageData) => {
                const newLeader = {
                    name: name,
                    role: role,
                    phone: phone,
                    image: imageData || (index !== "" ? leaders[index].image : 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=600&q=80')
                };

                if (index !== "") {
                    leaders[index] = newLeader;
                } else {
                    leaders.push(newLeader);
                }

                localStorage.setItem('rongkhem_leaders_list', JSON.stringify(leaders));
                renderLeaders();
                resetForm();
                toggleForm();
                alert('💾 บันทึกข้อมูลทำเนียบผู้นำเรียบร้อยแล้ว!');
            };

            // กรณีมีการอัปโหลดรูปภาพใหม่
            if (imageInput.files && imageInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    handleSave(event.target.result); // แปลงรูปเป็น Base64
                };
                reader.readAsDataURL(imageInput.files[0]);
            } else {
                handleSave(null);
            }
        }

        // แก้ไขข้อมูลผู้นำ
        function editLeader(index) {
            const leaders = getLeaders();
            const item = leaders[index];

            document.getElementById('leaderEditIndex').value = index;
            document.getElementById('leaderNameInput').value = item.name;
            document.getElementById('leaderRoleInput').value = item.role;
            document.getElementById('leaderPhoneInput').value = item.phone;

            document.getElementById('leaderFormCard').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ลบข้อมูลผู้นำ
        function deleteLeader(index) {
            if (confirm('คุณต้องการลบข้อมูลผู้นำท่านนี้ออกจากทำเนียบใช่หรือไม่?')) {
                let leaders = getLeaders();
                leaders.splice(index, 1);
                localStorage.setItem('rongkhem_leaders_list', JSON.stringify(leaders));
                renderLeaders();
            }
        }

        function resetForm() {
            document.getElementById('leaderEditIndex').value = "";
            document.getElementById('leaderNameInput').value = "";
            document.getElementById('leaderRoleInput').value = "";
            document.getElementById('leaderPhoneInput').value = "";
            document.getElementById('leaderImageInput').value = "";
        }

        // โหลดข้อมูลเมื่อเปิดหน้าเว็บ
        document.addEventListener("DOMContentLoaded", renderLeaders);
    </script>
</body>
</html>
