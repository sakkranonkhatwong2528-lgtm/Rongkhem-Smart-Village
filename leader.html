<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
ทำเนียบผู้นำ | บ้านร่องเข็ม Smart Village
</title>


<style>

body{

margin:0;
font-family:Tahoma,sans-serif;
background:#f5f5f5;

}


header{

background:#2e7d32;
color:white;
padding:35px;
text-align:center;

}


.container{

padding:20px;

}


.search{

width:100%;
padding:12px;
border-radius:20px;
border:1px solid #ccc;
font-size:16px;
margin-bottom:20px;

}



.grid{

display:grid;
grid-template-columns:
repeat(auto-fit,minmax(260px,1fr));

gap:20px;

}



.card{

background:white;
padding:20px;
border-radius:25px;
text-align:center;
box-shadow:0 4px 12px #ccc;

}



.card img{

width:150px;
height:150px;
border-radius:50%;
object-fit:cover;
border:5px solid #2e7d32;

}



.position{

display:inline-block;
background:#2e7d32;
color:white;
padding:8px 18px;
border-radius:20px;
margin-top:15px;

}



.name{

font-size:22px;
font-weight:bold;
color:#2e7d32;
margin-top:15px;

}



.duty{

color:#555;

}



.phone{

margin-top:10px;

}



.back{

text-align:center;
margin:30px;

}


.back a{

background:#2e7d32;
color:white;
padding:12px 25px;
border-radius:20px;
text-decoration:none;

}


</style>

</head>



<body>



<header>

<h1>
👥 ทำเนียบผู้นำและคณะทำงาน
</h1>

<p>
บ้านร่องเข็ม หมู่ที่ 6<br>
ตำบลจำป่าหวาย อำเภอเมือง จังหวัดพะเยา
</p>

</header>




<div class="container">


<input

class="search"

id="search"

placeholder="🔎 ค้นหาชื่อ หรือตำแหน่ง..."

onkeyup="searchLeader()"

>




<div class="grid" id="leaders">

กำลังโหลดข้อมูล...

</div>



</div>





<div class="back">

<a href="index.html">

🏠 กลับหน้าแรก

</a>

</div>







<script>


let leaders=[];




// โหลดข้อมูลจาก JSON

fetch("data/leader.json")


.then(response=>response.json())


.then(data=>{


leaders=data;


showLeader(leaders);


})


.catch(error=>{


document.getElementById("leaders").innerHTML=`

<div class="card">

<h2>
โหลดข้อมูลไม่สำเร็จ
</h2>

<p>
กรุณาตรวจสอบ leader.json
</p>

</div>

`;

console.error(error);


});








function showLeader(data){


let html="";



if(data.length===0){


html=`

<div class="card">

<h2>
ยังไม่มีข้อมูล
</h2>

</div>

`;



}else{



data.forEach(item=>{


html+=`

<div class="card">


<img src="${item.image || 'images/leaders/default.png'}">


<div class="position">

${item.position || "-"}

</div>



<div class="name">

${item.name || "อยู่ระหว่างปรับปรุงข้อมูล"}

</div>



<div class="duty">

${item.duty || ""}

</div>



<div class="phone">

☎️ ${item.phone || "-"}

</div>



</div>

`;



});


}



document
.getElementById("leaders")
.innerHTML=html;



}








function searchLeader(){


let key=

document
.getElementById("search")
.value
.toLowerCase();




let result=

leaders.filter(item=>{


return (

(item.name || "")
.toLowerCase()
.includes(key)

||

(item.position || "")
.toLowerCase()
.includes(key)

);


});



showLeader(result);


}



</script>




</body>

</html>
