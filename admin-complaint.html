<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
จัดการเรื่องร้องเรียน | บ้านร่องเข็ม Smart Village
</title>


<style>


body{

margin:0;
font-family:Tahoma,sans-serif;
background:#fffde7;

}



header{

background:#ef6c00;
color:white;
padding:30px;
text-align:center;

}



.container{

padding:20px;

}



.card{

background:white;
padding:25px;
border-radius:25px;
box-shadow:0 4px 12px #ccc;
margin-bottom:20px;

}



.item{

background:#fff8e1;
padding:20px;
border-radius:20px;
margin-top:15px;

}



select,textarea{

width:100%;
padding:10px;
margin-top:10px;
border-radius:10px;
border:1px solid #ccc;

}



button{

background:#ef6c00;
color:white;
border:none;
padding:10px 25px;
border-radius:20px;
margin-top:10px;

}



.delete{

background:#c62828;

}



.back{

text-align:center;
margin:30px;

}



.back a{

background:#ef6c00;
color:white;
padding:12px 25px;
border-radius:20px;
text-decoration:none;

}


</style>

</head>


<body>



<header>


<h1>
📝 จัดการเรื่องร้องเรียน
</h1>


<p>
Admin บ้านร่องเข็ม Smart Village
</p>


</header>







<div class="container">


<div class="card">


<h2>
📋 รายการแจ้งปัญหา
</h2>


<div id="list">

</div>


</div>



</div>








<div class="back">


<a href="admin-dashboard.html">

⚙️ กลับ Dashboard

</a>


</div>








<script>


let complaints =

JSON.parse(

localStorage.getItem("complaints")

)||[];




showComplaint();






function showComplaint(){



let html="";



if(complaints.length==0){


html=`

<p>
ยังไม่มีรายการแจ้งปัญหา
</p>

`;



}



complaints.forEach(function(item,index){



html += `


<div class="item">


<h3>
📌 ${item.type}
</h3>



<p>

${item.detail}

</p>



<p>

📍 สถานที่ :
${item.location}

</p>





<label>
สถานะ
</label>



<select onchange="changeStatus(${index},this.value)">


<option ${item.status=="รับเรื่องแล้ว"?"selected":""}>
รับเรื่องแล้ว
</option>


<option ${item.status=="กำลังดำเนินการ"?"selected":""}>
กำลังดำเนินการ
</option>


<option ${item.status=="เสร็จสิ้น"?"selected":""}>
เสร็จสิ้น
</option>



</select>





<label>

ผลการดำเนินงาน

</label>



<textarea

onchange="saveResult(${index},this.value)"

rows="3">

${item.result||""}

</textarea>





<button class="delete"

onclick="deleteComplaint(${index})">

ลบรายการ

</button>




</div>


`;



});



document.getElementById("list")
.innerHTML=html;



}








function changeStatus(index,value){



complaints[index].status=value;



save();



}





function saveResult(index,value){


complaints[index].result=value;


save();



}





function deleteComplaint(index){


complaints.splice(index,1);


save();



}






function save(){


localStorage.setItem(

"complaints",

JSON.stringify(complaints)

);



showComplaint();


}



</script>






</body>

</html>
