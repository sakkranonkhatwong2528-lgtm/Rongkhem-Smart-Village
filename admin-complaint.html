<!DOCTYPE html>

<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Admin Complaint | บ้านร่องเข็ม
</title>


<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="css/admin-complaint.css">


</head>


<body>


<header class="complaint-admin-header">


<h1>
📋 ศูนย์จัดการเรื่องร้องเรียน
</h1>


<p>
บ้านร่องเข็ม Smart Village
</p>


</header>





<section class="summary">


<div class="summary-card">

<h3>
📌 ทั้งหมด
</h3>

<h1 id="total">
0
</h1>

</div>




<div class="summary-card">

<h3>
⏳ รอดำเนินการ
</h3>

<h1 id="pending">
0
</h1>

</div>





<div class="summary-card">

<h3>
🔄 กำลังแก้ไข
</h3>

<h1 id="process">
0
</h1>

</div>





<div class="summary-card">

<h3>
✅ เสร็จแล้ว
</h3>

<h1 id="done">
0
</h1>

</div>


</section>






<section class="complaint-table">


<h2>
📋 รายการปัญหา
</h2>


<table>


<thead>

<tr>

<th>
ปัญหา
</th>

<th>
ประเภท
</th>

<th>
สถานะ
</th>

<th>
จัดการ
</th>

</tr>

</thead>


<tbody id="complaintData">


</tbody>


</table>


</section>







<script src="js/admin-complaint.js"></script>
