<!DOCTYPE html>
<html lang="th">


<head>


<meta charset="UTF-8">


<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
Rongkhem AI Assistant
</title>


<link rel="stylesheet"
href="assets/css/dashboard.css">


<style>


.ai-box{


background:white;

max-width:700px;

margin:auto;

padding:25px;

border-radius:20px;

box-shadow:

0 5px 15px rgba(0,0,0,.1);


}



.chat-box{


height:400px;

overflow:auto;

background:#f5f5f5;

padding:15px;

border-radius:15px;

margin-bottom:15px;


}



.message{


padding:10px;

margin-bottom:10px;

border-radius:10px;


}



.user{


background:#c8e6c9;

text-align:right;

}



.bot{


background:white;

border:1px solid #ddd;

}



.input-area{


display:flex;

gap:10px;


}



input{


flex:1;

padding:12px;

border-radius:10px;

border:1px solid #ddd;


}



button{


background:#2e7d32;

color:white;

border:none;

padding:12px 20px;

border-radius:10px;

cursor:pointer;


}


</style>


</head>



<body>



<div class="dashboard-container">


<header class="dashboard-header">


<div>

<h1>

🤖 Rongkhem AI Assistant

</h1>


<p>

ผู้ช่วยข้อมูลบ้านร่องเข็ม Smart Village

</p>


</div>


</header>





<section class="section">


<div class="ai-box">



<div id="chat"

class="chat-box">


<div class="message bot">

สวัสดีครับ ผมคือผู้ช่วย AI บ้านร่องเข็ม

ถามข้อมูลหมู่บ้านได้เลยครับ

</div>


</div>




<div class="input-area">


<input

id="question"

placeholder="พิมพ์คำถาม...">


<button onclick="askAI()">

ถาม

</button>


</div>



</div>


</section>


</div>






<script src="assets/js/ai.js"></script>



</body>


</html>
