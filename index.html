<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
บ้านร่องเข็ม Smart Village
</title>


<style>

body{
font-family:"Sarabun",sans-serif;
margin:0;
background:#f1f8e9;
}


header{

background:#2e7d32;
color:white;
padding:30px;
text-align:center;

}


.hero{

padding:30px;
text-align:center;

background:white;

}


.container{

padding:20px;

}


.card{

background:white;
padding:20px;
margin-bottom:20px;
border-radius:15px;
box-shadow:0 2px 8px #ccc;

}


.grid{

display:grid;
grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));
gap:15px;

}


img{

width:100%;
border-radius:10px;

}


button{

background:#1565c0;
color:white;
padding:10px 20px;
border:0;
border-radius:10px;

}


</style>


</head>


<body>


<header>

<h1>
🏡 บ้านร่องเข็ม Smart Village
</h1>

<h3>
หมู่ที่ 6 ตำบลจำป่าหวาย
อำเภอเมือง จังหวัดพะเยา
</h3>

<p>
ชุมชนเข้มแข็ง บริหารจัดการด้วยเทคโนโลยี
</p>

</header>



<div class="hero">

<h2>
🌱 แหล่งซับน้ำจำ
</h2>

<p>

พื้นที่อนุรักษ์น้ำ
ระบบนิเวศชุมชน
และแหล่งเรียนรู้ธรรมชาติ

</p>

</div>




<div class="container">


<div class="card">

<h2>
📰 ข่าวประชาสัมพันธ์
</h2>

<div id="news">

</div>

</div>




<div class="card">

<h2>
📸 กิจกรรมหมู่บ้าน
</h2>

<div class="grid" id="gallery">

</div>

</div>




<div class="card">

<h2>
👤 ทำเนียบผู้นำ
</h2>

<div class="grid" id="leaders">

</div>

</div>




<div class="card">

<h2>
🔐 ระบบผู้ดูแล
</h2>

<a href="login.html">

<button>
เข้าสู่ระบบ Admin
</button>

</a>


</div>


</div>





<script>


// ข่าว

let news=

JSON.parse(localStorage.getItem("news")||"[]");


let newsBox=document.getElementById("news");


news.slice(-5).reverse().forEach(n=>{


newsBox.innerHTML +=`

<h3>
📌 ${n.title}
</h3>

<p>
${n.detail}
</p>

<hr>

`;

});




// รูปภาพ

let gallery=

JSON.parse(localStorage.getItem("gallery")||"[]");


let galleryBox=document.getElementById("gallery");


gallery.forEach(g=>{


galleryBox.innerHTML +=`

<div>

<img src="images/activity/${g.image}">

<p>
${g.name}
</p>

</div>

`;

});




// ผู้นำ

let leaders=

JSON.parse(localStorage.getItem("leaders")||"[]");


let leaderBox=document.getElementById("leaders");


leaders.forEach(l=>{


leaderBox.innerHTML +=`

<div>

<img src="images/leaders/${l.image}">

<h3>
${l.name}
</h3>

<p>
${l.position}
</p>

</div>

`;

});


</script>


</body>

</html>
