<!DOCTYPE html>

<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
Admin ข่าวสาร | บ้านร่องเข็ม
</title>


<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="css/admin-news.css">


</head>


<body>


<header class="admin-news-header">


<h1>
📢 จัดการข่าวสารหมู่บ้าน
</h1>


<p>
บ้านร่องเข็ม Smart Village
</p>


</header>







<section class="form-box">


<h2>
➕ เพิ่มข่าวประชาสัมพันธ์
</h2>


<input id="title"
placeholder="หัวข้อข่าว">


<textarea id="detail"
placeholder="รายละเอียดข่าว"></textarea>



<select id="type">

<option>
ประกาศหมู่บ้าน
</option>

<option>
กิจกรรมชุมชน
</option>

<option>
สิ่งแวดล้อม
</option>

<option>
โครงการพัฒนา
</option>

<option>
แจ้งเตือนภัย
</option>

</select>



<input id="date"
placeholder="วันที่ประกาศ">



<button onclick="addNews()">

บันทึกข่าว

</button>


</section>







<section class="table-box">


<h2>
📋 รายการข่าว
</h2>


<table>


<thead>

<tr>

<th>
หัวข้อ
</th>

<th>
ประเภท
</th>

<th>
วันที่
</th>

<th>
จัดการ
</th>

</tr>

</thead>


<tbody id="newsTable">


</tbody>


</table>


</section>








<script src="js/admin-news.js"></script>


</body>

</html>
