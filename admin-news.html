<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการข่าวสาร - ผู้ดูแลระบบ | ร่องเข็ม สมาร์ท วิลเลจ</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Sarabun) -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- 1. TOP HEADER -->
    <div id="header-container"></div>

    <!-- 2. MAIN CONTAINER -->
    <div class="flex flex-1 max-w-7xl w-full mx-auto">
        
        <!-- SIDEBAR -->
        <div id="sidebar-container" class="hidden md:block"></div>

        <!-- MAIN CONTENT -->
        <main class="flex-1 p-4 sm:p-6 lg:p-8 space-y-6">
            
            <!-- Header ประจำหน้า Admin -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between bg-slate-900/80 p-5 rounded-2xl border border-slate-800 shadow-xl gap-4 backdrop-blur-md">
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold text-amber-400 flex items-center gap-2">
                        <span>📰</span> ระบบจัดการข่าวสารประชาสัมพันธ์
                    </h1>
                    <p class="text-xs text-gray-400">สำหรับผู้ใหญ่บ้านและคณะกรรมการ บ้านร่องเข็ม หมู่ที่ 6</p>
                </div>
                <div class="flex items-center gap-2">
                    <a href="dashboard.html" class="px-3.5 py-1.5 text-xs bg-slate-800 hover:bg-slate-700 text-gray-300 font-medium rounded-xl border border-slate-700 transition">
                        📊 ดูหน้า Dashboard
                    </a>
                </div>
            </div>

            <!-- ฟอร์มเพิ่มข่าวสารใหม่ -->
            <div class="bg-slate-900/80 p-6 rounded-2xl border border-slate-800 shadow-xl space-y-4">
                <h2 class="text-base font-bold text-white flex items-center gap-2 border-b border-slate-800 pb-3">
                    <span>➕</span> เพิ่มข่าวสาร / ประกาศใหม่
                </h2>

                <form id="addNewsForm" onsubmit="handleAddNews(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-gray-300 mb-1">หัวข้อข่าว / ประกาศ <span class="text-rose-400">*</span></label>
                        <input type="text" id="newsTitle" required placeholder="เช่น ประชุมประจำเดือนบ้านร่องเข็ม..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-amber-500 transition">
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-gray-300 mb-1">รายละเอียดข่าวสาร <span class="text-rose-400">*</span></label>
                        <textarea id="newsDetail" rows="3" required placeholder="ใส่รายละเอียดเนื้อหาข่าวสารที่ต้องการแจ้งลูกบ้าน..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-amber-500 transition"></textarea>
                    </div>

                    <div class="flex justify-end gap-2">
                        <button type="reset" class="px-4 py-2 text-xs bg-slate-800 hover:bg-slate-700 text-gray-300 font-medium rounded-xl transition">
                            ล้างข้อมูล
                        </button>
                        <button type="submit" class="px-5 py-2 text-xs bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl shadow-lg shadow-amber-500/20 transition active:scale-95">
                            📢 โพสต์ประกาศข่าว
                        </button>
                    </div>
                </form>
            </div>

            <!-- รายการข่าวสารทั้งหมดในระบบ -->
            <div class="bg-slate-900/80 p-6 rounded-2xl border border-slate-800 shadow-xl space-y-4">
                <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                    <h2 class="text-base font-bold text-white flex items-center gap-2">
                        <span>📋</span> รายการข่าวสารทั้งหมด
                    </h2>
                    <span id="newsCountBadge" class="px-3 py-1 bg-amber-500/10 text-amber-400 text-xs font-bold rounded-full border border-amber-500/20">
                        0 ข่าว
                    </span>
                </div>

                <div id="adminNewsList" class="space-y-3">
                    <!-- แสดงรายการข่าวผ่าน JS -->
                </div>
            </div>

        </main>
    </div>

    <!-- 3. FOOTER -->
    <div id="footer-container"></div>

    <!-- JavaScript ระบบจัดการข่าว -->
    <script>
        // ข้อมูลเริ่มต้นตัวอย่าง
        const initialNews = [
            { title: "ประชุมประจำเดือนบ้านร่องเข็ม", detail: "แจ้งข่าวสารและแนวทางพัฒนาหมู่บ้าน" },
            { title: "โครงการหมู่บ้านอัจฉริยะ", detail: "พัฒนาระบบข้อมูลชุมชนด้วยเทคโนโลยี" },
            { title: "ประชาสัมพันธ์กิจกรรมชุมชน", detail: "ติดตามกิจกรรมบ้านร่องเข็ม" }
        ];

        // ดึงข่าวสารจาก LocalStorage หรือใช้อาร์เรย์เริ่มต้น
        function getNewsData() {
            const stored = localStorage.getItem('rongkhem_news_list');
            if (!stored) {
                localStorage.setItem('rongkhem_news_list', JSON.stringify(initialNews));
                return initialNews;
            }
            return JSON.parse(stored);
        }

        function saveNewsData(data) {
            localStorage.setItem('rongkhem_news_list', JSON.stringify(data));
            renderAdminNewsList();
        }

        // เพิ่มข่าวสารใหม่
        function handleAddNews(event) {
            event.preventDefault();
            const titleInput = document.getElementById('newsTitle');
            const detailInput = document.getElementById('newsDetail');

            const title = titleInput.value.trim();
            const detail = detailInput.value.trim();

            if (!title || !detail) return;

            const currentNews = getNewsData();
            currentNews.unshift({ title, detail }); // เพิ่มไว้บนสุด
            saveNewsData(currentNews);

            titleInput.value = '';
            detailInput.value = '';
            alert('เพิ่มประกาศข่าวเรียบร้อยแล้ว!');
        }

        // ลบข่าวสาร
        function deleteNews(index) {
            if (confirm('คุณแน่ใจหรือไม่ว่าต้องการลบข่าวสารนี้?')) {
                const currentNews = getNewsData();
                currentNews.splice(index, 1);
                saveNewsData(currentNews);
            }
        }

        // แสดงผลรายการข่าวสารในหน้าผู้ดูแล
        function renderAdminNewsList() {
            const newsList = getNewsData();
            const container = document.getElementById('adminNewsList');
            const badge = document.getElementById('newsCountBadge');

            badge.innerText = `${newsList.length} ข่าว`;

            if (newsList.length === 0) {
                container.innerHTML = `<div class="text-center py-6 text-gray-500 text-xs">ไม่มีรายการข่าวสารในขณะนี้</div>`;
                return;
            }

            container.innerHTML = newsList.map((item, index) => `
                <div class="p-4 bg-slate-950/60 rounded-xl border border-slate-800 flex flex-col sm:flex-row sm:items-center justify-between gap-3 hover:border-slate-700 transition">
                    <div class="space-y-1">
                        <h3 class="font-bold text-sm text-amber-400">${item.title}</h3>
                        <p class="text-xs text-gray-300 leading-relaxed">${item.detail}</p>
                    </div>
                    <div class="flex items-center gap-2 self-end sm:self-center shrink-0">
                        <button onclick="deleteNews(${index})" class="px-3 py-1.5 text-xs bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 rounded-lg border border-rose-500/30 transition">
                            🗑️ ลบข่าว
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // โหลดส่วนประกอบ Header, Sidebar, Footer และข้อมูลข่าว
        document.addEventListener("DOMContentLoaded", function() {
            fetch("components/header.html").then(res => res.text()).then(data => document.getElementById("header-container").innerHTML = data);
            fetch("components/sidebar.html").then(res => res.text()).then(data => document.getElementById("sidebar-container").innerHTML = data);
            fetch("components/footer.html").then(res => res.text()).then(data => document.getElementById("footer-container").innerHTML = data);

            renderAdminNewsList();
        });
    </script>
</body>
</html>
