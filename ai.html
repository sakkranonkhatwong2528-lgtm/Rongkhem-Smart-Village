<!DOCTYPE html>

<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
AI ผู้ช่วยหมู่บ้าน | บ้านร่องเข็ม
</title>


<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="css/ai.css">


</head>


<body>


<header class="ai-header">


<h1>
🤖 AI ผู้ช่วยหมู่บ้าน
</h1>


<p>
Rongkhem Smart Village Assistant
</p>


</header>





<section class="ai-box">


<h2>
ถามข้อมูลหมู่บ้าน
</h2>



<input 
id="question"
placeholder="พิมพ์คำถาม เช่น จำนวนผู้สูงอายุ..."
>



<button onclick="askAI()">

ส่งคำถาม

</button>



</section>







<section class="answer-box">


<h2>
📌 คำตอบ
</h2>


<div id="answer">

พร้อมให้บริการ...

</div>


</section>







<section class="shortcut">


<h2>
เมนูช่วยเหลือ
</h2>


<button onclick="quick('รายงานหมู่บ้าน')">
📄 รายงานหมู่บ้าน
</button>


<button onclick="quick('ประชากร')">
👥 ข้อมูลประชากร
</button>


<button onclick="quick('โครงการ')">
📌 โครงการพัฒนา
</button>



</section>







<script src="js/ai.js"></script>


</body>

</html>
