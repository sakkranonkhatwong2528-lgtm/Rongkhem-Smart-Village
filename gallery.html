<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
คลังภาพกิจกรรม | บ้านร่องเข็ม Smart Village
</title>


<style>


body{

margin:0;
font-family:Tahoma,sans-serif;
background:#f3e5f5;

}



header{

background:#6a1b9a;
color:white;
padding:35px;
text-align:center;

}



.container{

padding:20px;

}



.grid{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;

}



.card{

background:white;
padding:20px;
border-radius:25px;
box-shadow:0 4px 12px #ccc;

}



.card img{

width:100%;
height:200px;
object-fit:cover;
border-radius:20px;

}



.title{

font-size:20px;
font-weight:bold;
color:#6a1b9a;

}



.back{

text-align:center;
margin:30px;

}



.back a{

background:#6a1b9a;
color:white;
padding:12px 25px;
border-radius:20px;
text-decoration:none;

}


</style>


</head>


<body>



<header>


<h1>
📸 คลังภาพกิจกรรม
</h1>


<p>
บ้านร่องเข็ม Smart Village
</p>


</header>







<div class="container">


<div class="grid" id="gallery">


</div>


</div>







<div class="back">

<a href="index.html">

🏠 กลับหน้าแรก

</a>

</div>







<script>


let gallery =

JSON.parse(

localStorage.getItem("gallery")

)||[];





function showGallery(){


let html="";



if(gallery.length==0){


html=`

<div class="card">

<h2>
📸 ยังไม่มีรูปภาพ
</h2>

<p>
กำลังจัดเตรียมคลังภาพ

</p>

</div>

`;



}




gallery.forEach(function(item){



html += `


<div class="card">


<img src="images/${item.image}">


<div class="title">

${item.title}

</div>



<p>

${item.detail}

</p>



</div>


`;



});




document.getElementById("gallery")
.innerHTML=html;


}



showGallery();



</script>



</body>

</html>
