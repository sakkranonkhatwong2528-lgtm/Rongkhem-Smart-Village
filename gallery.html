<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
คลังภาพกิจกรรม | บ้านร่องเข็ม Smart Village
</title>


<style>


body{

margin:0;
font-family:Tahoma,sans-serif;
background:#fce4ec;

}



header{

background:#ad1457;
color:white;
padding:35px;
text-align:center;

}



.container{

padding:20px;

}



.gallery{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;

}



.card{

background:white;
padding:20px;
border-radius:20px;
box-shadow:0 4px 12px #ccc;
text-align:center;

}



.card img{

width:100%;
height:200px;
object-fit:cover;
border-radius:15px;

}



.card h2{

color:#ad1457;

}



.category{

background:#ad1457;
color:white;
padding:6px 15px;
border-radius:20px;
display:inline-block;

}



.default{

background:white;
padding:25px;
border-radius:20px;

}



.back{

text-align:center;
margin:30px;

}



.back a{

background:#ad1457;
color:white;
padding:12px 25px;
border-radius:20px;
text-decoration:none;

}



</style>


</head>



<body>




<header>


<h1>
📸 คลังภาพกิจกรรม
</h1>


<p>
บ้านร่องเข็ม Smart Village
</p>


</header>







<div class="container">


<div class="gallery" id="galleryList">


</div>


</div>







<div class="back">

<a href="index.html">

🏠 กลับหน้าแรก

</a>

</div>







<script>


function loadGallery(){


let data=

JSON.parse(
localStorage.getItem("gallery")
)||[];



let html="";





if(data.length==0){


html += `


<div class="default">


<h2>
📷 คลังภาพหมู่บ้าน
</h2>


<p>

กำลังจัดเตรียมภาพกิจกรรม
บ้านร่องเข็ม Smart Village

</p>


<p>

สามารถเพิ่มภาพผ่านระบบผู้ดูแลได้

</p>


</div>


`;



}




data.reverse();



data.forEach(function(item){



let image =
item.image;



if(image==""){

image="logo.svg";

}




html += `


<div class="card">



<img src="images/${image}">



<span class="category">

${item.category}

</span>



<h2>

${item.title}

</h2>



</div>



`;



});




document.getElementById("galleryList")
.innerHTML=html;



}




loadGallery();



</script>





</body>

</html>
