<!DOCTYPE html>

<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
Admin Citizen | บ้านร่องเข็ม
</title>


<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="css/admin-citizen.css">


</head>


<body>


<header class="citizen-admin-header">


<h1>
👥 จัดการทะเบียนประชาชน
</h1>


<p>
บ้านร่องเข็ม Smart Village
</p>


</header>






<section class="citizen-summary">


<div class="summary-card">

<h3>
👥 ประชาชนทั้งหมด
</h3>

<h1 id="total">
0
</h1>

</div>



<div class="summary-card">

<h3>
👨 ชาย
</h3>

<h1 id="male">
0
</h1>

</div>



<div class="summary-card">

<h3>
👩 หญิง
</h3>

<h1 id="female">
0
</h1>

</div>



<div class="summary-card">

<h3>
👴 ผู้สูงอายุ
</h3>

<h1 id="elderly">
0
</h1>

</div>


</section>







<section class="add-box">


<h2>
➕ เพิ่มประชาชน
</h2>


<input id="name"
placeholder="ชื่อ-นามสกุล">


<select id="gender">

<option>
ชาย
</option>

<option>
หญิง
</option>

</select>


<input id="age"
type="number"
placeholder="อายุ">


<input id="house"
placeholder="บ้านเลขที่">


<button onclick="addCitizen()">

บันทึกข้อมูล

</button>


</section>







<section class="table-box">


<h2>
📋 รายชื่อประชาชน
</h2>



<table>


<thead>

<tr>

<th>
ชื่อ
</th>

<th>
เพศ
</th>

<th>
อายุ
</th>

<th>
บ้าน
</th>

<th>
จัดการ
</th>

</tr>


</thead>



<tbody id="citizenTable">


</tbody>



</table>


</section>







<script src="js/admin-citizen.js"></script>


</body>

</html>
