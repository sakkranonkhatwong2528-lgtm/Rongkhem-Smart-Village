<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
จัดการข้อมูลประชาชน | บ้านร่องเข็ม Smart Village
</title>


<style>


body{

margin:0;
font-family:Tahoma,sans-serif;
background:#e3f2fd;

}


header{

background:#0d47a1;
color:white;
padding:30px;
text-align:center;

}


.container{

padding:20px;

}



.card{

background:white;
padding:25px;
border-radius:25px;
box-shadow:0 4px 12px #ccc;
margin-bottom:20px;

}



input,select,textarea{

width:100%;
padding:12px;
margin:10px 0;
border-radius:10px;
border:1px solid #ccc;
box-sizing:border-box;

}



button{

background:#0d47a1;
color:white;
padding:12px 30px;
border:none;
border-radius:20px;

}



.item{

background:#e3f2fd;
padding:15px;
border-radius:15px;
margin-top:15px;

}



.delete{

background:#c62828;
color:white;
border:none;
padding:8px 15px;
border-radius:15px;

}



.back{

text-align:center;
margin:30px;

}


.back a{

background:#0d47a1;
color:white;
padding:12px 25px;
border-radius:20px;
text-decoration:none;

}



</style>


</head>



<body>



<header>


<h1>
👥 จัดการข้อมูลประชาชน
</h1>


<p>
Admin Citizen Database
</p>


</header>







<div class="container">



<div class="card">


<h2>
➕ เพิ่มข้อมูลประชาชน
</h2>




<label>
บ้านเลขที่
</label>

<input 
id="house"
placeholder="เช่น 99/1">






<label>
ชื่อ - นามสกุล
</label>

<input
id="name"
placeholder="ชื่อประชาชน">






<label>
เพศ
</label>


<select id="gender">

<option>
ชาย
</option>

<option>
หญิง
</option>

</select>






<label>
อายุ
</label>


<input
id="age"
type="number"
placeholder="อายุ">






<label>
ประเภทบุคคล
</label>


<select id="group">


<option>
ประชาชนทั่วไป
</option>


<option>
ผู้สูงอายุ
</option>


<option>
ผู้พิการ
</option>


<option>
กลุ่มเปราะบาง
</option>


<option>
ผู้นำชุมชน
</option>


<option>
อสม.
</option>


<option>
ชรบ.
</option>


</select>






<label>
เบอร์ติดต่อ
</label>


<input
id="phone"
placeholder="08xxxxxxxx">






<button onclick="saveCitizen()">

💾 บันทึกข้อมูล

</button>



</div>








<div class="card">


<h2>
📋 รายชื่อประชาชน
</h2>


<div id="list">

</div>


</div>






</div>







<div class="back">


<a href="admin-dashboard.html">

⚙️ กลับ Dashboard

</a>


</div>









<script>


let citizen =

JSON.parse(

localStorage.getItem("citizen")

)||[];





showList();







function saveCitizen(){



let data={


house:

document.getElementById("house").value,


name:

document.getElementById("name").value,


gender:

document.getElementById("gender").value,


age:

document.getElementById("age").value,


group:

document.getElementById("group").value,


phone:

document.getElementById("phone").value


};




citizen.push(data);




localStorage.setItem(

"citizen",

JSON.stringify(citizen)

);



alert("บันทึกข้อมูลประชาชนเรียบร้อย");


showList();


}







function showList(){


let html="";



citizen.forEach(function(item,index){



html+=`

<div class="item">


<h3>
👤 ${item.name}
</h3>


<p>
🏠 บ้านเลขที่ :
${item.house}
</p>


<p>
เพศ :
${item.gender}
</p>


<p>
อายุ :
${item.age}
ปี
</p>


<p>
ประเภท :
${item.group}
</p>


<p>
โทร :
${item.phone}
</p>


<button class="delete"

onclick="deleteCitizen(${index})">

ลบ

</button>


</div>

`;



});



document.getElementById("list")
.innerHTML=html;


}








function deleteCitizen(index){


citizen.splice(index,1);



localStorage.setItem(

"citizen",

JSON.stringify(citizen)

);



showList();


}



</script>





</body>

</html>
