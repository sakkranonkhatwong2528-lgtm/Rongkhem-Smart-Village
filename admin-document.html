<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
จัดการเอกสาร | บ้านร่องเข็ม Smart Village
</title>



<style>


body{

margin:0;
font-family:Tahoma,sans-serif;
background:#fce4ec;

}



header{

background:#6a1b9a;
color:white;
padding:30px;
text-align:center;

}



.container{

padding:20px;

}



.card{

background:white;
padding:25px;
border-radius:25px;
box-shadow:0 4px 12px #ccc;

}



input,textarea,select{

width:100%;
padding:12px;
margin:10px 0;
border-radius:10px;
border:1px solid #ccc;
box-sizing:border-box;

}



button{

background:#6a1b9a;
color:white;
padding:12px 30px;
border:none;
border-radius:20px;

}



.item{

background:#f3e5f5;
padding:15px;
margin-top:15px;
border-radius:15px;

}



.delete{

background:#c62828;
color:white;
border:none;
padding:8px 15px;
border-radius:15px;

}



.back{

text-align:center;
margin:30px;

}



.back a{

background:#6a1b9a;
color:white;
padding:12px 25px;
border-radius:20px;
text-decoration:none;

}



</style>


</head>



<body>



<header>


<h1>
📂 จัดการเอกสารหมู่บ้าน
</h1>


<p>
Admin บ้านร่องเข็ม Smart Village
</p>


</header>






<div class="container">



<div class="card">


<h2>
➕ เพิ่มเอกสาร
</h2>




<label>
ประเภทเอกสาร
</label>


<select id="type">


<option>
คำสั่งหมู่บ้าน
</option>


<option>
ประกาศหมู่บ้าน
</option>


<option>
รายงานประชุม
</option>


<option>
แบบฟอร์ม
</option>


<option>
รายงานโครงการ
</option>


</select>






<label>
ชื่อเอกสาร
</label>


<input
id="title"
placeholder="เช่น คำสั่งแต่งตั้งคณะกรรมการ">





<label>
รายละเอียด
</label>


<textarea

id="detail"

rows="4"

placeholder="รายละเอียดเอกสาร">

</textarea>





<label>
ชื่อไฟล์ PDF
</label>


<input

id="file"

placeholder="เช่น order.pdf">




<button onclick="saveDocument()">

💾 บันทึกเอกสาร

</button>



</div>








<div class="card">


<h2>
📋 รายการเอกสาร
</h2>


<div id="list">

</div>


</div>





</div>







<div class="back">


<a href="admin-dashboard.html">

⚙️ กลับ Dashboard

</a>


</div>









<script>



let docs =

JSON.parse(

localStorage.getItem("documents")

)||[];




showList();





function saveDocument(){



let data={


type:

document.getElementById("type").value,


title:

document.getElementById("title").value,


detail:

document.getElementById("detail").value,


file:

document.getElementById("file").value


};




docs.push(data);




localStorage.setItem(

"documents",

JSON.stringify(docs)

);



alert("เพิ่มเอกสารเรียบร้อย");


showList();



}







function showList(){



let html="";




docs.forEach(function(item,index){



html+=`

<div class="item">


<b>
${item.title}
</b>


<br>


ประเภท :
${item.type}


<br>


ไฟล์ :
${item.file}


<br><br>


<button class="delete"

onclick="deleteDoc(${index})">

ลบ

</button>



</div>


`;



});



document.getElementById("list")
.innerHTML=html;


}





function deleteDoc(index){



docs.splice(index,1);



localStorage.setItem(

"documents",

JSON.stringify(docs)

);



showList();


}



</script>






</body>

</html>
