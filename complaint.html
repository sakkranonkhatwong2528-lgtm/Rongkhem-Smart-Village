<!DOCTYPE html>

<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
ร้องเรียนออนไลน์ บ้านร่องเข็ม
</title>


<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="css/complaint.css">


</head>


<body>


<header class="complaint-header">


<h1>
📢 ร้องเรียนออนไลน์
</h1>


<p>
บ้านร่องเข็ม Smart Village
</p>


</header>





<section class="form-box">


<h2>
แจ้งปัญหาชุมชน
</h2>


<input id="name"
placeholder="ชื่อผู้แจ้ง">


<input id="title"
placeholder="หัวข้อปัญหา">


<select id="type">


<option>
สิ่งแวดล้อม
</option>


<option>
ถนน
</option>


<option>
ความปลอดภัย
</option>


<option>
อื่นๆ
</option>


</select>



<textarea id="detail"
placeholder="รายละเอียดปัญหา">
</textarea>



<button onclick="sendComplaint()">

ส่งเรื่องร้องเรียน

</button>



</section>






<section>


<h2>
📋 รายการร้องเรียน
</h2>


<div id="complaintList">

กำลังโหลด...

</div>


</section>






<script src="js/complaint.js"></script>


</body>

</html>
