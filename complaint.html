<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
แจ้งปัญหาชุมชน | บ้านร่องเข็ม Smart Village
</title>


<style>

body{

margin:0;
font-family:Tahoma,sans-serif;
background:#fff3e0;

}


header{

background:#e65100;
color:white;
padding:30px;
text-align:center;

}


.container{

padding:20px;

}


.card{

background:white;
padding:25px;
border-radius:20px;
box-shadow:0 4px 12px #ccc;

}


input,textarea,select{

width:100%;
padding:12px;
margin:10px 0;
border-radius:10px;
border:1px solid #ccc;
box-sizing:border-box;

}


button{

background:#e65100;
color:white;
border:none;
padding:12px 30px;
border-radius:20px;

}


.back{

text-align:center;
margin:30px;

}


.back a{

background:#e65100;
color:white;
padding:12px 25px;
border-radius:20px;
text-decoration:none;

}

</style>


</head>



<body>



<header>

<h1>
📝 แจ้งปัญหาชุมชน
</h1>

<p>
บ้านร่องเข็ม Smart Village
</p>

</header>





<div class="container">


<div class="card">


<h2>
📢 ส่งเรื่องแจ้งปัญหา
</h2>



<input
id="name"
placeholder="ชื่อผู้แจ้ง">



<select id="type">


<option>
เลือกประเภทปัญหา
</option>


<option>
🛣 ถนน
</option>


<option>
💡 ไฟฟ้า
</option>


<option>
🚰 น้ำประปา
</option>


<option>
🗑 ขยะ
</option>


<option>
🔥 ไฟป่า PM2.5
</option>


<option>
อื่น ๆ
</option>


</select>




<textarea
id="detail"
rows="6"
placeholder="รายละเอียดปัญหา">
</textarea>



<button onclick="sendComplaint()">

📨 ส่งเรื่อง

</button>


</div>


</div>




<div class="back">

<a href="index.html">

🏠 กลับหน้าแรก

</a>

</div>






<script>


function sendComplaint(){



let data={


name:
document.getElementById("name").value,


type:
document.getElementById("type").value,


detail:
document.getElementById("detail").value,


status:
"รับเรื่องแล้ว"


};



if(data.detail==""){


alert("กรุณาระบุปัญหา");


return;

}



let complaint=

JSON.parse(
localStorage.getItem("complaint")
) || [];



complaint.push(data);



localStorage.setItem(
"complaint",
JSON.stringify(complaint)
);



alert("ส่งเรื่องเรียบร้อย");


location.reload();



}


</script>



</body>

</html>
