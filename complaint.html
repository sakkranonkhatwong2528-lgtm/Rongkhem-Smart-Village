<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
แจ้งปัญหาชุมชน | บ้านร่องเข็ม
</title>


<link rel="stylesheet" href="assets/css/dashboard.css">


<style>


.form-box{

background:white;

padding:25px;

max-width:600px;

margin:auto;

border-radius:20px;

box-shadow:0 5px 15px rgba(0,0,0,.1);

}


input,textarea,select{


width:100%;

padding:12px;

margin-bottom:15px;

border-radius:10px;

border:1px solid #ddd;

}



textarea{

height:120px;

}



button{


background:#2e7d32;

color:white;

border:none;

padding:12px 25px;

border-radius:10px;

cursor:pointer;

}


</style>


</head>



<body>


<div class="dashboard-container">



<header class="dashboard-header">


<div>


<h1>

📢 แจ้งปัญหาชุมชน

</h1>


<p>

บ้านร่องเข็ม Smart Village

</p>


</div>


</header>






<section class="section">


<div class="form-box">



<input 
id="name"

placeholder="ชื่อผู้แจ้ง">



<select id="type">


<option>
ถนน
</option>

<option>
ไฟฟ้า
</option>

<option>
น้ำประปา
</option>

<option>
ฝุ่น PM2.5
</option>

<option>
การเผา
</option>

<option>
ขยะ
</option>


</select>




<textarea

id="detail"

placeholder="รายละเอียดปัญหา">

</textarea>




<button onclick="sendComplaint()">

ส่งเรื่องร้องเรียน

</button>



</div>


</section>



</div>







<script>


function sendComplaint(){


let complaint={


id:Date.now(),


name:

document.getElementById("name").value,


type:

document.getElementById("type").value,


detail:

document.getElementById("detail").value,


date:

new Date().toISOString().slice(0,10),


status:"รอดำเนินการ"



};



localStorage.setItem(

"complaint",

JSON.stringify(complaint)

);



alert(

"ส่งเรื่องร้องเรียนเรียบร้อย"

);



}



</script>


</body>

</html>
