<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
แจ้งปัญหาชุมชน | บ้านร่องเข็ม Smart Village
</title>


<style>

body{

margin:0;
font-family:Tahoma,sans-serif;
background:#fffde7;

}


header{

background:#f57f17;
color:white;
padding:35px;
text-align:center;

}



.container{

padding:20px;

}



.card{

background:white;
padding:25px;
border-radius:25px;
box-shadow:0 4px 12px #ccc;

}



input,textarea,select{

width:100%;
padding:12px;
margin:10px 0;
border-radius:10px;
border:1px solid #ccc;
box-sizing:border-box;

}



button{

background:#f57f17;
color:white;
padding:12px 30px;
border:none;
border-radius:20px;

}



.result{

background:#fff8e1;
padding:20px;
margin-top:20px;
border-radius:20px;

}



.back{

text-align:center;
margin:30px;

}



.back a{

background:#f57f17;
color:white;
padding:12px 25px;
border-radius:20px;
text-decoration:none;

}


</style>


</head>



<body>



<header>

<h1>
📝 แจ้งปัญหาชุมชน
</h1>

<p>
บ้านร่องเข็ม Smart Village
</p>

</header>







<div class="container">


<div class="card">



<h2>
📢 ส่งเรื่องร้องเรียน
</h2>



<label>
ประเภทปัญหา
</label>


<select id="type">

<option>
ถนน
</option>

<option>
ไฟฟ้า
</option>

<option>
น้ำประปา
</option>

<option>
ขยะ
</option>

<option>
สิ่งแวดล้อม
</option>

<option>
อื่น ๆ
</option>


</select>





<label>
รายละเอียดปัญหา
</label>


<textarea

id="detail"

rows="5"

placeholder="อธิบายปัญหา">

</textarea>





<label>
สถานที่เกิดเหตุ
</label>


<input

id="location"

placeholder="เช่น บ้านเลขที่ / จุดเกิดเหตุ">




<button onclick="sendComplaint()">

📨 ส่งเรื่อง

</button>





<div class="result" id="show">

</div>



</div>


</div>








<div class="back">


<a href="index.html">

🏠 กลับหน้าแรก

</a>


</div>








<script>



let complaints =

JSON.parse(

localStorage.getItem("complaints")

)||[];





function sendComplaint(){



let data={


type:

document.getElementById("type").value,


detail:

document.getElementById("detail").value,


location:

document.getElementById("location").value,


status:

"รับเรื่องแล้ว"


};




complaints.push(data);



localStorage.setItem(

"complaints",

JSON.stringify(complaints)

);




alert("ส่งเรื่องเรียบร้อย");



show();


}






function show(){



let data=

JSON.parse(

localStorage.getItem("complaints")

)||[];



let html="";



data.forEach(function(item){


html +=`

<p>

📌 ${item.type}

<br>

${item.detail}

<br>

สถานะ :
${item.status}

</p>

<hr>

`;



});



document.getElementById("show")
.innerHTML=html;



}



show();



</script>






</body>

</html>
