<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>โครงสร้างผู้นำ | Rongkhem Smart Village</title>

<style>

body{
margin:0;
font-family:Tahoma,Arial;
background:#f1f8e9;
}

header{
background:#2e7d32;
color:white;
text-align:center;
padding:25px;
}

.container{
padding:20px;
max-width:1000px;
margin:auto;
}

.card{
background:white;
padding:20px;
border-radius:15px;
margin-bottom:20px;
box-shadow:0 3px 10px #ccc;
}

.profile{
display:flex;
align-items:center;
gap:20px;
flex-wrap:wrap;
}

.profile img{
width:150px;
height:150px;
border-radius:50%;
object-fit:cover;
border:5px solid #2e7d32;
}

.name{
font-size:25px;
font-weight:bold;
color:#1b5e20;
}

.position{
font-size:18px;
}

input,select,textarea{

width:100%;
padding:12px;
margin:8px 0;
border-radius:10px;
border:1px solid #ccc;

}

button{

background:#2e7d32;
color:white;
padding:15px;
border:0;
border-radius:10px;
width:100%;
font-size:18px;

}

.member{

background:#e8f5e9;
padding:15px;
border-radius:15px;
margin-top:15px;

}

.back{

display:block;
background:#388e3c;
color:white;
text-align:center;
padding:12px;
border-radius:10px;
text-decoration:none;

}

</style>

</head>


<body>


<header>

<h1>🏛️ โครงสร้างผู้นำหมู่บ้าน</h1>

<h2>Rongkhem Smart Village</h2>

<p>บ้านร่องเข็ม หมู่ที่ 6 จังหวัดพะเยา</p>

</header>



<div class="container">


<div class="card">

<h2>➕ เพิ่มบุคคล</h2>


<input id="name" placeholder="ชื่อ - นามสกุล">


<input id="position" placeholder="ตำแหน่ง">


<select id="group">

<option>ผู้นำหมู่บ้าน</option>
<option>คณะกรรมการหมู่บ้าน</option>
<option>อสม.</option>
<option>ชรบ.</option>
<option>อปพร.</option>
<option>กลุ่มแม่บ้าน</option>
<option>ผู้สูงอายุ</option>

</select>


<input id="image" placeholder="ที่อยู่รูปภาพ เช่น ../images/person.jpg">


<textarea id="duty"
placeholder="หน้าที่รับผิดชอบ"></textarea>



<button onclick="addPerson()">
💾 บันทึกข้อมูล
</button>


</div>



<div class="card">

<h2>👥 รายชื่อผู้นำและองค์กร</h2>

<div id="list"></div>

</div>



<a class="back" href="dashboard.html">
⬅ กลับ Dashboard
</a>


</div>




<script>


let persons =
JSON.parse(localStorage.getItem("persons")) || [];



function show(){

let html="";


persons.forEach((p,index)=>{


html += `

<div class="member">

<div class="profile">


<img src="${p.image}"
onerror="this.src='../images/default.png'">


<div>

<div class="name">
${p.name}
</div>


<div class="position">
🏛️ ${p.group}<br>
📌 ${p.position}<br>
📝 ${p.duty}
</div>


</div>


</div>


<button onclick="deletePerson(${index})">
🗑️ ลบ
</button>


</div>

`;

});


document.getElementById("list").innerHTML=html;


}



function addPerson(){


let data={

name:name.value,

position:position.value,

group:group.value,

image:image.value,

duty:duty.value

};


persons.push(data);


localStorage.setItem(
"persons",
JSON.stringify(persons)
);



alert("เพิ่มข้อมูลเรียบร้อย");


show();


}




function deletePerson(i){

persons.splice(i,1);

localStorage.setItem(
"persons",
JSON.stringify(persons)
);

show();

}


show();


</script>


</body>

</html>
