<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
องค์กรชุมชน | บ้านร่องเข็ม Smart Village
</title>


<style>

body{

margin:0;
font-family:Tahoma,sans-serif;
background:#fff8e1;

}


header{

background:#795548;
color:white;
padding:35px;
text-align:center;

}


.container{

padding:20px;

}


.grid{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;

}



.card{

background:white;
padding:25px;
border-radius:25px;
box-shadow:0 4px 12px #ccc;

}



.icon{

font-size:45px;

}



.title{

color:#795548;
font-size:22px;
font-weight:bold;

}



.back{

text-align:center;
margin:30px;

}



.back a{

background:#795548;
color:white;
padding:12px 25px;
border-radius:20px;
text-decoration:none;

}

</style>


</head>


<body>



<header>

<h1>
👥 องค์กรและคณะทำงานหมู่บ้าน
</h1>


<p>
บ้านร่องเข็ม Smart Village
</p>


</header>







<div class="container">


<div class="grid" id="orgList">

</div>


</div>







<div class="back">

<a href="index.html">

🏠 กลับหน้าแรก

</a>

</div>







<script>


let org =

JSON.parse(

localStorage.getItem("organization")

)||[];





function showOrg(){


let html="";



if(org.length==0){


html=`

<div class="card">

<h2>
ยังไม่มีข้อมูล
</h2>

<p>
กำลังจัดเตรียมข้อมูลคณะทำงาน

</p>

</div>

`;



}



org.forEach(function(item){



html +=`

<div class="card">


<div class="icon">

${item.icon}

</div>


<div class="title">

${item.name}

</div>



<p>

ตำแหน่ง :
${item.position}

</p>



<p>

หน้าที่ :
${item.duty}

</p>


</div>

`;



});



document.getElementById("orgList")
.innerHTML=html;



}



showOrg();



</script>




</body>

</html>
