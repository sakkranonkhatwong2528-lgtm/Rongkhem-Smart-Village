<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>โครงสร้างผู้นำหมู่บ้าน | Rongkhem Smart Village</title>

<style>

body{
margin:0;
font-family:Tahoma,Arial,sans-serif;
background:#f1f8e9;
}


header{
background:linear-gradient(135deg,#1b5e20,#66bb6a);
color:white;
text-align:center;
padding:30px;
}


.container{
max-width:1100px;
margin:auto;
padding:20px;
}


.card{

background:white;
padding:25px;
border-radius:20px;
margin-bottom:20px;
box-shadow:0 4px 15px #ccc;

}


input,select,textarea{

width:100%;
padding:12px;
margin:8px 0;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;

}


button{

background:#2e7d32;
color:white;
border:0;
padding:12px;
border-radius:10px;
cursor:pointer;
font-size:16px;

}


.save{

width:100%;
font-size:18px;

}


.profile{

display:flex;
align-items:center;
gap:20px;
flex-wrap:wrap;

background:#e8f5e9;
padding:20px;
border-radius:15px;

}


.profile img{

width:150px;
height:150px;
border-radius:50%;
object-fit:cover;
border:5px solid white;

}


.name{

font-size:25px;
font-weight:bold;
color:#1b5e20;

}


.group{

color:#388e3c;
font-size:18px;

}


.member{

background:#fafafa;
padding:15px;
border-radius:15px;
margin-bottom:15px;

}


.delete{

background:#c62828;
margin-top:10px;

}


.back{

display:block;
text-align:center;
background:#388e3c;
color:white;
padding:15px;
border-radius:10px;
text-decoration:none;

}


</style>

</head>


<body>


<header>

<h1>🏛️ โครงสร้างผู้นำหมู่บ้าน</h1>

<h2>Rongkhem Smart Village</h2>

<p>
บ้านร่องเข็ม หมู่ที่ 6<br>
ตำบลจำป่าหวาย จังหวัดพะเยา
</p>

</header>



<div class="container">



<div class="card">


<h2>➕ เพิ่มข้อมูลบุคลากร</h2>


<input id="name"
placeholder="ชื่อ - นามสกุล">


<input id="position"
placeholder="ตำแหน่ง">


<select id="group">

<option>ผู้ใหญ่บ้าน</option>

<option>คณะกรรมการหมู่บ้าน</option>

<option>อสม.</option>

<option>ชรบ.</option>

<option>อปพร.</option>

<option>กลุ่มแม่บ้าน</option>

<option>ผู้สูงอายุ</option>

</select>



<textarea id="duty"
placeholder="หน้าที่รับผิดชอบ">
</textarea>



<label>
📷 เลือกรูปภาพ
</label>


<input type="file"
id="photo"
accept="image/*">



<button class="save"
onclick="addPerson()">

💾 บันทึกข้อมูล

</button>



</div>




<div class="card">


<h2>
👥 รายชื่อโครงสร้างหมู่บ้าน
</h2>


<div id="list"></div>


</div>



<a class="back"
href="dashboard.html">

⬅ กลับ Dashboard

</a>



</div>




<script>


let persons =
JSON.parse(localStorage.getItem("organization"))
|| [];



function showData(){


let html="";


persons.forEach((p,index)=>{


html +=`

<div class="member">


<div class="profile">


<img src="${p.image}">


<div>

<div class="name">
${p.name}
</div>


<div class="group">
🏛️ ${p.group}
</div>


<p>
📌 ${p.position}
</p>


<p>
📝 ${p.duty}
</p>


</div>


</div>



<button class="delete"
onclick="removeData(${index})">

🗑️ ลบข้อมูล

</button>


</div>


`;

});


document.getElementById("list").innerHTML=html;


}





function addPerson(){


let file =
document.getElementById("photo").files[0];


if(!file){

alert("กรุณาเลือกรูปภาพ");

return;

}



let reader=new FileReader();



reader.onload=function(e){


let person={


name:
document.getElementById("name").value,


position:
document.getElementById("position").value,


group:
document.getElementById("group").value,


duty:
document.getElementById("duty").value,


image:
e.target.result


};



persons.push(person);



localStorage.setItem(
"organization",
JSON.stringify(persons)
);



alert("✅ บันทึกเรียบร้อย");


location.reload();


};



reader.readAsDataURL(file);



}





function removeData(index){


if(confirm("ต้องการลบข้อมูลนี้หรือไม่?")){


persons.splice(index,1);


localStorage.setItem(
"organization",
JSON.stringify(persons)
);


showData();


}


}



showData();


</script>


</body>

</html>
