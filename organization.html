<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<title>จัดการโครงสร้างชุมชน</title>

<style>

body{
font-family:Tahoma;
background:#f1f8e9;
margin:0;
}

header{
background:#2e7d32;
color:white;
text-align:center;
padding:25px;
}

.container{
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:15px;
margin-bottom:20px;
box-shadow:0 3px 10px #ccc;
}


input,textarea{

width:100%;
padding:12px;
margin:8px 0;
border-radius:10px;
border:1px solid #ccc;

}


button{

background:#2e7d32;
color:white;
padding:15px;
border:0;
border-radius:10px;
width:100%;
font-size:18px;

}


</style>

</head>


<body>


<header>

<h1>🏛️ จัดการโครงสร้างชุมชน</h1>

<p>Rongkhem Smart Village</p>

</header>



<div class="container">


<div class="card">


<h2>👤 ผู้นำหมู่บ้าน</h2>


<label>ชื่อ</label>

<input id="leader">


<label>ตำแหน่ง</label>

<input id="position">


<label>เบอร์โทร</label>

<input id="phone">


<label>หน้าที่</label>

<textarea id="duty"></textarea>


</div>



<button onclick="save()">

💾 บันทึกข้อมูล

</button>



</div>



<script>


function save(){


let data={

leader:
leader.value,

position:
position.value,

phone:
phone.value,

duty:
duty.value

};


localStorage.setItem(
"organization",
JSON.stringify(data)
);


alert("บันทึกข้อมูลแล้ว");


}


</script>



</body>

</html>
