<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>โครงสร้างชุมชน | Rongkhem Smart Village</title>

<style>

body{
margin:0;
font-family:Tahoma,Arial,sans-serif;
background:#f1f8e9;
}

header{
background:#2e7d32;
color:white;
text-align:center;
padding:25px;
}

.container{
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:15px;
margin-bottom:20px;
box-shadow:0 3px 10px #ccc;
}


.people{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;

}


.person{

background:#e8f5e9;
padding:20px;
border-radius:15px;
text-align:center;

}


.person img{

width:130px;
height:130px;
border-radius:50%;
object-fit:cover;
border:5px solid white;

}


.name{

font-size:20px;
font-weight:bold;
color:#1b5e20;

}


.position{

color:#555;
margin:10px;

}


.phone{

background:#388e3c;
color:white;
padding:8px;
border-radius:10px;

}


.back{

display:block;
background:#388e3c;
color:white;
padding:15px;
border-radius:10px;
text-align:center;
text-decoration:none;

}

</style>

</head>


<body>


<header>

<h1>🏛️ โครงสร้างชุมชน</h1>

<h2>Rongkhem Smart Village</h2>

<p>
บ้านร่องเข็ม หมู่ที่ 6<br>
ตำบลจำป่าหวาย อำเภอเมือง จังหวัดพะเยา
</p>

</header>



<div class="container">


<div id="content"></div>


<a class="back" href="dashboard.html">
⬅ กลับ Dashboard
</a>


</div>



<script>


fetch("../data/organization.json")

.then(res=>res.json())

.then(data=>{


let html="";


function createGroup(title,icon,persons){


html+=`

<div class="card">

<h2>${icon} ${title}</h2>

<div class="people">

`;



persons.forEach(p=>{


html+=`

<div class="person">


<img src="${p.image}" 
onerror="this.src='../images/default.png'">


<div class="name">
${p.name}
</div>


<div class="position">
${p.position}
</div>


<div>
📞 ${p.phone || "-"}
</div>


<p>
${p.duty || ""}
</p>


</div>


`;

});


html+=`

</div>

</div>

`;

}



createGroup(
"ผู้นำหมู่บ้าน",
"👤",
data.leader
);


createGroup(
"คณะกรรมการหมู่บ้าน",
"🏛️",
data.committee
);


createGroup(
"อสม.",
"🩺",
data.health
);


createGroup(
"กลุ่มแม่บ้าน",
"👩",
data.women
);


createGroup(
"ชมรมผู้สูงอายุ",
"👴",
data.elderly
);


createGroup(
"ชรบ.",
"🛡️",
data.vrv
);


createGroup(
"อปพร.",
"🚒",
data.oporor
);



document.getElementById("content").innerHTML=html;


});


</script>


</body>

</html>
