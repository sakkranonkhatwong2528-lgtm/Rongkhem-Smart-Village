<!-- แบบฟอร์ม บันทึก / แก้ไข -->
<form id="citizenForm" class="bg-white p-6 rounded-lg shadow mb-8">
  <h3 class="text-lg font-bold mb-4 text-gray-800">บันทึก / แก้ไข ข้อมูลประชากร</h3>
  
  <!-- Hidden Field สำหรับเก็บ ID เวลาแก้ไข -->
  <input type="hidden" id="citizenId">
  <input type="hidden" id="existingImageUrl">

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
    <div>
      <label class="block text-sm font-medium mb-1">บ้านเลขที่</label>
      <input type="text" id="houseNumber" required class="w-full border rounded p-2" placeholder="เช่น 12/1">
    </div>
    
    <div>
      <label class="block text-sm font-medium mb-1">ชื่อ - นามสกุล</label>
      <input type="text" id="fullname" required class="w-full border rounded p-2" placeholder="เช่น นายสมชาย ใจดี">
    </div>

    <div>
      <label class="block text-sm font-medium mb-1">กลุ่มสวัสดิการ</label>
      <select id="welfareGroup" class="w-full border rounded p-2">
        <option value="ประชาชนทั่วไป">ประชาชนทั่วไป</option>
        <option value="ผู้สูงอายุ">ผู้สูงอายุ</option>
        <option value="ผู้พิการ/เปราะบาง">ผู้พิการ/เปราะบาง</option>
        <option value="อสม.">อสม.</option>
      </select>
    </div>
  </div>

  <div class="mb-4">
    <label class="block text-sm font-medium mb-1">รูปภาพประจำตัว</label>
    <input type="file" id="imageFile" accept="image/*" class="w-full border rounded p-2">
    <img id="imagePreview" src="" class="mt-2 w-20 h-20 rounded-full object-cover hidden border">
  </div>

  <div class="flex gap-2">
    <button type="submit" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded">
      บันทึกข้อมูล
    </button>
    <button type="button" onclick="resetForm()" class="bg-gray-400 hover:bg-gray-500 text-white px-4 py-2 rounded">
      ยกเลิก / ล้างค่า
    </button>
  </div>
</form>

<!-- ตารางแสดงข้อมูล -->
<div class="bg-white rounded-lg shadow overflow-x-auto">
  <table id="citizenTable" class="w-full text-left border-collapse">
    <thead>
      <tr class="bg-gray-100 border-b">
        <th class="px-4 py-3">บ้านเลขที่</th>
        <th class="px-4 py-3">ชื่อ - นามสกุล</th>
        <th class="px-4 py-3">กลุ่มสวัสดิการ</th>
        <th class="px-4 py-3">การจัดการ</th>
      </tr>
    </thead>
    <tbody>
      <!-- ข้อมูลจาก Supabase จะถูกเพิ่มตรงนี้ด้วย JavaScript -->
    </tbody>
  </table>
</div>
