<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
จัดการกิจกรรมหมู่บ้าน | บ้านร่องเข็ม Smart Village
</title>


<style>

body{

margin:0;
font-family:Tahoma,sans-serif;
background:#e0f7fa;

}


header{

background:#006064;
color:white;
padding:30px;
text-align:center;

}



.container{

padding:20px;

}



.card{

background:white;
padding:25px;
border-radius:25px;
box-shadow:0 4px 12px #ccc;

}



input,textarea{

width:100%;
padding:12px;
margin:10px 0;
border-radius:10px;
border:1px solid #ccc;
box-sizing:border-box;

}



button{

background:#006064;
color:white;
padding:12px 30px;
border:none;
border-radius:20px;

}



.item{

background:#e0f7fa;
padding:15px;
margin-top:15px;
border-radius:15px;

}



.delete{

background:#c62828;
color:white;
border:none;
padding:8px 15px;
border-radius:15px;

}



.back{

text-align:center;
margin:30px;

}


.back a{

background:#006064;
color:white;
padding:12px 25px;
border-radius:20px;
text-decoration:none;

}


</style>


</head>



<body>



<header>


<h1>
📅 จัดการกิจกรรมหมู่บ้าน
</h1>


<p>
Admin บ้านร่องเข็ม Smart Village
</p>


</header>






<div class="container">



<div class="card">


<h2>
➕ เพิ่มกิจกรรม
</h2>




<label>
ชื่อกิจกรรม
</label>


<input
id="title"
placeholder="เช่น ประชุมหมู่บ้านประจำเดือน">





<label>
วันที่จัดกิจกรรม
</label>


<input
id="date"
type="date">





<label>
เวลา
</label>


<input
id="time"
placeholder="เช่น 08.00 น.">





<label>
สถานที่
</label>


<input
id="place"
placeholder="เช่น ศาลาประชาคม">





<label>
ผู้รับผิดชอบ
</label>


<input
id="owner"
placeholder="เช่น ผู้ใหญ่บ้าน / อสม.">





<label>
รายละเอียดกิจกรรม
</label>


<textarea
id="detail"
rows="5"
placeholder="รายละเอียด">
</textarea>





<label>
ชื่อไฟล์รูปภาพ
</label>


<input
id="image"
placeholder="เช่น activity1.jpg">





<button onclick="saveActivity()">

💾 บันทึกกิจกรรม

</button>



</div>








<div class="card">


<h2>
📋 รายการกิจกรรม
</h2>


<div id="list">

</div>


</div>





</div>








<div class="back">


<a href="admin-dashboard.html">

⚙️ กลับ Dashboard

</a>


</div>









<script>


let activities =

JSON.parse(

localStorage.getItem("activities")

)||[];




showList();






function saveActivity(){



let data={


title:

document.getElementById("title").value,


date:

document.getElementById("date").value,


time:

document.getElementById("time").value,


place:

document.getElementById("place").value,


owner:

document.getElementById("owner").value,


detail:

document.getElementById("detail").value,


image:

document.getElementById("image").value


};





activities.push(data);




localStorage.setItem(

"activities",

JSON.stringify(activities)

);




alert("เพิ่มกิจกรรมเรียบร้อย");



showList();


}





function showList(){



let html="";



activities.forEach(function(item,index){



html +=`

<div class="item">


<b>
${item.title}
</b>


<br>

📅 ${item.date}


<br>

📍 ${item.place}


<br>

👥 ${item.owner}


<br><br>


<button class="delete"

onclick="deleteActivity(${index})">

ลบ

</button>


</div>


`;



});



document.getElementById("list")
.innerHTML=html;


}





function deleteActivity(index){


activities.splice(index,1);



localStorage.setItem(

"activities",

JSON.stringify(activities)

);



showList();



}



</script>






</body>

</html>
