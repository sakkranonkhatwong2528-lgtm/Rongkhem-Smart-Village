<!DOCTYPE html>

<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
Admin ชรบ. | บ้านร่องเข็ม
</title>


<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="css/admin-shorbor.css">


</head>


<body>


<header class="admin-shorbor-header">


<h1>
🛡️ จัดการข้อมูล ชรบ.
</h1>


<p>
บ้านร่องเข็ม Smart Village
</p>


</header>






<section class="summary">


<div class="card">

<h3>
🛡️ ชรบ.ทั้งหมด
</h3>

<h1 id="total">
0
</h1>

</div>





<div class="card">

<h3>
✅ ปฏิบัติหน้าที่
</h3>

<h1 id="active">
0
</h1>

</div>





<div class="card">

<h3>
📍 พื้นที่รับผิดชอบ
</h3>

<h1 id="area">
0
</h1>

</div>


</section>







<section class="form-box">


<h2>
➕ เพิ่มสมาชิก ชรบ.
</h2>


<input id="name"
placeholder="ชื่อ-นามสกุล">


<input id="position"
placeholder="ตำแหน่ง">


<input id="areaName"
placeholder="พื้นที่รับผิดชอบ">


<select id="status">


<option>
ปฏิบัติหน้าที่
</option>


<option>
สำรอง
</option>


</select>



<button onclick="addShorbor()">

บันทึก

</button>


</section>








<section class="table-box">


<h2>
📋 รายชื่อ ชรบ.
</h2>


<table>


<thead>

<tr>

<th>
ชื่อ
</th>

<th>
ตำแหน่ง
</th>

<th>
พื้นที่
</th>

<th>
สถานะ
</th>

<th>
จัดการ
</th>

</tr>


</thead>



<tbody id="shorborTable">


</tbody>


</table>


</section>







<script src="js/admin-shorbor.js"></script>


</body>

</html>
