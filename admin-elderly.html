<!DOCTYPE html>

<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
Admin Elderly | บ้านร่องเข็ม
</title>


<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="css/admin-elderly.css">


</head>


<body>


<header class="elderly-admin-header">


<h1>
👴 จัดการข้อมูลผู้สูงอายุ
</h1>


<p>
บ้านร่องเข็ม Smart Village
</p>


</header>





<section class="summary">



<div class="card">

<h3>
👴 ผู้สูงอายุทั้งหมด
</h3>

<h1 id="total">
0
</h1>

</div>




<div class="card">

<h3>
❤️ ติดตามสุขภาพ
</h3>

<h1 id="health">
0
</h1>

</div>





<div class="card">

<h3>
🩺 อสม.ดูแล
</h3>

<h1 id="care">
0
</h1>

</div>


</section>







<section class="form-box">


<h2>
➕ เพิ่มผู้สูงอายุ
</h2>


<input id="name"
placeholder="ชื่อ-นามสกุล">


<input id="age"
type="number"
placeholder="อายุ">


<input id="house"
placeholder="บ้านเลขที่">


<select id="healthStatus">

<option>
ปกติ
</option>

<option>
ติดตามสุขภาพ
</option>

<option>
ต้องดูแลพิเศษ
</option>

</select>



<button onclick="addElderly()">

บันทึก

</button>


</section>








<section class="table-box">


<h2>
📋 รายชื่อผู้สูงอายุ
</h2>



<table>


<thead>

<tr>

<th>
ชื่อ
</th>

<th>
อายุ
</th>

<th>
บ้าน
</th>

<th>
สุขภาพ
</th>

<th>
จัดการ
</th>

</tr>

</thead>



<tbody id="elderlyTable">


</tbody>


</table>


</section>







<script src="js/admin-elderly.js"></script>


</body>

</html>
