<!DOCTYPE html>
<html lang="th">


<head>


<meta charset="UTF-8">


<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
Document Center
</title>


<link rel="stylesheet"
href="assets/css/dashboard.css">


</head>


<body>


<div class="dashboard-container">



<header class="dashboard-header">


<div>

<h1>
📄 Smart Document Center
</h1>


<p>
ศูนย์เอกสารบ้านร่องเข็ม
</p>


</div>


</header>






<section class="section">


<h2 class="section-title">

📚 เอกสารทั้งหมด

</h2>



<div id="documentList">

กำลังโหลด...

</div>


</section>



</div>





<script>


async function loadDocument(){



const res=

await fetch(

"data/document.json"

);



const data=

await res.json();



let box=

document.getElementById(

"documentList"

);



box.innerHTML="";





data.documents.forEach(doc=>{


box.innerHTML += `


<div class="dashboard-card">


<h3>

📄 ${doc.title}

</h3>


<p>

ประเภท : ${doc.category}

</p>


<p>

วันที่ : ${doc.date}

</p>


<a href="documents/${doc.file}">

ดาวน์โหลดเอกสาร

</a>


</div>


`;



});



}



loadDocument();


</script>



</body>

</html>
