<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
จัดการคลังภาพ | บ้านร่องเข็ม Smart Village
</title>


<style>


body{

margin:0;
font-family:Tahoma,sans-serif;
background:#f3e5f5;

}


header{

background:#4a148c;
color:white;
padding:30px;
text-align:center;

}



.container{

padding:20px;

}



.card{

background:white;
padding:25px;
border-radius:25px;
box-shadow:0 4px 12px #ccc;
margin-bottom:20px;

}



input,textarea,select{

width:100%;
padding:12px;
margin:10px 0;
border-radius:10px;
border:1px solid #ccc;
box-sizing:border-box;

}



button{

background:#4a148c;
color:white;
padding:12px 30px;
border:none;
border-radius:20px;

}



.item{

background:#f3e5f5;
padding:15px;
border-radius:15px;
margin-top:15px;

}



.delete{

background:#c62828;
color:white;
border:none;
padding:8px 15px;
border-radius:15px;

}



.back{

text-align:center;
margin:30px;

}



.back a{

background:#4a148c;
color:white;
padding:12px 25px;
border-radius:20px;
text-decoration:none;

}


</style>


</head>



<body>



<header>


<h1>
📸 จัดการคลังภาพ
</h1>


<p>
Admin บ้านร่องเข็ม Smart Village
</p>


</header>







<div class="container">



<div class="card">


<h2>
➕ เพิ่มรูปภาพกิจกรรม
</h2>




<label>
ชื่อภาพ
</label>


<input

id="title"

placeholder="เช่น อนุรักษ์แหล่งซับน้ำจำ">




<label>
หมวดหมู่
</label>


<select id="category">


<option>
กิจกรรมหมู่บ้าน
</option>


<option>
แหล่งซับน้ำจำ
</option>


<option>
วัดร่องเข็ม
</option>


<option>
สุขภาพชุมชน
</option>


<option>
สิ่งแวดล้อม
</option>


<option>
ชรบ. / อปพร.
</option>


</select>





<label>
รายละเอียด
</label>


<textarea

id="detail"

rows="4"

placeholder="รายละเอียดภาพ">

</textarea>





<label>
ชื่อไฟล์รูปภาพ
</label>


<input

id="image"

placeholder="เช่น subnamjam1.jpg">





<button onclick="saveGallery()">

💾 บันทึกรูปภาพ

</button>



</div>








<div class="card">


<h2>
📋 รูปภาพที่มีอยู่
</h2>


<div id="list">

</div>


</div>





</div>







<div class="back">

<a href="admin-dashboard.html">

⚙️ กลับ Dashboard

</a>

</div>







<script>



let gallery =

JSON.parse(

localStorage.getItem("gallery")

)||[];




showList();







function saveGallery(){



let data={


title:

document.getElementById("title").value,


category:

document.getElementById("category").value,


detail:

document.getElementById("detail").value,


image:

document.getElementById("image").value


};




gallery.push(data);




localStorage.setItem(

"gallery",

JSON.stringify(gallery)

);



alert("เพิ่มรูปภาพเรียบร้อย");


showList();



}








function showList(){



let html="";



gallery.forEach(function(item,index){



html +=`

<div class="item">


<b>
${item.title}
</b>


<br>


หมวดหมู่ :
${item.category}


<br>


ไฟล์ :
${item.image}


<br><br>



<button class="delete"

onclick="deleteGallery(${index})">

ลบ

</button>


</div>


`;



});



document.getElementById("list")
.innerHTML=html;



}







function deleteGallery(index){



gallery.splice(index,1);



localStorage.setItem(

"gallery",

JSON.stringify(gallery)

);



showList();



}



</script>







</body>

</html>
