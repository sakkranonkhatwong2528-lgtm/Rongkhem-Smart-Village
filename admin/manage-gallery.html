<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
จัดการคลังภาพ | บ้านร่องเข็ม Smart Village
</title>


<style>

body{

margin:0;
font-family:Tahoma,sans-serif;
background:#fce4ec;

}


header{

background:#ad1457;
color:white;
padding:30px;
text-align:center;

}


.container{

padding:20px;

}


.card{

background:white;
padding:25px;
border-radius:20px;
box-shadow:0 4px 12px #ccc;
margin-bottom:20px;

}


input,select{

width:100%;
padding:12px;
margin:10px 0;
border-radius:10px;
border:1px solid #ccc;

}


button{

background:#ad1457;
color:white;
padding:12px 30px;
border:none;
border-radius:20px;

}


.image-item{

background:#fce4ec;
padding:15px;
border-radius:15px;
margin-top:15px;

}


.back{

text-align:center;
margin:30px;

}


.back a{

background:#ad1457;
color:white;
padding:12px 25px;
border-radius:20px;
text-decoration:none;

}


</style>


</head>



<body>



<header>

<h1>
📸 จัดการคลังภาพ
</h1>


<p>
บ้านร่องเข็ม Smart Village
</p>

</header>





<div class="container">



<div class="card">


<h2>
➕ เพิ่มรูปภาพ
</h2>



<input
id="title"
placeholder="ชื่อภาพ">


<select id="category">


<option>
เลือกหมวดภาพ
</option>


<option>
กิจกรรมหมู่บ้าน
</option>


<option>
แหล่งซับน้ำจำ
</option>


<option>
วัดร่องเข็ม
</option>


<option>
อสม.
</option>


<option>
ชรบ. / อปพร.
</option>


<option>
สิ่งแวดล้อม
</option>


</select>




<input

id="image"

placeholder="ชื่อไฟล์ภาพ เช่น photo1.jpg">


<button onclick="saveImage()">

💾 บันทึกภาพ

</button>


</div>






<div class="card">


<h2>
📋 รายการภาพ
</h2>


<div id="list">

</div>


</div>




</div>






<div class="back">

<a href="admin-dashboard.html">

⚙️ กลับ Dashboard

</a>

</div>







<script>


showImage();



function saveImage(){



let item={


title:
document.getElementById("title").value,


category:
document.getElementById("category").value,


image:
document.getElementById("image").value


};



let data=

JSON.parse(
localStorage.getItem("gallery")
)||[];



data.push(item);



localStorage.setItem(
"gallery",
JSON.stringify(data)
);



alert("เพิ่มรูปภาพแล้ว");


location.reload();



}





function showImage(){


let data=

JSON.parse(
localStorage.getItem("gallery")
)||[];



let html="";



data.forEach(function(item){


html += `


<div class="image-item">


<h3>
📷 ${item.title}
</h3>


<p>
หมวด:
${item.category}
</p>


<p>
ไฟล์:
${item.image}
</p>


</div>


`;


});



document.getElementById("list")
.innerHTML=html;


}



</script>




</body>

</html>
