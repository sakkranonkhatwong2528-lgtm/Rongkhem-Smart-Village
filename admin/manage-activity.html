<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
จัดการกิจกรรม | Rongkhem Smart Village
</title>


<link rel="stylesheet" href="../assets/css/dashboard.css">


<style>


.form-box{

background:white;

padding:25px;

border-radius:20px;

box-shadow:0 5px 15px rgba(0,0,0,.1);

}



input,textarea,select{


width:100%;

padding:12px;

margin-bottom:15px;

border-radius:10px;

border:1px solid #ddd;


}



textarea{

height:120px;

}



.save-btn{

background:#2e7d32;

color:white;

border:none;

padding:12px 25px;

border-radius:10px;

cursor:pointer;

}



.activity-card{


background:white;

padding:20px;

border-radius:15px;

margin-bottom:15px;


box-shadow:

0 3px 10px rgba(0,0,0,.1);


}



.delete-btn{

background:#c62828;

color:white;

border:none;

padding:8px 15px;

border-radius:8px;

cursor:pointer;


}


</style>


</head>



<body onload="checkLogin();loadActivity()">



<div class="dashboard-container">



<header class="dashboard-header">


<div>


<h1>

📅 จัดการกิจกรรมหมู่บ้าน

</h1>


<p>

Rongkhem Smart Village Project

</p>


</div>



<button

class="btn btn-print"

onclick="logout()">

ออกจากระบบ

</button>



</header>









<section class="section">


<h2 class="section-title">

➕ เพิ่มกิจกรรม

</h2>




<div class="form-box">


<input id="title"

placeholder="ชื่อกิจกรรม">


<select id="category">


<option>
การพัฒนาชุมชน
</option>


<option>
สิ่งแวดล้อม
</option>


<option>
สุขภาพ
</option>


<option>
เศรษฐกิจชุมชน
</option>


<option>
การปกครอง
</option>


</select>



<input id="location"

placeholder="สถานที่">



<textarea id="detail"

placeholder="รายละเอียดกิจกรรม">

</textarea>



<button

class="save-btn"

onclick="saveActivity()">

บันทึกกิจกรรม

</button>


</div>


</section>








<section class="section">


<h2 class="section-title">

📋 รายการกิจกรรม

</h2>


<div id="activityList">

กำลังโหลด...

</div>


</section>




</div>








<script src="../assets/js/admin.js"></script>


<script>


let activities=[];





async function loadActivity(){


const res=

await fetch("../data/activity.json");



const data=

await res.json();



activities=

data.activities || [];



showActivity();


}






function showActivity(){


const box=

document.getElementById("activityList");



box.innerHTML="";



activities.forEach((item,index)=>{



box.innerHTML += `


<div class="activity-card">


<h3>

📌 ${item.title}

</h3>


<p>

ประเภท : ${item.category}

</p>


<p>

สถานที่ : ${item.location}

</p>


<p>

${item.detail}

</p>


<p>

สถานะ : ${item.status || "ดำเนินการ"}

</p>



<button

class="delete-btn"

onclick="deleteActivity(${index})">

ลบ

</button>



</div>


`;



});



}








function saveActivity(){



let item={



id:Date.now(),


title:

document.getElementById("title").value,


category:

document.getElementById("category").value,


date:

new Date().toISOString().slice(0,10),


location:

document.getElementById("location").value,


detail:

document.getElementById("detail").value,


status:"ดำเนินการ"



};



activities.unshift(item);



showActivity();



alert(

"เพิ่มกิจกรรมเรียบร้อย"

);



}






function deleteActivity(index){



if(confirm("ต้องการลบกิจกรรมนี้หรือไม่?")){


activities.splice(index,1);


showActivity();


}


}



</script>


</body>


</html>
