<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ฐานข้อมูล อปพร. | Rongkhem Smart Village</title>


<style>

body{
font-family:"Sarabun",sans-serif;
background:#fff8e1;
margin:0;
}


header{

background:#d84315;
color:white;
padding:20px;
text-align:center;

}


.container{

padding:20px;

}


.card{

background:white;
padding:20px;
border-radius:15px;
margin-bottom:20px;
box-shadow:0 2px 8px #ccc;

}


input,select{

width:100%;
padding:10px;
margin:8px 0;
border-radius:8px;
border:1px solid #ccc;

}


button{

background:#2e7d32;
color:white;
border:0;
padding:10px 20px;
border-radius:8px;

}


.delete{

background:#c62828;

}


.list{

display:grid;
grid-template-columns:
repeat(auto-fit,minmax(230px,1fr));
gap:15px;

}


.member{

background:white;
padding:15px;
border-radius:12px;
text-align:center;
box-shadow:0 2px 5px #ccc;

}


.member img{

width:130px;
height:130px;
border-radius:50%;
object-fit:cover;

}


</style>

</head>


<body>


<header>

<h2>
🚨 ฐานข้อมูล อปพร.
</h2>

<p>
บ้านร่องเข็ม หมู่ที่ 6
ตำบลจำป่าหวาย จังหวัดพะเยา
</p>

</header>



<div class="container">


<div class="card">


<h3>
➕ เพิ่มข้อมูล อปพร.
</h3>


<input id="name"
placeholder="ชื่อ - นามสกุล">


<input id="age"
placeholder="อายุ">


<input id="phone"
placeholder="เบอร์โทรศัพท์">


<input id="year"
placeholder="รุ่น / ปีที่อบรม">


<select id="status">

<option>
พร้อมปฏิบัติหน้าที่
</option>

<option>
สำรอง
</option>

<option>
พักปฏิบัติหน้าที่
</option>

</select>


<input id="image"
placeholder="ชื่อไฟล์รูป เช่น opp01.jpg">


<button onclick="addOpp()">

💾 บันทึกข้อมูล

</button>


</div>




<div class="card">

<h3>
👮 รายชื่อ อปพร.
</h3>


<div id="list"
class="list">

</div>


</div>


</div>




<script>


let opp =

JSON.parse(localStorage.getItem("opp"))

|| [];




function addOpp(){


let data={


id:Date.now(),


name:
document.getElementById("name").value,


age:
document.getElementById("age").value,


phone:
document.getElementById("phone").value,


year:
document.getElementById("year").value,


status:
document.getElementById("status").value,


image:
document.getElementById("image").value


};


opp.push(data);


localStorage.setItem(

"opp",

JSON.stringify(opp)

);


showOpp();


alert("เพิ่มข้อมูล อปพร. แล้ว");


}




function showOpp(){


let box=document.getElementById("list");


box.innerHTML="";


opp.forEach(o=>{


box.innerHTML +=`


<div class="member">


<img src="../images/opp/${o.image}">


<h3>

${o.name}

</h3>


<p>
อายุ ${o.age} ปี
</p>


<p>
☎ ${o.phone}
</p>


<p>
อบรมรุ่น ${o.year}
</p>


<p>
${o.status}
</p>


<button class="delete"

onclick="deleteOpp(${o.id})">

ลบ

</button>


</div>


`;


});


}




function deleteOpp(id){


opp=

opp.filter(

o=>o.id!=id

);


localStorage.setItem(

"opp",

JSON.stringify(opp)

);


showOpp();

}



showOpp();


</script>


</body>

</html>
