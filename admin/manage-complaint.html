<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
จัดการร้องเรียน | Rongkhem Smart Village
</title>


<link rel="stylesheet" href="../assets/css/dashboard.css">


<style>


.complaint-card{

background:white;

padding:20px;

border-radius:15px;

margin-bottom:15px;

box-shadow:

0 5px 10px rgba(0,0,0,.1);

}



select{

padding:10px;

border-radius:10px;

border:1px solid #ddd;

}



.summary-grid{

display:grid;

grid-template-columns:

repeat(auto-fit,minmax(200px,1fr));

gap:15px;

}



.summary-card{

background:white;

padding:20px;

border-radius:15px;

text-align:center;

box-shadow:0 5px 10px rgba(0,0,0,.1);

}



.summary-card h2{

color:#2e7d32;

font-size:35px;

}


</style>


</head>



<body onload="checkLogin();loadComplaint()">



<div class="dashboard-container">



<header class="dashboard-header">


<div>

<h1>

📋 ศูนย์จัดการร้องเรียน

</h1>


<p>

Smart Complaint Center

</p>


</div>



<button

class="btn btn-print"

onclick="logout()">

ออกจากระบบ

</button>


</header>








<section class="section">


<h2 class="section-title">

📊 สรุปสถานะ

</h2>



<div class="summary-grid">


<div class="summary-card">

<h2 id="pending">

0

</h2>

<p>

รอดำเนินการ

</p>

</div>



<div class="summary-card">

<h2 id="processing">

0

</h2>

<p>

กำลังแก้ไข

</p>

</div>



<div class="summary-card">

<h2 id="complete">

0

</h2>

<p>

เสร็จแล้ว

</p>

</div>


</div>


</section>








<section class="section">


<h2 class="section-title">

📋 รายการร้องเรียน

</h2>



<div id="complaintList">

กำลังโหลด...

</div>


</section>



</div>







<script src="../assets/js/admin.js"></script>


<script>


let complaints=[];





function loadComplaint(){


let data=

localStorage.getItem("complaint");


if(data){


complaints=[JSON.parse(data)];


}


else{


complaints=[];


}



showComplaint();


}








function showComplaint(){


let box=

document.getElementById("complaintList");



box.innerHTML="";



let pending=0;

let processing=0;

let complete=0;





complaints.forEach((item,index)=>{



if(item.status==="รอดำเนินการ")

pending++;


if(item.status==="กำลังแก้ไข")

processing++;


if(item.status==="เสร็จแล้ว")

complete++;





box.innerHTML += `


<div class="complaint-card">


<h3>

📢 ${item.type}

</h3>



<p>

ผู้แจ้ง : ${item.name}

</p>



<p>

รายละเอียด :

${item.detail}

</p>



<p>

วันที่ :

${item.date}

</p>




<select onchange="changeStatus(${index},this.value)">


<option

${item.status==="รอดำเนินการ"?"selected":""}>

รอดำเนินการ

</option>


<option

${item.status==="กำลังแก้ไข"?"selected":""}>

กำลังแก้ไข

</option>



<option

${item.status==="เสร็จแล้ว"?"selected":""}>

เสร็จแล้ว

</option>



</select>



</div>


`;



});





document.getElementById("pending").innerHTML=pending;

document.getElementById("processing").innerHTML=processing;

document.getElementById("complete").innerHTML=complete;



}







function changeStatus(index,status){


complaints[index].status=status;



localStorage.setItem(

"complaint",

JSON.stringify(complaints[0])

);



showComplaint();


}



</script>



</body>

</html>
