<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
ทำเนียบผู้นำ | Rongkhem Smart Village
</title>


<link rel="stylesheet" href="../assets/css/dashboard.css">


<style>


.form-box{

background:white;

padding:25px;

border-radius:20px;

box-shadow:0 5px 15px rgba(0,0,0,.1);

margin-bottom:25px;

}



input{

width:100%;

padding:12px;

margin-bottom:15px;

border-radius:10px;

border:1px solid #ddd;

}



.save-btn{

background:#2e7d32;

color:white;

border:none;

padding:12px 25px;

border-radius:10px;

cursor:pointer;

}



.leader-card{

background:white;

padding:20px;

border-radius:15px;

margin-bottom:15px;

box-shadow:0 3px 10px rgba(0,0,0,.1);

}



.delete-btn{

background:#c62828;

color:white;

border:none;

padding:8px 15px;

border-radius:8px;

cursor:pointer;

}



</style>


</head>



<body onload="checkLogin();loadLeader()">



<div class="dashboard-container">



<header class="dashboard-header">


<div>

<h1>
👤 ทำเนียบผู้นำชุมชน
</h1>


<p>
บ้านร่องเข็ม หมู่ที่ 6
</p>

</div>


<button 
class="btn btn-print"
onclick="logout()">

ออกจากระบบ

</button>


</header>







<section class="section">


<h2 class="section-title">

➕ เพิ่มบุคลากร

</h2>


<div class="form-box">


<input id="name"

placeholder="ชื่อ - นามสกุล">


<input id="position"

placeholder="ตำแหน่ง">


<input id="department"

placeholder="ฝ่ายงาน">


<button

class="save-btn"

onclick="saveLeader()">

บันทึก

</button>


</div>


</section>







<section class="section">


<h2 class="section-title">

👥 รายชื่อคณะทำงาน

</h2>


<div id="leaderList">

กำลังโหลด...

</div>


</section>



</div>







<script src="../assets/js/admin.js"></script>



<script>


let leaders=[];





async function loadLeader(){


const res = await fetch("../data/leader.json");


const data = await res.json();


leaders=data.leaders || [];


showLeader();


}






function showLeader(){


const box=

document.getElementById("leaderList");


box.innerHTML="";



leaders.forEach((item,index)=>{


box.innerHTML += `


<div class="leader-card">


<h3>

👤 ${item.name}

</h3>


<p>

ตำแหน่ง : ${item.position}

</p>


<p>

ฝ่าย : ${item.department}

</p>


<p>

สถานะ : ${item.status}

</p>



<button

class="delete-btn"

onclick="deleteLeader(${index})">

ลบ

</button>


</div>


`;



});


}







function saveLeader(){



let data={


id:Date.now(),


name:

document.getElementById("name").value,


position:

document.getElementById("position").value,


department:

document.getElementById("department").value,


status:"ปฏิบัติหน้าที่"


};



leaders.push(data);


showLeader();


alert(

"เพิ่มข้อมูลเรียบร้อย"

);


}







function deleteLeader(index){


if(confirm("ลบรายชื่อนี้หรือไม่?")){


leaders.splice(index,1);


showLeader();


}


}



</script>



</body>

</html>
