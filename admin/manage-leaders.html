<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>จัดการทำเนียบผู้นำ | บ้านร่องเข็ม Smart Village</title>

<style>

body{
    font-family:"Tahoma",sans-serif;
    background:#f1f8e9;
    margin:0;
}

header{
    background:#2e7d32;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}


.card{
    background:white;
    padding:20px;
    margin-bottom:20px;
    border-radius:15px;
    box-shadow:0 3px 10px #ccc;
}


input,textarea{

    width:100%;
    padding:12px;
    margin:8px 0;
    border-radius:8px;
    border:1px solid #ccc;
    box-sizing:border-box;

}


textarea{
    height:100px;
}


button{

    background:#2e7d32;
    color:white;
    border:0;
    padding:12px 25px;
    border-radius:10px;
    cursor:pointer;

}


button:hover{
    opacity:.8;
}


.leader{

    display:flex;
    gap:20px;
    padding:15px;
    border-bottom:1px solid #ddd;
    align-items:center;

}


.leader img{

    width:100px;
    height:100px;
    border-radius:50%;
    object-fit:cover;

}


.delete{

background:#c62828;

}


.back{

background:#1565c0;

}


</style>

</head>


<body>


<header>

<h2>👥 จัดการทำเนียบผู้นำ</h2>

<p>🏡 บ้านร่องเข็ม Smart Village</p>

</header>



<div class="container">


<div class="card">

<h3>➕ เพิ่มข้อมูลผู้นำ</h3>


<label>ชื่อ - นามสกุล</label>

<input id="name">


<label>ตำแหน่ง</label>

<input id="position">


<label>หน้าที่รับผิดชอบ</label>

<textarea id="duty"></textarea>


<label>เบอร์โทร</label>

<input id="phone">


<label>📷 รูปภาพ</label>

<input 
type="file"
id="photo"
accept="image/*">


<br><br>


<button onclick="saveData()">

💾 บันทึก

</button>


</div>



<div class="card">

<h3>📋 รายชื่อผู้นำ</h3>


<div id="result"></div>


</div>



<button class="back"
onclick="location.href='../index.html'">

🏠 กลับหน้าแรก

</button>



</div>



<script>


let leaders = JSON.parse(
localStorage.getItem("leaders")
) || [];



function saveData(){


let name =
document.getElementById("name").value.trim();


let position =
document.getElementById("position").value.trim();


let duty =
document.getElementById("duty").value.trim();


let phone =
document.getElementById("phone").value.trim();


let photo =
document.getElementById("photo").files[0];



if(name=="" || position==""){

alert("กรุณากรอกชื่อและตำแหน่ง");

return;

}



if(photo){


let reader=new FileReader();


reader.onload=function(e){


addLeader(
e.target.result
);


};


reader.readAsDataURL(photo);



}else{


addLeader("");

}



function addLeader(image){


leaders.push({

id:Date.now(),

name:name,

position:position,

duty:duty,

phone:phone,

image:image

});


localStorage.setItem(

"leaders",

JSON.stringify(leaders)

);



alert("✅ บันทึกข้อมูลเรียบร้อย");


clearForm();


show();



}



}




function clearForm(){

document.getElementById("name").value="";

document.getElementById("position").value="";

document.getElementById("duty").value="";

document.getElementById("phone").value="";

document.getElementById("photo").value="";

}




function show(){


let html="";


leaders.forEach(function(item){



html += `

<div class="leader">


${
item.image 
?
`<img src="${item.image}">`
:
"📷"
}



<div>


<h3>${item.name}</h3>


<b>🏛️ ${item.position}</b>


<p>
📋 ${item.duty}
</p>


<p>
☎️ ${item.phone}
</p>



<button 
class="delete"
onclick="deleteData(${item.id})">

🗑️ ลบ

</button>


</div>


</div>


`;



});



document.getElementById("result").innerHTML=html;



}




function deleteData(id){


if(confirm("ต้องการลบข้อมูลนี้หรือไม่?")){


leaders =
leaders.filter(
x=>x.id!==id
);



localStorage.setItem(

"leaders",

JSON.stringify(leaders)

);



show();



}



}



show();


</script>


</body>
</html>
