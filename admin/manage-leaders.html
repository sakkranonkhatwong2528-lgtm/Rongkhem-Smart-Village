<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>จัดการทำเนียบผู้นำ | บ้านร่องเข็ม Smart Village</title>


<style>

body{
font-family:Tahoma,sans-serif;
background:#f1f8e9;
margin:0;
}


header{
background:#2e7d32;
color:white;
padding:20px;
text-align:center;
}


.container{
max-width:900px;
margin:auto;
padding:20px;
}


.card{

background:white;
padding:20px;
border-radius:15px;
margin-bottom:20px;
box-shadow:0 3px 10px #ccc;

}


input,textarea{

width:100%;
padding:12px;
margin:8px 0;
border:1px solid #ccc;
border-radius:8px;

}


button{

background:#2e7d32;
color:white;
border:0;
padding:12px 25px;
border-radius:10px;
cursor:pointer;

}


.leader{

display:flex;
gap:20px;
border-bottom:1px solid #ddd;
padding:15px 0;

}


.leader img{

width:100px;
height:100px;
border-radius:50%;
object-fit:cover;

}


</style>

</head>


<body>


<header>

<h2>👥 จัดการทำเนียบผู้นำ</h2>

<p>🏡 บ้านร่องเข็ม Smart Village</p>

</header>



<div class="container">


<div class="card">


<h3>➕ เพิ่มข้อมูลผู้นำ</h3>


<input id="name" placeholder="ชื่อ - นามสกุล">


<input id="position" placeholder="ตำแหน่ง">


<textarea id="duty"
placeholder="หน้าที่รับผิดชอบ">
</textarea>


<input id="phone"
placeholder="เบอร์โทร">


<label>
📷 เลือกรูปภาพ
</label>

<input type="file"
id="image"
accept="image/*">


<br><br>


<button onclick="saveLeader()">

💾 บันทึกข้อมูล

</button>


</div>



<div class="card">

<h3>📋 รายชื่อผู้นำ</h3>


<div id="list">

กำลังโหลด...

</div>


</div>



</div>





<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>


<script src="../js/firebase-config.js"></script>



<script>


async function saveLeader(){


let name =
document.getElementById("name").value;


let position =
document.getElementById("position").value;


let duty =
document.getElementById("duty").value;


let phone =
document.getElementById("phone").value;


let file =
document.getElementById("image").files[0];



if(!name || !position){

alert("กรุณากรอกชื่อและตำแหน่ง");

return;

}



let imageURL="";



// อัปโหลดรูป

if(file){


let ref =
storage.ref(
"leaders/"+Date.now()+"_"+file.name
);



await ref.put(file);


imageURL =
await ref.getDownloadURL();


}




// บันทึกข้อมูล


await db.collection("leaders")
.add({

name:name,

position:position,

duty:duty,

phone:phone,

image:imageURL,

created:
new Date()

});



alert("✅ บันทึกข้อมูลเรียบร้อย");


document.getElementById("name").value="";

document.getElementById("position").value="";

document.getElementById("duty").value="";

document.getElementById("phone").value="";

document.getElementById("image").value="";


loadLeaders();


}





async function loadLeaders(){


let html="";


let snap =
await db.collection("leaders")
.orderBy("created","desc")
.get();



snap.forEach(doc=>{


let l=doc.data();



html +=`

<div class="leader">


${l.image ?
`<img src="${l.image}">`
:
"📷"
}


<div>

<b>${l.name}</b>

<br>

🏛️ ${l.position}

<br>

📋 ${l.duty}

<br>

☎️ ${l.phone}


</div>


</div>


`;



});



document.getElementById("list").innerHTML=html;


}



loadLeaders();


</script>



</body>
</html>
