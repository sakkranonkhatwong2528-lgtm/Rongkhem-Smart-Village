<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
จัดการทำเนียบผู้นำ | บ้านร่องเข็ม Smart Village
</title>


<style>

body{

font-family:Tahoma,sans-serif;
margin:0;
background:#f5f5f5;

}


header{

background:#ef6c00;
color:white;
padding:25px;
text-align:center;

}


.container{

padding:20px;

}


.toolbar{

background:white;
padding:15px;
border-radius:15px;
margin-bottom:20px;

}


input,select{

width:100%;
padding:10px;
margin:5px 0;
border-radius:10px;
border:1px solid #ccc;

}


button{

background:#ef6c00;
color:white;
border:none;
padding:10px 20px;
border-radius:20px;
cursor:pointer;

}


.grid{

display:grid;
grid-template-columns:
repeat(auto-fit,minmax(250px,1fr));
gap:20px;

}


.card{

background:white;
padding:20px;
border-radius:20px;
box-shadow:0 3px 10px #ccc;
text-align:center;

}


.card img{

width:120px;
height:120px;
border-radius:50%;
object-fit:cover;

}


.position{

background:#ef6c00;
color:white;
padding:5px 15px;
border-radius:20px;
display:inline-block;

}


.name{

font-size:20px;
font-weight:bold;
margin-top:10px;

}


.back{

text-align:center;
margin:30px;

}

.back a{

background:#555;
color:white;
padding:10px 20px;
border-radius:20px;
text-decoration:none;

}


</style>

</head>


<body>


<header>

<h1>
👥 จัดการทำเนียบผู้นำ
</h1>

<p>
บ้านร่องเข็ม Smart Village
</p>

</header>



<div class="container">


<div class="toolbar">


<h3>
🔎 ค้นหา
</h3>


<input 
id="search"
placeholder="ค้นหาชื่อ หรือตำแหน่ง"
onkeyup="searchLeader()"
>


<br>


<button onclick="backupLeader()">

💾 สำรองข้อมูล

</button>



</div>



<div 
class="grid"
id="leaderList">

</div>



</div>




<div class="back">

<a href="../admin.html">

⬅ กลับ Admin

</a>

</div>





<script>


let leaders=[];


// โหลดข้อมูล

fetch("../data/leader.json")


.then(response=>response.json())


.then(data=>{


leaders=data;


showLeader(leaders);


})


.catch(error=>{


console.error(
"โหลดข้อมูลผิดพลาด",
error
);


});





function showLeader(data){


let html="";



data.forEach(item=>{


html+=`

<div class="card">


<img src="../${item.image}">



<div class="position">

${item.position}

</div>



<div class="name">

${item.name}

</div>


<p>

${item.duty || "-"}

</p>


<p>

☎️ ${item.phone || "-"}

</p>



<p>

สถานะ :
${item.status}

</p>



</div>

`;


});



document
.getElementById("leaderList")
.innerHTML=html;


}





function searchLeader(){


let key=

document
.getElementById("search")
.value
.toLowerCase();



let result =

leaders.filter(item=>{


return (

item.name
.toLowerCase()
.includes(key)

||

item.position
.toLowerCase()
.includes(key)

);


});



showLeader(result);


}





// สำรอง JSON

function backupLeader(){


let text =

JSON.stringify(
leaders,
null,
2
);



let blob =

new Blob(
[text],
{
type:"application/json"
}
);



let url=

URL.createObjectURL(blob);



let a=

document.createElement("a");


a.href=url;


a.download=
"leader-backup.json";


a.click();


URL.revokeObjectURL(url);


}



</script>



</body>

</html>
