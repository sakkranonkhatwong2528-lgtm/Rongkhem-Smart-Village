<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>จัดการทำเนียบผู้นำ | บ้านร่องเข็ม Smart Village</title>

<style>

body{
font-family:Tahoma,sans-serif;
margin:0;
background:#fff8e1;
}

header{
background:#ef6c00;
color:white;
padding:30px;
text-align:center;
}

.container{
padding:20px;
}

.box{
background:white;
padding:20px;
border-radius:20px;
margin-bottom:20px;
box-shadow:0 3px 10px #ccc;
}


input{

width:100%;
padding:10px;
margin:5px 0;
border-radius:10px;
border:1px solid #ccc;

}


button{

background:#ef6c00;
color:white;
border:none;
padding:10px 18px;
border-radius:20px;
margin:5px;
cursor:pointer;

}


.grid{

display:grid;
grid-template-columns:
repeat(auto-fit,minmax(250px,1fr));
gap:20px;

}


.card{

background:white;
padding:20px;
border-radius:20px;
text-align:center;
box-shadow:0 3px 10px #ccc;

}


.card img{

width:120px;
height:120px;
border-radius:50%;
object-fit:cover;

}


.position{

background:#ef6c00;
color:white;
padding:6px 15px;
border-radius:20px;
display:inline-block;

}


.name{

font-size:20px;
font-weight:bold;
margin:10px;

}


.delete{

background:#c62828;

}


</style>

</head>


<body>


<header>

<h1>
👥 จัดการทำเนียบผู้นำ
</h1>

<p>
บ้านร่องเข็ม Smart Village
</p>

</header>



<div class="container">


<div class="box">


<h2>
🔎 ค้นหา
</h2>


<input id="search"
placeholder="ค้นหาชื่อ / ตำแหน่ง"
onkeyup="searchLeader()">



</div>





<div class="box">


<h2>
➕ เพิ่ม / แก้ไข ผู้นำ
</h2>


<input id="id"
type="hidden">


<input id="position"
placeholder="ตำแหน่ง">


<input id="name"
placeholder="ชื่อ-นามสกุล">


<input id="duty"
placeholder="หน้าที่">


<input id="phone"
placeholder="เบอร์โทร">


<input id="image"
placeholder="รูปภาพ เช่น images/leaders/a.jpg">


<button onclick="saveLeader()">

💾 บันทึก

</button>


<button onclick="clearForm()">

ล้าง

</button>


<button onclick="downloadJSON()">

⬇ ดาวน์โหลด JSON

</button>


</div>





<div id="list" class="grid">

</div>


</div>





<script>


let leaders=[];




// โหลดข้อมูล

fetch("../data/leader.json")

.then(res=>res.json())

.then(data=>{

leaders=data;

showLeader(leaders);

})

.catch(err=>{

console.error(err);

});







function showLeader(data){


let html="";



data.forEach(item=>{


html+=`

<div class="card">


<img src="../${item.image}">


<div class="position">

${item.position}

</div>


<div class="name">

${item.name}

</div>


<p>

${item.duty || ""}

</p>


<p>

☎️ ${item.phone || "-"}

</p>



<button onclick="editLeader(${item.id})">

✏️ แก้ไข

</button>


<button class="delete"
onclick="deleteLeader(${item.id})">

🗑 ลบ

</button>


</div>


`;


});


document.getElementById("list").innerHTML=html;


}







function editLeader(id){


let item=

leaders.find(x=>x.id==id);



if(!item)return;



document.getElementById("id").value=item.id;

document.getElementById("position").value=item.position;

document.getElementById("name").value=item.name;

document.getElementById("duty").value=item.duty || "";

document.getElementById("phone").value=item.phone || "";

document.getElementById("image").value=item.image || "";


}







function saveLeader(){


let id=

document.getElementById("id").value;



if(id){


let item=

leaders.find(x=>x.id==id);



item.position=
position.value;


item.name=
name.value;


item.duty=
duty.value;


item.phone=
phone.value;


item.image=
image.value;



}else{


leaders.push({

id:Date.now(),

position:position.value,

name:name.value,

duty:duty.value,

phone:phone.value,

image:image.value,

status:"active"


});


}



showLeader(leaders);

clearForm();


}







function deleteLeader(id){


leaders=

leaders.filter(
x=>x.id!=id
);


showLeader(leaders);


}







function searchLeader(){


let key=

search.value.toLowerCase();



let result=

leaders.filter(x=>


x.name.toLowerCase().includes(key)

||

x.position.toLowerCase().includes(key)


);



showLeader(result);


}








function clearForm(){


id.value="";

position.value="";

name.value="";

duty.value="";

phone.value="";

image.value="";


}








function downloadJSON(){


let data=

JSON.stringify(
leaders,
null,
2
);


let blob=

new Blob(
[data],
{
type:"application/json"
}
);



let url=

URL.createObjectURL(blob);



let a=

document.createElement("a");


a.href=url;


a.download="leader-update.json";


a.click();


}



</script>


</body>

</html>
