<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>จัดการทำเนียบผู้นำ | บ้านร่องเข็ม Smart Village</title>

<style>

body{
font-family:Tahoma,sans-serif;
margin:0;
background:#f1f8e9;
}

header{
background:#2e7d32;
color:white;
padding:20px;
text-align:center;
}

.container{
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:20px;
margin-bottom:20px;
box-shadow:0 3px 10px #ccc;
}

input,select,textarea{

width:95%;
padding:12px;
margin:8px 0;
border-radius:10px;
border:1px solid #ccc;

}

button{

background:#2e7d32;
color:white;
border:0;
padding:12px 20px;
border-radius:20px;

}

.preview{

width:150px;
height:150px;
border-radius:50%;
object-fit:cover;
border:3px solid #2e7d32;

}

.leader{

background:#fafafa;
padding:15px;
border-radius:15px;
margin-top:15px;

}


</style>

</head>


<body>


<header>

<h1>
👥 จัดการทำเนียบผู้นำ
</h1>

<p>
บ้านร่องเข็ม Smart Village
</p>

</header>



<div class="container">


<div class="card">


<h2>
➕ เพิ่มข้อมูลผู้นำ
</h2>


<input id="name"
placeholder="ชื่อ - นามสกุล">


<input id="position"
placeholder="ตำแหน่ง">


<input id="duty"
placeholder="หน้าที่รับผิดชอบ">


<input id="phone"
placeholder="เบอร์โทร">



<label>
📷 เลือกรูปภาพ
</label>


<input 
type="file"
accept="image/*"
onchange="previewImage(event)"
>


<br>


<img 
id="preview"
class="preview"
src="images/leader.jpg"
>



<br><br>


<button onclick="saveLeader()">

💾 บันทึก

</button>



</div>



<div class="card">


<h2>
📋 รายชื่อผู้นำ
</h2>


<div id="list">

</div>


</div>



</div>




<script>


let leaders=[];



function previewImage(event){

let img=document.getElementById("preview");


img.src =
URL.createObjectURL(
event.target.files[0]
);

}





function saveLeader(){


let data={

name:
document.getElementById("name").value,


position:
document.getElementById("position").value,


duty:
document.getElementById("duty").value,


phone:
document.getElementById("phone").value,


image:
document.getElementById("preview").src

};


leaders.push(data);


show();


alert("บันทึกข้อมูลแล้ว");


}





function show(){


let html="";


leaders.forEach(l=>{


html+=`

<div class="leader">


<img 
src="${l.image}"
class="preview"
>


<h3>
${l.position}
</h3>


<p>
${l.name}
</p>


<p>
${l.duty}
</p>


<p>
☎️ ${l.phone}
</p>


</div>


`;


});


document.getElementById("list").innerHTML=html;


}


</script>



</body>

</html>
