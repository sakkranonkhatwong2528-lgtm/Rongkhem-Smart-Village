<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
จัดการผู้นำและคณะทำงาน | บ้านร่องเข็ม Smart Village
</title>


<style>

body{

margin:0;
font-family:Tahoma,sans-serif;
background:#e8eaf6;

}


header{

background:#283593;
color:white;
padding:30px;
text-align:center;

}


.container{

padding:20px;

}


.card{

background:white;
padding:25px;
border-radius:20px;
box-shadow:0 4px 12px #ccc;
margin-bottom:20px;

}


h2{

color:#283593;

}


input,select{

width:100%;
padding:12px;
margin:10px 0;
border-radius:10px;
border:1px solid #ccc;
box-sizing:border-box;

}


button{

background:#283593;
color:white;
border:none;
padding:12px 30px;
border-radius:20px;

}


.person{

background:#e8eaf6;
padding:15px;
border-radius:15px;
margin-top:15px;

}


.back{

text-align:center;
margin:30px;

}


.back a{

background:#283593;
color:white;
padding:12px 25px;
border-radius:20px;
text-decoration:none;

}


</style>

</head>


<body>



<header>

<h1>
👥 จัดการทำเนียบผู้นำ
</h1>

<p>
บ้านร่องเข็ม Smart Village
</p>

</header>





<div class="container">



<div class="card">


<h2>
➕ เพิ่มรายชื่อบุคลากร
</h2>



<input 
id="name"
placeholder="ชื่อ - นามสกุล">



<select id="position">

<option>
เลือกตำแหน่ง
</option>

<option>
ผู้ใหญ่บ้าน
</option>

<option>
ผู้ช่วยผู้ใหญ่บ้าน
</option>

<option>
สมาชิก อบต.
</option>

<option>
ประธาน อสม.
</option>

<option>
ประธานผู้สูงอายุ
</option>

<option>
ชรบ.
</option>

<option>
อปพร.
</option>

<option>
คณะกรรมการหมู่บ้าน
</option>

<option>
ที่ปรึกษาผู้ทรงคุณวุฒิ
</option>

</select>



<input
id="phone"
placeholder="เบอร์ติดต่อ">



<input
id="image"
placeholder="ชื่อไฟล์รูป เช่น leader1.jpg">



<button onclick="saveLeader()">

💾 บันทึกข้อมูล

</button>



</div>





<div class="card">

<h2>
📋 รายชื่อคณะทำงาน
</h2>


<div id="leaderList">

</div>


</div>



</div>





<div class="back">

<a href="admin-dashboard.html">

⚙️ กลับ Dashboard

</a>

</div>






<script>


showLeader();



function saveLeader(){



let leader={


name:
document.getElementById("name").value,


position:
document.getElementById("position").value,


phone:
document.getElementById("phone").value,


image:
document.getElementById("image").value


};



if(leader.name==""){

alert("กรุณาใส่ชื่อ");

return;

}



let data=

JSON.parse(
localStorage.getItem("leader")
) || [];



data.push(leader);



localStorage.setItem(
"leader",
JSON.stringify(data)
);



alert("เพิ่มข้อมูลเรียบร้อย");


location.reload();



}




function showLeader(){



let data=

JSON.parse(
localStorage.getItem("leader")
) || [];



let html="";



data.forEach(function(item){



html += `


<div class="person">


<h3>
👤 ${item.name}
</h3>


<p>
ตำแหน่ง :
${item.position}
</p>


<p>
โทร :
${item.phone}
</p>


<p>
รูป :
${item.image}
</p>



</div>


`;



});



document.getElementById("leaderList")
.innerHTML=html;



}



</script>



</body>

</html>
