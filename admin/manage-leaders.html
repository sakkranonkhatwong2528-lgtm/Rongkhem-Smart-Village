<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>จัดการทำเนียบผู้นำ</title>

<style>

body{
font-family:Tahoma,sans-serif;
background:#f1f8e9;
margin:0;
}

header{
background:#2e7d32;
color:white;
padding:20px;
text-align:center;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.box{
background:white;
padding:20px;
border-radius:15px;
margin-bottom:20px;
box-shadow:0 3px 10px #ccc;
}

input,textarea{
width:100%;
padding:12px;
margin:8px 0;
border-radius:8px;
border:1px solid #ccc;
box-sizing:border-box;
}

button{
background:#2e7d32;
color:white;
border:0;
padding:10px 18px;
border-radius:10px;
cursor:pointer;
}

.edit{
background:#1565c0;
}

.delete{
background:#c62828;
}

.leader{
display:flex;
gap:20px;
padding:15px;
border-bottom:1px solid #ddd;
}

.leader img{
width:100px;
height:100px;
border-radius:50%;
object-fit:cover;
}

</style>

</head>


<body>


<header>

<h2>👥 จัดการทำเนียบผู้นำ</h2>

<p>🏡 บ้านร่องเข็ม Smart Village</p>

</header>



<div class="container">


<div class="box">

<h3>➕ เพิ่ม / แก้ไขข้อมูลผู้นำ</h3>


<input id="name" placeholder="ชื่อ - นามสกุล">


<input id="position" placeholder="ตำแหน่ง">


<textarea id="duty"
placeholder="หน้าที่รับผิดชอบ"></textarea>


<input id="phone"
placeholder="เบอร์โทร">


📷 รูปภาพ

<input id="image" type="file" accept="image/*">


<button onclick="saveLeader()">

💾 บันทึกข้อมูล

</button>


</div>



<div class="box">

<h3>📋 รายชื่อผู้นำ</h3>

<div id="list">
กำลังโหลด...
</div>


</div>


<button onclick="logout()">

🚪 ออกจากระบบ

</button>



</div>



<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>


<script src="../js/firebase-config.js"></script>



<script>


// ตรวจสอบ Login

if(localStorage.getItem("adminLogin")!="true"){

location.href="login.html";

}


let editID=null;



async function saveLeader(){


let name=
nameInput().value;


let position=
document.getElementById("position").value;


let duty=
document.getElementById("duty").value;


let phone=
document.getElementById("phone").value;


let file=
document.getElementById("image").files[0];



let image="";



if(file){


let ref=
storage.ref(
"leaders/"+Date.now()+file.name
);


await ref.put(file);


image=
await ref.getDownloadURL();


}




if(editID){


await db.collection("leaders")
.doc(editID)
.update({

name,
position,
duty,
phone,
...(image && {image})

});


alert("แก้ไขข้อมูลแล้ว");


editID=null;


}

else{


await db.collection("leaders")
.add({

name,
position,
duty,
phone,
image,
created:new Date()

});


alert("เพิ่มข้อมูลแล้ว");


}



clearForm();

loadLeaders();


}




function nameInput(){

return document.getElementById("name");

}



function clearForm(){

nameInput().value="";

position.value="";

duty.value="";

phone.value="";

image.value="";

}



async function loadLeaders(){


let snap=
await db.collection("leaders").get();


let data=[];


snap.forEach(doc=>{

data.push({

id:doc.id,
...doc.data()

});


});



let order={

"ผู้ใหญ่บ้าน":1,
"ผู้ช่วยผู้ใหญ่บ้าน":2,
"สมาชิกสภา อบต.":3,
"ประธาน อสม.":4,
"ประธานผู้สูงอายุ":5,
"ประธาน ชรบ.":6,
"ประธาน อปพร.":7

};



data.sort((a,b)=>
(order[a.position]||99)
-
(order[b.position]||99)
);



let html="";


data.forEach(l=>{


html+=`

<div class="leader">


${l.image?
`<img src="${l.image}">`
:
"📷"}

<div>

<b>${l.name}</b><br>

🏛️ ${l.position}<br>

📋 ${l.duty}<br>

☎️ ${l.phone}

<br><br>

<button class="edit"
onclick="editLeader('${l.id}')">

✏️ แก้ไข

</button>


<button class="delete"
onclick="deleteLeader('${l.id}')">

🗑️ ลบ

</button>


</div>


</div>


`;

});


document.getElementById("list").innerHTML=html;


}



async function editLeader(id){


let doc=
await db.collection("leaders")
.doc(id)
.get();


let l=doc.data();


editID=id;


name.value=l.name;

position.value=l.position;

duty.value=l.duty;

phone.value=l.phone;


}



async function deleteLeader(id){


if(confirm("ต้องการลบข้อมูลหรือไม่?")){


await db.collection("leaders")
.doc(id)
.delete();


loadLeaders();


}

}



function logout(){

localStorage.removeItem("adminLogin");

location.href="login.html";

}



loadLeaders();


</script>


</body>
</html>
