<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
จัดการทำเนียบผู้นำ | บ้านร่องเข็ม Smart Village
</title>


<style>


body{

margin:0;
font-family:Tahoma,sans-serif;
background:#fff3e0;

}



header{

background:#e65100;
color:white;
padding:30px;
text-align:center;

}



.container{

padding:20px;

}



.card{

background:white;
padding:25px;
border-radius:25px;
box-shadow:0 4px 12px #ccc;

}



input,textarea,select{

width:100%;
padding:12px;
margin:10px 0;
border-radius:10px;
border:1px solid #ccc;
box-sizing:border-box;

}



button{

background:#e65100;
color:white;
padding:12px 30px;
border:none;
border-radius:20px;

}



.item{

background:#fff3e0;
padding:15px;
margin-top:15px;
border-radius:15px;

}



.delete{

background:#c62828;
color:white;
padding:8px 15px;
border-radius:15px;
border:none;

}



.back{

text-align:center;
margin:30px;

}



.back a{

background:#e65100;
color:white;
padding:12px 25px;
border-radius:20px;
text-decoration:none;

}


</style>


</head>




<body>



<header>


<h1>
👥 จัดการทำเนียบผู้นำ
</h1>


<p>
Admin บ้านร่องเข็ม Smart Village
</p>


</header>






<div class="container">



<div class="card">



<h2>
➕ เพิ่มข้อมูลบุคลากร
</h2>




<label>
ชื่อ - นามสกุล
</label>


<input id="name"
placeholder="เช่น นายสมชาย ใจดี">





<label>
ตำแหน่ง
</label>


<select id="position">


<option>
ผู้ใหญ่บ้าน
</option>


<option>
ผู้ช่วยผู้ใหญ่บ้าน
</option>


<option>
สมาชิกสภา อบต.
</option>


<option>
ประธาน อสม.
</option>


<option>
ประธานผู้สูงอายุ
</option>


<option>
ชรบ.
</option>


<option>
อปพร.
</option>


<option>
คณะกรรมการหมู่บ้าน
</option>


<option>
ที่ปรึกษาผู้ทรงคุณวุฒิ
</option>


</select>





<label>
หน้าที่รับผิดชอบ
</label>


<textarea
id="duty"
rows="4"
placeholder="รายละเอียดหน้าที่">
</textarea>





<label>
เบอร์โทรศัพท์
</label>


<input id="phone"
placeholder="08xxxxxxxx">





<label>
ชื่อไฟล์รูปภาพ
</label>


<input id="image"
placeholder="เช่น leader1.jpg">






<button onclick="saveLeader()">

💾 บันทึกข้อมูล

</button>




</div>








<div class="card">


<h2>
📋 รายชื่อปัจจุบัน
</h2>


<div id="list">

</div>


</div>





</div>







<div class="back">

<a href="admin-dashboard.html">

⚙️ กลับ Dashboard

</a>

</div>









<script>


let leaders =

JSON.parse(

localStorage.getItem("leaders")

)||[];





showList();





function saveLeader(){



let data={


name:

document.getElementById("name").value,


position:

document.getElementById("position").value,


duty:

document.getElementById("duty").value,


phone:

document.getElementById("phone").value,


image:

document.getElementById("image").value


};




leaders.push(data);



localStorage.setItem(

"leaders",

JSON.stringify(leaders)

);




alert("เพิ่มข้อมูลเรียบร้อย");



showList();



}





function showList(){



let html="";



leaders.forEach(function(item,index){



html +=`


<div class="item">


<b>
${item.name}
</b>


<br>


ตำแหน่ง :
${item.position}


<br>


โทร :
${item.phone}


<br><br>


<button class="delete"

onclick="deleteLeader(${index})">

ลบ

</button>



</div>


`;



});



document.getElementById("list")
.innerHTML=html;



}







function deleteLeader(index){


leaders.splice(index,1);


localStorage.setItem(

"leaders",

JSON.stringify(leaders)

);


showList();


}



</script>






</body>

</html>
