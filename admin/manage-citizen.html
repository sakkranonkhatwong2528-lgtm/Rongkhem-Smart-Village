<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
จัดการข้อมูลประชาชน | Rongkhem Smart Village
</title>


<link rel="stylesheet" href="../assets/css/dashboard.css">


<style>

.form-box{

background:white;

padding:25px;

border-radius:20px;

box-shadow:0 5px 15px rgba(0,0,0,.1);

}


input{

width:100%;

padding:12px;

margin-bottom:15px;

border-radius:10px;

border:1px solid #ddd;

}



.save-btn{

background:#2e7d32;

color:white;

border:none;

padding:12px 25px;

border-radius:10px;

cursor:pointer;

}



.summary-box{

display:grid;

grid-template-columns:

repeat(auto-fit,minmax(180px,1fr));

gap:15px;

margin-bottom:25px;

}



.info-card{

background:white;

padding:20px;

border-radius:15px;

text-align:center;

box-shadow:0 5px 10px rgba(0,0,0,.08);

}



.info-card h2{

color:#2e7d32;

font-size:35px;

}


</style>


</head>



<body onload="checkLogin();loadCitizen()">



<div class="dashboard-container">



<header class="dashboard-header">


<div>

<h1>
👥 จัดการข้อมูลประชาชน
</h1>


<p>
Smart Citizen Database
</p>


</div>


<button

class="btn btn-print"

onclick="logout()">

ออกจากระบบ

</button>


</header>







<section class="section">


<h2 class="section-title">

📊 สรุปประชากร

</h2>


<div class="summary-box">


<div class="info-card">

<h2 id="total">

0

</h2>

<p>

ประชากรทั้งหมด

</p>

</div>



<div class="info-card">

<h2 id="child">

0

</h2>

<p>

เด็ก

</p>

</div>



<div class="info-card">

<h2 id="worker">

0

</h2>

<p>

วัยทำงาน

</p>

</div>



<div class="info-card">

<h2 id="elderly">

0

</h2>

<p>

ผู้สูงอายุ

</p>

</div>



</div>


</section>








<section class="section">


<h2 class="section-title">

✏️ แก้ไขข้อมูล

</h2>



<div class="form-box">



<input 
id="totalInput"
placeholder="ประชากรทั้งหมด">


<input 
id="childInput"
placeholder="จำนวนเด็ก">


<input 
id="workerInput"
placeholder="วัยทำงาน">


<input 
id="elderlyInput"
placeholder="ผู้สูงอายุ">


<button

class="save-btn"

onclick="saveCitizen()">

บันทึกข้อมูล

</button>


</div>


</section>





</div>








<script src="../assets/js/admin.js"></script>



<script>


let citizen={};





async function loadCitizen(){


const res=

await fetch("../data/citizen.json");



citizen=

await res.json();



showCitizen();


}







function showCitizen(){



document.getElementById("total").innerHTML=

citizen.total || 0;



document.getElementById("child").innerHTML=

citizen.child || 0;



document.getElementById("worker").innerHTML=

citizen.worker || 0;



document.getElementById("elderly").innerHTML=

citizen.elderly || 0;



}





function saveCitizen(){



citizen.total=

Number(

document.getElementById("totalInput").value

)||0;



citizen.child=

Number(

document.getElementById("childInput").value

)||0;



citizen.worker=

Number(

document.getElementById("workerInput").value

)||0;



citizen.elderly=

Number(

document.getElementById("elderlyInput").value

)||0;




showCitizen();



alert(

"บันทึกข้อมูลประชาชนแล้ว"

);



}



</script>



</body>

</html>
