<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
จัดการข่าว | บ้านร่องเข็ม Smart Village
</title>


<style>

body{

margin:0;
font-family:Tahoma,sans-serif;
background:#e8f5e9;

}


header{

background:#00695c;
color:white;
padding:30px;
text-align:center;

}


.container{

padding:20px;

}


.card{

background:white;
padding:25px;
border-radius:20px;
box-shadow:0 4px 12px #ccc;
margin-bottom:20px;

}


h2{

color:#00695c;

}


input,textarea{

width:100%;
padding:12px;
margin:10px 0;
border-radius:10px;
border:1px solid #ccc;
box-sizing:border-box;

}


button{

background:#00695c;
color:white;
border:none;
padding:12px 30px;
border-radius:20px;
font-size:16px;

}


.news-item{

background:#f1f8e9;
padding:15px;
margin-top:15px;
border-radius:15px;

}


.back{

text-align:center;
margin:30px;

}


.back a{

background:#00695c;
color:white;
padding:12px 25px;
border-radius:20px;
text-decoration:none;

}


</style>


</head>


<body>



<header>

<h1>
📰 จัดการข่าวประชาสัมพันธ์
</h1>

<p>
Admin : บ้านร่องเข็ม Smart Village
</p>

</header>




<div class="container">



<div class="card">

<h2>
✍️ เพิ่มข่าวใหม่
</h2>


<input 
id="title"
placeholder="หัวข้อข่าว">


<input 
id="date"
placeholder="วันที่ เช่น 18 กรกฎาคม 2569">


<textarea 
id="detail"
rows="6"
placeholder="รายละเอียดข่าว">
</textarea>



<button onclick="saveNews()">

💾 บันทึกข่าว

</button>


</div>





<div class="card">

<h2>
📋 ข่าวที่บันทึกไว้
</h2>


<div id="showNews">

</div>


</div>



</div>





<div class="back">

<a href="admin-dashboard.html">

⚙️ กลับ Dashboard

</a>

</div>






<script>


// โหลดข่าว

showNews();



function saveNews(){


let title =
document.getElementById("title").value;


let date =
document.getElementById("date").value;


let detail =
document.getElementById("detail").value;



if(title==""
|| detail==""){

alert("กรุณากรอกข้อมูลให้ครบ");

return;

}



let news =
JSON.parse(
localStorage.getItem("news")
) || [];



news.push({

title:title,

date:date,

detail:detail

});



localStorage.setItem(
"news",
JSON.stringify(news)
);



alert("บันทึกข่าวเรียบร้อย");



document.getElementById("title").value="";

document.getElementById("date").value="";

document.getElementById("detail").value="";



showNews();


}





function showNews(){


let news =
JSON.parse(
localStorage.getItem("news")
) || [];



let html="";



news.forEach(function(item){


html += `

<div class="news-item">

<h3>
${item.title}
</h3>

<p>
📅 ${item.date}
</p>

<p>
${item.detail}
</p>

</div>

`;



});



document.getElementById("showNews")
.innerHTML=html;


}



</script>



</body>

</html>
