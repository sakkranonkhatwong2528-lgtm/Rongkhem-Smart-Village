<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>
Rongkhem Smart Village Admin Login
</title>


<link rel="stylesheet" href="../assets/css/dashboard.css">


<style>

.login-box{

max-width:420px;

margin:80px auto;

background:white;

padding:35px;

border-radius:20px;

box-shadow:0 10px 30px rgba(0,0,0,.15);

}


.login-box h1{

text-align:center;

color:#2e7d32;

margin-bottom:25px;

}


input{

width:100%;

padding:14px;

margin-bottom:15px;

border-radius:10px;

border:1px solid #ddd;

font-size:16px;

}


button{

width:100%;

padding:14px;

background:#2e7d32;

color:white;

border:none;

border-radius:10px;

font-size:16px;

cursor:pointer;

}


button:hover{

background:#1b5e20;

}


#error{

color:red;

text-align:center;

margin-top:15px;

}


</style>


</head>


<body>


<div class="login-box">


<h1>
🔐 Admin Center
</h1>


<p style="text-align:center;margin-bottom:20px">

บ้านร่องเข็ม Smart Village

</p>



<input 
id="username"
placeholder="ชื่อผู้ใช้">


<input 
id="password"
type="password"
placeholder="รหัสผ่าน">



<button onclick="login()">

เข้าสู่ระบบ

</button>



<div id="error"></div>



</div>



<script src="../assets/js/admin.js"></script>


</body>

</html>
