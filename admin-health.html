<!DOCTYPE html>

<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
Admin Health | บ้านร่องเข็ม
</title>


<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="css/admin-health.css">


</head>


<body>


<header class="health-admin-header">


<h1>
🩺 ศูนย์จัดการสุขภาพชุมชน
</h1>


<p>
บ้านร่องเข็ม Smart Village
</p>


</header>






<section class="summary">


<div class="card">

<h3>
🩺 ทั้งหมด
</h3>

<h1 id="total">
0
</h1>

</div>




<div class="card">

<h3>
✅ ปกติ
</h3>

<h1 id="normal">
0
</h1>

</div>





<div class="card">

<h3>
🔎 ติดตาม
</h3>

<h1 id="follow">
0
</h1>

</div>





<div class="card">

<h3>
❤️ ดูแลพิเศษ
</h3>

<h1 id="special">
0
</h1>

</div>


</section>







<section class="form-box">


<h2>
➕ เพิ่มข้อมูลสุขภาพ
</h2>


<input id="name"
placeholder="ชื่อ-นามสกุล">


<input id="age"
type="number"
placeholder="อายุ">


<input id="house"
placeholder="บ้านเลขที่">


<input id="disease"
placeholder="โรคประจำตัว">


<select id="status">


<option>
ปกติ
</option>


<option>
ติดตาม
</option>


<option>
ดูแลพิเศษ
</option>


</select>



<button onclick="addHealth()">

บันทึก

</button>


</section>








<section class="table-box">


<h2>
📋 รายการสุขภาพ
</h2>


<table>


<thead>

<tr>

<th>
ชื่อ
</th>

<th>
โรค
</th>

<th>
สถานะ
</th>

<th>
จัดการ
</th>

</tr>

</thead>



<tbody id="healthTable">

</tbody>


</table>


</section>






<script src="js/admin-health.js"></script>


</body>

</html>
