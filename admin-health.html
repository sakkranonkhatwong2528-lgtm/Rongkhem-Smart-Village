<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
จัดการข้อมูลสุขภาพ | บ้านร่องเข็ม Smart Village
</title>


<style>

body{

margin:0;
font-family:Tahoma,sans-serif;
background:#e8f5e9;

}


header{

background:#1b5e20;
color:white;
padding:30px;
text-align:center;

}


.container{

padding:20px;

}


.card{

background:white;
padding:25px;
border-radius:25px;
box-shadow:0 4px 12px #ccc;

}



input,textarea{

width:100%;
padding:12px;
margin:10px 0;
border-radius:10px;
border:1px solid #ccc;
box-sizing:border-box;

}



button{

background:#1b5e20;
color:white;
padding:12px 30px;
border:none;
border-radius:20px;

}



.result{

background:#e8f5e9;
padding:20px;
margin-top:20px;
border-radius:20px;

}



.back{

text-align:center;
margin:30px;

}



.back a{

background:#1b5e20;
color:white;
padding:12px 25px;
border-radius:20px;
text-decoration:none;

}


</style>


</head>



<body>



<header>


<h1>
🩺 จัดการข้อมูลสุขภาพชุมชน
</h1>


<p>
Admin บ้านร่องเข็ม Smart Village
</p>


</header>







<div class="container">



<div class="card">


<h2>
📋 กรอกข้อมูลสุขภาพ
</h2>



<label>
🩺 จำนวน อสม.
</label>

<input 
id="osm"
type="number"
placeholder="เช่น 15">





<label>
👴 จำนวนผู้สูงอายุ
</label>

<input
id="elder"
type="number"
placeholder="จำนวนผู้สูงอายุ">





<label>
♿ จำนวนผู้พิการ
</label>

<input
id="disabled"
type="number"
placeholder="จำนวนผู้พิการ">





<label>
🛏 ผู้ป่วยติดบ้านติดเตียง
</label>

<input
id="bed"
type="number"
placeholder="จำนวน">





<label>
📝 หมายเหตุ / กิจกรรมสุขภาพ
</label>

<textarea
id="note"
rows="5"
placeholder="เช่น การเยี่ยมบ้าน การคัดกรองสุขภาพ">
</textarea>





<button onclick="saveHealth()">

💾 บันทึกข้อมูล

</button>





<div class="result" id="show">

</div>



</div>


</div>






<div class="back">

<a href="admin-dashboard.html">

⚙️ กลับ Dashboard

</a>

</div>






<script>



loadHealth();



function saveHealth(){



let data={


osm:

document.getElementById("osm").value,


elder:

document.getElementById("elder").value,


disabled:

document.getElementById("disabled").value,


bed:

document.getElementById("bed").value,


note:

document.getElementById("note").value


};





localStorage.setItem(

"health",

JSON.stringify(data)

);




alert("บันทึกข้อมูลสุขภาพเรียบร้อย");



showHealth();


}





function loadHealth(){


let data=

JSON.parse(

localStorage.getItem("health")

);



if(data){


document.getElementById("osm").value=data.osm;

document.getElementById("elder").value=data.elder;

document.getElementById("disabled").value=data.disabled;

document.getElementById("bed").value=data.bed;

document.getElementById("note").value=data.note;


}



showHealth();


}





function showHealth(){



let data=

JSON.parse(

localStorage.getItem("health")

);



if(!data)return;



document.getElementById("show").innerHTML=`

<h3>
ข้อมูลปัจจุบัน
</h3>

<p>
🩺 อสม. : ${data.osm} คน
</p>

<p>
👴 ผู้สูงอายุ : ${data.elder} คน
</p>

<p>
♿ ผู้พิการ : ${data.disabled} คน
</p>

<p>
🛏 ผู้ป่วยติดบ้านติดเตียง : ${data.bed} คน
</p>

<p>
📝 หมายเหตุ :
${data.note}
</p>

`;



}



</script>



</body>

</html>
