<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
จัดการองค์กรชุมชน | บ้านร่องเข็ม Smart Village
</title>


<style>


body{

margin:0;
font-family:Tahoma,sans-serif;
background:#fff8e1;

}


header{

background:#5d4037;
color:white;
padding:30px;
text-align:center;

}



.container{

padding:20px;

}



.card{

background:white;
padding:25px;
border-radius:25px;
box-shadow:0 4px 12px #ccc;
margin-bottom:20px;

}



input,textarea,select{

width:100%;
padding:12px;
margin:10px 0;
border-radius:10px;
border:1px solid #ccc;
box-sizing:border-box;

}



button{

background:#5d4037;
color:white;
padding:12px 30px;
border:none;
border-radius:20px;

}



.item{

background:#fff3e0;
padding:15px;
border-radius:15px;
margin-top:15px;

}



.delete{

background:#c62828;
color:white;
border:none;
padding:8px 15px;
border-radius:15px;

}



.back{

text-align:center;
margin:30px;

}



.back a{

background:#5d4037;
color:white;
padding:12px 25px;
border-radius:20px;
text-decoration:none;

}


</style>


</head>



<body>



<header>


<h1>
👥 จัดการองค์กรชุมชน
</h1>


<p>
Admin บ้านร่องเข็ม Smart Village
</p>


</header>







<div class="container">



<div class="card">


<h2>
➕ เพิ่มองค์กร / คณะทำงาน
</h2>





<label>
ไอคอน
</label>


<input

id="icon"

placeholder="เช่น 🩺 👮 🌾">




<label>
ชื่อองค์กร
</label>


<input

id="name"

placeholder="เช่น อสม. บ้านร่องเข็ม">





<label>
ประธาน / ผู้รับผิดชอบ
</label>


<input

id="leader"

placeholder="ชื่อประธาน">





<label>
ตำแหน่ง
</label>


<input

id="position"

placeholder="เช่น ประธาน อสม.">





<label>
หน้าที่รับผิดชอบ
</label>


<textarea

id="duty"

rows="5"

placeholder="รายละเอียดหน้าที่">

</textarea>





<label>
เบอร์ติดต่อ
</label>


<input

id="phone"

placeholder="08xxxxxxxx">






<button onclick="saveOrg()">

💾 บันทึกข้อมูล

</button>



</div>








<div class="card">


<h2>
📋 รายการองค์กร
</h2>


<div id="list">

</div>


</div>





</div>







<div class="back">


<a href="admin-dashboard.html">

⚙️ กลับ Dashboard

</a>


</div>









<script>


let org =

JSON.parse(

localStorage.getItem("organization")

)||[];





showList();







function saveOrg(){



let data={


icon:

document.getElementById("icon").value,


name:

document.getElementById("name").value,


leader:

document.getElementById("leader").value,


position:

document.getElementById("position").value,


duty:

document.getElementById("duty").value,


phone:

document.getElementById("phone").value


};




org.push(data);



localStorage.setItem(

"organization",

JSON.stringify(org)

);




alert("เพิ่มข้อมูลองค์กรเรียบร้อย");



showList();



}








function showList(){



let html="";



org.forEach(function(item,index){



html +=`

<div class="item">


<h3>

${item.icon}
${item.name}

</h3>



<p>

ประธาน :
${item.leader}

</p>


<p>

ตำแหน่ง :
${item.position}

</p>



<p>

หน้าที่ :
${item.duty}

</p>


<p>

โทร :
${item.phone}

</p>




<button class="delete"

onclick="deleteOrg(${index})">

ลบ

</button>



</div>


`;



});



document.getElementById("list")
.innerHTML=html;



}







function deleteOrg(index){



org.splice(index,1);



localStorage.setItem(

"organization",

JSON.stringify(org)

);



showList();



}



</script>






</body>

</html>
