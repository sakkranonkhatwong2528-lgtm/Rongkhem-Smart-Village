<!DOCTYPE html>

<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
Admin อสม. | บ้านร่องเข็ม
</title>


<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="css/admin-volunteer.css">


</head>


<body>


<header class="vol-admin-header">


<h1>
🩺 จัดการข้อมูล อสม.
</h1>


<p>
บ้านร่องเข็ม Smart Village
</p>


</header>





<section class="summary">


<div class="card">

<h3>
🩺 อสม.ทั้งหมด
</h3>

<h1 id="total">
0
</h1>

</div>



<div class="card">

<h3>
👥 ประชาชนที่ดูแล
</h3>

<h1 id="people">
0
</h1>

</div>


</section>







<section class="form-box">


<h2>
➕ เพิ่ม อสม.
</h2>


<input id="name"
placeholder="ชื่อ อสม.">


<input id="position"
placeholder="ตำแหน่ง">


<input id="area"
placeholder="พื้นที่รับผิดชอบ">


<input id="care"
type="number"
placeholder="จำนวนผู้ดูแล">


<button onclick="addVolunteer()">

บันทึก

</button>


</section>







<section class="table-box">


<h2>
📋 รายชื่อ อสม.
</h2>



<table>


<thead>

<tr>

<th>
ชื่อ
</th>

<th>
ตำแหน่ง
</th>

<th>
พื้นที่
</th>

<th>
ผู้ดูแล
</th>

<th>
จัดการ
</th>

</tr>

</thead>


<tbody id="volTable">


</tbody>


</table>


</section>






<script src="js/admin-volunteer.js"></script>


</body>

</html>
